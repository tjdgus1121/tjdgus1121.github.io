    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Do Hyeon', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 우주 배경 */
        .space-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #0a0a1a 25%, #0d1117 50%, #1a0f2e 75%, #0a0a12 100%);
            background-size: 400% 400%;
            animation: spaceFloat 20s ease infinite;
            z-index: -2;
        }

        @keyframes spaceFloat {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* 별 애니메이션 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite, warpSpeed 3s linear infinite;
            animation-fill-mode: backwards, backwards;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            opacity: 0;
        }

        .star::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.8), transparent);
            border-radius: 50%;
            filter: blur(2px);
        }

        /* 고정된 별 (멀리 있는 별) */
        .star.fixed {
            animation: twinkleFixed 4s infinite;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
            opacity: 0.4;
        }

        .star.fixed::after {
            display: none;
        }

        /* 거대하게 빛나는 별 */
        .star.giant {
            animation: giantTwinkle 6s infinite ease-in-out;
            box-shadow: 
                0 0 40px rgba(255, 255, 255, 1),
                0 0 80px rgba(200, 220, 255, 0.8),
                0 0 120px rgba(150, 180, 255, 0.6),
                0 0 160px rgba(100, 150, 255, 0.4);
            opacity: 0.9;
            background: radial-gradient(circle, rgba(255, 255, 255, 1) 0%, rgba(200, 220, 255, 0.8) 50%, transparent 100%);
        }

        .star.giant::after {
            display: none;
        }

        .star.giant::before {
            display: none;
        }

        /* 십자 빛 효과 (1개만) */
        .star.giant.cross::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.8), transparent);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            display: block;
        }

        .star.giant.cross::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            width: 120px;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.8), transparent);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            display: block;
        }

        /* 타원형 빛 효과 (2개) - radial-gradient 방식 */
        .star.giant.oval::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(var(--scale, 1));
            width: 280px;
            height: 220px;
            background:
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.95), transparent 5%),
                radial-gradient(ellipse at 50% 50%, rgba(245, 250, 255, 0.85), transparent 10%),
                radial-gradient(ellipse at 50% 50%, rgba(235, 245, 255, 0.7), transparent 15%),
                radial-gradient(ellipse at 50% 50%, rgba(225, 240, 255, 0.55), transparent 20%),
                radial-gradient(ellipse at 50% 50%, rgba(215, 235, 255, 0.45), transparent 25%),
                radial-gradient(ellipse at 50% 50%, rgba(205, 230, 250, 0.35), transparent 30%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 230, 200, 0.23), transparent 40%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 220, 180, 0.16), transparent 52%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 210, 160, 0.09), transparent 68%);
            mix-blend-mode: screen;
            opacity: 0.9;
            display: block;
            filter: blur(1.5px);
        }

        .star.giant.oval::after {
            display: none;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @keyframes twinkleFixed {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        @keyframes giantTwinkle {
            0%, 100% { 
                opacity: 0.8;
                transform: scale(1);
            }
            50% { 
                opacity: 1;
                transform: scale(1.1);
            }
        }

        @keyframes warpSpeed {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(2);
                opacity: 0;
            }
        }

        /* 뇌 신경망 효과 */
        .neural-network {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        /* 메인 컨테이너 */
        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: containerFloat 8s ease-in-out infinite;
        }

        @keyframes containerFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);

        }

        /* 타이틀 */
        .title {

            color: white;
            margin-bottom: 60px;
        }

        .title h1 {
            font-size: 5rem;
            font-weight: 500;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00d4ff, #7b68ee, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: flickerOn 2s ease-out forwards;
            opacity: 0;
        }

        .title p {
            font-size: 1.4rem;
            color: #b0c4de;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            opacity: 0;
            animation: fadeInDown 1s ease-out 2s forwards;
        }

        /* 형광등 깜빡임 애니메이션 */
        @keyframes flickerOn {
            0% {
                opacity: 0;
            }
            10% {
                opacity: 0;
                text-shadow: none;
            }
            10.1% {
                opacity: 1;
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            }
            10.2% {
                opacity: 0;
                text-shadow: none;
            }
            20% {
                opacity: 0;
                text-shadow: none;
            }
            20.1% {
                opacity: 1;
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8),
                            0 0 60px rgba(123, 104, 238, 0.6);
            }
            20.6% {
                opacity: 0;
                text-shadow: none;
            }
            30% {
                opacity: 0;
                text-shadow: none;
            }
            30.1% {
                opacity: 1;
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8),
                            0 0 60px rgba(123, 104, 238, 0.6);
            }
            30.5% {
                opacity: 1;
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8),
                            0 0 60px rgba(123, 104, 238, 0.6);
            }
            30.6% {
                opacity: 0;
                text-shadow: none;
            }
            45% {
                opacity: 0;
                text-shadow: none;
            }
            45.1% {
                opacity: 1;
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8),
                            0 0 60px rgba(123, 104, 238, 0.6),
                            0 0 90px rgba(123, 104, 238, 0.4);
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.9),
                            0 0 60px rgba(123, 104, 238, 0.7),
                            0 0 90px rgba(123, 104, 238, 0.5);
            }
            55% {
                opacity: 1;
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.9),
                            0 0 60px rgba(123, 104, 238, 0.7),
                            0 0 90px rgba(123, 104, 238, 0.5);
            }
            55.1% {
                opacity: 0;
                text-shadow: none;
            }
            57% {
                opacity: 0;
                text-shadow: none;
            }
            57.1% {
                opacity: 1;
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.9),
                            0 0 60px rgba(123, 104, 238, 0.7),
                            0 0 90px rgba(123, 104, 238, 0.5);
            }
            60% {
                opacity: 1;
                text-shadow: 0 0 30px rgba(255, 255, 255, 1),
                            0 0 60px rgba(123, 104, 238, 0.8),
                            0 0 100px rgba(123, 104, 238, 0.6);
            }
            100% {
                opacity: 1;
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
                            0 0 40px rgba(123, 104, 238, 0.4);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 카드 컨테이너 */
        .cards-wrapper {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
        }

        .card-container {
            width: 400px;
            height: 500px;
            perspective: 1000px;
            opacity: 0;
            transform: translateY(50px);
        }

        .card-container.show {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .card-container:nth-child(2) {
            animation-delay: 0.2s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: cardFloat 6s ease-in-out infinite;
        }

        .card-container:nth-child(1) .card {
            animation-delay: 0s;
        }

        .card-container:nth-child(2) .card {
            animation-delay: 1s;
        }

        @keyframes cardFloat {
            0%, 100% {
                transform: translateY(0px) translateX(0px);
            }
            33% {
                transform: translateY(-8px) translateX(4px);
            }
            66% {
                transform: translateY(4px) translateX(-4px);
            }
        }

        .card:hover {
            transform: translateY(-10px) !important;
            box-shadow: 0 12px 48px rgba(123, 104, 238, 0.4);
            border-color: rgba(123, 104, 238, 0.5);
        }

        /* 카드 공통 스타일 */
        .card {
            padding: 20px;
        }

        .card .image-wrapper {
            width: 100%;
            height: 280px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
        }

        .card .image-wrapper img,
        .card .image-wrapper .icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card .image-wrapper .icon {
            font-size: 8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            object-fit: unset;
        }

        .card:hover .image-wrapper img,
        .card:hover .image-wrapper .icon {
            transform: scale(1.1);
        }

        .card h3 {
            color: white;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .card p {
            color: #b0c4de;
            text-align: center;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .card .access-button {
            width: 100%;
            padding: 14px 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card .access-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);

        /* 반응형 */
        @media (max-width: 768px) {
            .title h1 {
                font-size: 3rem;
            }

            .title p {
                font-size: 1.1rem;
            }

            .card-container {
                width: 100%;
                max-width: 400px;
            }

            .cards-wrapper {
                gap: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- 우주 배경 -->
    <div class="space-background"></div>
    <div class="stars" id="stars"></div>
    <canvas class="neural-network" id="neuralCanvas"></canvas>

    <!-- 메인 컨테이너 -->
    <div class="main-container">
        <div class="title">
            <h1>인공지능 수학</h1>
            <p>인공지능 속 숨은 수학적 원리를 알아봅시다.</p>
        </div>

        <div class="cards-wrapper">
            <!-- 텍스트 분석 카드 -->
            <div class="card-container">
                <div class="card" onclick="goToTextPage()">
                    <div class="image-wrapper">
                        <img src="https://images.unsplash.com/photo-1457369804613-52c61a468e7d?w=400&h=300&fit=crop" alt="Text Analysis">
                    </div>
                    <h3>텍스트 분석</h3>
                    <p>인공지능을 활용한 맞춤형 텍스트 분석으로 개념을 이해하고 문제 해결 능력을 키워보세요.</p>
                    <button class="access-button">접속하기</button>
                </div>
            </div>

            <!-- 이미지 분석 카드 -->
            <div class="card-container">
                <div class="card" onclick="goToImagePage()">
                    <div class="image-wrapper">
                        <img src="https://images.unsplash.com/photo-1555949963-aa79dcee981c?w=400&h=300&fit=crop" alt="AI Image Analysis">
                    </div>
                    <h3>이미지 분석</h3>
                    <p>수학적 개념을 시각적으로 탐구하고 이미지 분석 기술을 학습합니다.</p>
                    <button class="access-button">접속하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 별 생성
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const movingStars = 150; // 움직이는 별
            const fixedStars = 200;  // 고정된 별 (멀리 있는 별)

            // 거대하게 빛나는 별 생성 (십자가 1개, 타원형 2개)
            // 십자가 빛 별 1개
            const crossStar = document.createElement('div');
            crossStar.className = 'star giant cross';
            const crossSize = 5 + Math.random() * 2;
            crossStar.style.width = crossSize + 'px';
            crossStar.style.height = crossSize + 'px';
            crossStar.style.left = (25 + Math.random() * 50) + '%';
            crossStar.style.top = (25 + Math.random() * 50) + '%';
            crossStar.style.animationDuration = (5 + Math.random() * 3) + 's';
            crossStar.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(crossStar);

            // 타원형 빛 별 2개 (크기 다르게, 멀리 배치)
            for (let i = 0; i < 2; i++) {
                const ovalStar = document.createElement('div');
                ovalStar.className = 'star giant oval';
                const ovalSize = 4 + Math.random() * 3;
                ovalStar.style.width = ovalSize + 'px';
                ovalStar.style.height = ovalSize + 'px';
                
                // 첫 번째는 왼쪽 영역, 두 번째는 오른쪽 영역에 배치
                if (i === 0) {
                    ovalStar.style.left = (10 + Math.random() * 25) + '%'; // 10%~35%
                    ovalStar.style.top = (20 + Math.random() * 50) + '%';
                    ovalStar.style.setProperty('--scale', '1');
                } else {
                    ovalStar.style.left = (65 + Math.random() * 25) + '%'; // 65%~90%
                    ovalStar.style.top = (25 + Math.random() * 45) + '%';
                    ovalStar.style.setProperty('--scale', '0.7');
                }
                
                ovalStar.style.animationDuration = (5 + Math.random() * 3) + 's';
                ovalStar.style.animationDelay = Math.random() * 3 + 's';
                
                starsContainer.appendChild(ovalStar);
            }

            // 고정된 별 생성 (멀리 있어서 움직이지 않음)
            for (let i = 0; i < fixedStars; i++) {
                const star = document.createElement('div');
                star.className = 'star fixed';
                
                const size = Math.random() * 2 + 0.5; // 작은 크기
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                
                const twinkleDuration = 3 + Math.random() * 3; // 3~6초
                star.style.animationDuration = twinkleDuration + 's';
                star.style.animationDelay = Math.random() * 5 + 's';
                
                starsContainer.appendChild(star);
            }

            // 움직이는 별 생성 (가까이 있어서 움직임)
            for (let i = 0; i < movingStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                
                // 화면 중앙 영역의 여러 곳에서 시작 (30%~70% 범위)
                const startX = 30 + Math.random() * 40; // 30% ~ 70%
                const startY = 30 + Math.random() * 40; // 30% ~ 70%
                star.style.left = startX + '%';
                star.style.top = startY + '%';
                
                // 시작점에서 바깥으로 향하는 방향 계산
                const centerX = 50;
                const centerY = 50;
                const dx = startX - centerX;
                const dy = startY - centerY;
                const angle = Math.atan2(dy, dx);
                
                // 이동 거리
                const distance = 150 + Math.random() * 100; // 150~250
                
                const tx = Math.cos(angle) * distance + 'vw';
                const ty = Math.sin(angle) * distance + 'vh';
                
                star.style.setProperty('--tx', tx);
                star.style.setProperty('--ty', ty);
                
                // 속도를 더 느리게 조정 (8~15초)
                const duration = 8 + Math.random() * 7; // 8~15초
                const delay = Math.random() * 8; // 0~8초
                
                star.style.animationDuration = `${3 + Math.random() * 2}s, ${duration}s`;
                star.style.animationDelay = `${Math.random() * 4}s, ${delay}s`;
                
                starsContainer.appendChild(star);
            }
        }

        // 신경망 그리기
        function drawNeuralNetwork() {
            const canvas = document.getElementById('neuralCanvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const nodes = [];
            const numberOfNodes = 50;

            // 노드 생성
            for (let i = 0; i < numberOfNodes; i++) {
                nodes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.2,
                    vy: (Math.random() - 0.5) * 0.2
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 노드 업데이트 및 그리기
                nodes.forEach((node, i) => {
                    node.x += node.vx;
                    node.y += node.vy;

                    if (node.x < 0 || node.x > canvas.width) node.vx *= -1;
                    if (node.y < 0 || node.y > canvas.height) node.vy *= -1;

                    // 연결선 그리기
                    nodes.forEach((otherNode, j) => {
                        if (i !== j) {
                            const dx = node.x - otherNode.x;
                            const dy = node.y - otherNode.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance < 150) {
                                ctx.strokeStyle = `rgba(123, 104, 238, ${1 - distance / 150})`;
                                ctx.lineWidth = 1;
                                ctx.beginPath();
                                ctx.moveTo(node.x, node.y);
                                ctx.lineTo(otherNode.x, otherNode.y);
                                ctx.stroke();
                            }
                        }
                    });

                    // 노드 그리기
                    ctx.fillStyle = 'rgba(123, 104, 238, 0.8)';
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                });

                requestAnimationFrame(animate);
            }

            animate();
        }

        // 카드 나타내기
        function showCards() {
            setTimeout(() => {
                const cards = document.querySelectorAll('.card-container');
                cards.forEach(card => card.classList.add('show'));
            }, 2000);
        }

        // 페이지 이동 함수
        function goToTextPage() {
            alert('텍스트 분석 페이지로 이동합니다.');
            // window.location.href = 'text-analysis.html';
        }

        function goToImagePage() {
            window.location.href = 'https://tjdgus1121.github.io/indeximage';
        }

        // 윈도우 리사이즈 처리
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('neuralCanvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 초기화
        createStars();
        drawNeuralNetwork();
        showCards();
    </script>
</body>
