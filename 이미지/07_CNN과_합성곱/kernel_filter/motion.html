<style>
/* Layout: one 16:9 film frame, a thin player bar and chapter strip beneath. Single dark look on purpose (screening room). */
:root{
  color-scheme:dark;
  --room:#06080D; --screen:#0E1320; --fg:#F3EFE6; --dim:#8C93A3; --line:#232B3B;
  --ker:#FF7A2F; --prod:#A98BFF; --sum:#3BE0A6;
  --sans:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--room);color:var(--fg)}
body{font:15px/1.5 var(--sans)}
.wrap{padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
.col{width:max(min(100%,calc((100vh - 150px) * 16 / 9)),min(100%,520px));display:flex;flex-direction:column;gap:10px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hd b{font:600 13px var(--mono);letter-spacing:.18em;color:var(--ker)}
.hd span{font:500 13px var(--mono);color:var(--dim)}
.player{position:relative;border-radius:12px;overflow:hidden;background:var(--screen);box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.55)}
#cv{display:block;width:100%;aspect-ratio:16/9;cursor:pointer}
.player:fullscreen{display:grid;place-items:center;border-radius:0;background:#000}
.player:fullscreen #cv{width:min(100vw,calc(100vh * 16 / 9))}
.big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;border:0;background:rgba(243,239,230,.92);color:#0E1320;font-size:30px;padding-left:6px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.bar{display:flex;align-items:center;gap:12px}
.bar button{border:0;background:transparent;color:var(--fg);font:600 15px var(--mono);cursor:pointer;padding:6px 8px;border-radius:8px;min-width:40px}
.bar button:hover{background:var(--line)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ker);outline-offset:2px}
.time{font:500 13px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
#seek{flex:1;min-width:0;accent-color:var(--ker);height:4px}
.rate{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.rate button{min-width:34px;padding:6px 6px}
#rate{min-width:58px;font-variant-numeric:tabular-nums;color:var(--ker)}
.chapters{display:flex;flex-wrap:wrap;gap:6px}
.chapters button{border:1px solid var(--line);background:transparent;color:var(--dim);font:500 13px var(--sans);border-radius:999px;padding:4px 12px;cursor:pointer}
.chapters button i{font:500 11px var(--mono);font-style:normal;margin-right:6px;opacity:.7}
.chapters button.on{color:var(--fg);border-color:var(--fg)}
#voice,#sfx{display:inline-grid;place-items:center;color:var(--ker)}
#voice .mute,#voice.off .wave,#sfx .mute{display:none}
#voice.off,#sfx.off{color:var(--dim)}
#voice.off .mute,#sfx.off .mute{display:inline}
/* 좁은 화면: 1줄 재생·시간·음성·전체 화면 / 2줄 탐색 막대·배속 */
@media (max-width:560px){
  .bar{flex-wrap:wrap;gap:4px 8px}
  .bar::after{content:"";order:45;flex-basis:100%;height:0}
  #pp{order:10} .time{order:20} #voice{order:30;margin-left:auto} #sfx{order:35} #fs{order:40}
  #seek{order:50} .rate{order:60}
  .bar button{min-width:36px;padding:6px}
  .rate button{min-width:30px}
  #rate{min-width:48px}
}
</style>

  // ───── 장면 6: 왜 12×8일까? (훑기가 끝난 화면 위에 FZ ~ FZ+DS)

      T('140칸 → 32칸', 960, y0 + IH * C + 108, { f: MONO, w: 500, size: 28, c: DIM, a: eo(p(s, 7.9, 8.2)) * la * bA });

    K('겹칠수록 계속 작아진다', 960, 975, { f: BH, size: 84 }, gt, FZ + 5.3, { stg: .05, out: [FZ + 8.3, FZ + 8.7] });
    K('가장자리 정보는 덜 읽힌다', 960, 975, { f: BH, size: 84, col: i => i <= 3 ? RED : FG }, gt, FZ + 8.8, { stg: .05, out: [FZ + 10.3, FZ + 10.7] });

    // ── 패딩 (10.8–17s): 0을 한 줄 두르면 모서리도 커널 가운데에 올 수 있어 크기가 그대로
    const cA = eo(p(s, 10.8, 11.2)) * (1 - p(s, 16.3, 16.8));
    if (cA > .001) {
      const C = 38, gx = 120 + C, gy = 262 + C, ox = 1262, oy = 300;
      for (let r = -1; r <= IH; r++) for (let c = -1; c <= IW; c++) {

          cell(gx + c * C, gy + r * C, C - 3, { sc: back(p(s, 10.9 + (r + c) * .01, 11.3 + (r + c) * .01)), a: cA, fill: GRAY[v], txt: String(v), ts: 15, tc: v > 5 ? BG : FG });
        }
      }
      T('0으로 한 줄 둘러싸기 = 패딩', gx + IW * C / 2, gy - C - 30, { f: NOTO, w: 700, size: 26, c: INL, a: cA * eo(p(s, 11.6, 12.0)) });

  const TEXT = '합성곱이미지를읽는가장작은계산흑백픽셀이부분을확대컴퓨터가보는한하면숫자로되어있다커널필터세로경계찾는개겹친다같은자리끼리곱한다하기모두더한칸씩훑기옮기며반복으면서특징맵채운다입력값합결과읽에쳐보인밝음어둠확바뀌곳서커진라선드러나요정리은의스스로배운학습으로찾아내는가중치아다마르왜작아지는유진짜사진원본흑백얼굴옆선콧대눈썹입줄기또렷거의사라진다특징밖나갈수없어서조금가운데올곳크기적용바뀐다사람에서는도확대하면밝기숫자진짜읽는다전체를한칸씩훑으면가로바꾸면윤곽만얼굴에는다른커널을같은자리를읽어도결과는제각각블러샤픈엣지이웃과평균흐릿하게가운데강조또렷주변곳윤곽선번원본곱해서모두더하면읽은값겹칠수록계속작아진다가장자리정보덜읽힌다픽셀마다횟수모서리는가운데는둘러주면크기그대로패딩으로줄둘러싸기새로생긴덕분테두리합성곱번이미지왜세로선만보일까왼쪽오른쪽줄은더하고빼고가운데보지않음네가지경우를계산해보면다를때만값이커진다밝다반대가로경계평평한곳초록파랑같다상쇄생각해보기잠깐멈추고이야기해보세요의답은다음장면에서확인돌리면무엇을찾을까서로바꾸면결과색어떻게될대각선숫자개놓엣지모두더하면이에요그럼어떤위아래처음엔아무숫자나학습하면쓸모있는로필터하나특징맵한장바꿀때마다다른특징이개장AI는이모두보고어떤가스스로배운다층을쌓으며배우는것선경계질감모양무늬눈코얼굴예시로만든학습중눈일까코귀어두운점가로줄밝은세로줄곡선조각작은무늬마다커널이하나씩맞으면값이크게나온다평평한곳은이런칸에서찾은조합부위위에아래두개길고굵은없음얼굴바깥쪽개념을보여주는그림실제많은얼굴을보며여러층에걸쳐스스로배운다판단가능성어떤인지도명의사진에서잘라모음겹친평균부위커널숫자로줄임가운데줄이어둡고아래가밝다여러사람의눈코입귀를모아서겹치면공통처음보는얼굴에서찾아보면가장닮은곳점수가큰틀렸다개뿐그래서수많은두찾았다머리카락으로봄진짜만으로만든실제계산수만장배운다더알아보기아래키워드를스스로조사해보고서를써세요음수는바꾸는활성화함수풀링특징맵을줄이며중요한값만남기기스트라이드한번에몇칸씩움직일까채널컬러숫자판이역전파경사하강법조금씩고쳐가는방법과적합배운것만잘하고건틀리는문제과제개이상골라하고네가지를담아제출하세요뜻한두문장설명그림이나직접본예시역할참고한자료와출처방법기한은수업안내따르세요';
  const loads = [`400 100px "Black Han Sans"`, `500 40px "Noto Sans KR"`, `700 40px "Noto Sans KR"`].map(f => document.fonts.load(f, TEXT).catch(() => {}))
    .concat([`500 40px "IBM Plex Mono"`, `600 40px "IBM Plex Mono"`].map(f => document.fonts.load(f, 'CONVOLUTIONSTEP0123456789+=×−/ΣAB⊙÷→()?~').catch(() => {})));
  Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 3000))]).then(() => {
    const params = new URLSearchParams(location.search);
    // ?t= 는 원래(음성 없는) 연출 시각 — 예전 링크·썸네일과 같은 장면을 보여 줌
    if (params.has('t')) { t = vidAt(+params.get('t')); setPlaying(false); } else setPlaying(true);
  });
  // ?analyze: 제작 도구(cnn_tts)가 장면별로 화면 변화를 재서 멈춤 지점을 고르는 용도 — 재생하지 않음
  if (/[?&]analyze\b/.test(location.search)) { window.__conv = { render, cv, setAmb: v => { AMB = v; }, settleText: on => { KA = on ? Infinity : -1; KD = on ? 5 : 0; } }; return; }
  requestAnimationFrame(tick);
})();
