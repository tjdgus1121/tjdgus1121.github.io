<style>
/* 귀여운 모션 해설 공통 스타일 (조건부확률 모션에서 정리한 것).
 * 무대 1920×1080 · 크림색 점무늬 · 남색 굵은 외곽선 · 오프셋 그림자 스티커 카드 · 나눔스퀘어라운드 */
:root {
  --ink: #3b3355; --muted: #6f6787; --cream: #fff8ec; --line: #e7dfd2; --page: #efe6d8;
  --gray: #d9d3e6; --blue: #5fa2ff; --orange: #ffa560; --purple: #b084f5; --yellow: #ffd966; --pink: #ff8fab; --mint: #7fd6b9;
  --coral: #ff7a59; --sky: #4f8ff0;
  --blue-ink: #2f6fd6; --orange-ink: #c25e10; --purple-ink: #6b3fc4; --coral-ink: #d4472a; --green-ink: #1f8a5c;
  --blue-soft: #e4efff; --orange-soft: #ffeedd; --purple-soft: #f1e8ff; --yellow-soft: #fff4c4; --coral-soft: #ffe6df; --mint-soft: #ddf6ec;
  --font: "NSRound", "NanumSquareRound", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --pop: 0 6px 0 rgba(59, 51, 85, .16);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink); font-family: var(--font);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px;
}

/* ---------- 플레이어 ---------- */
.stage-wrap { position: relative; overflow: hidden; border-radius: 18px; box-shadow: 0 4px 18px rgba(59,51,85,.18); }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; max-width: 1920px; justify-content: center; }
.controls button, .controls select { min-height: 44px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); font: 800 15px var(--font); cursor: pointer; box-shadow: 0 3px 0 rgba(59,51,85,.2); }
.controls button.primary { background: var(--yellow); min-width: 120px; }
.controls :focus-visible { outline: 3px solid var(--blue-ink); outline-offset: 3px; }
.controls .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.controls input[type=range] { flex: 1 1 240px; min-width: 160px; height: 44px; accent-color: var(--purple-ink); }
.controls output { font: 800 15px var(--font); min-width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
/* ---------- 시리즈 편 이동 ---------- */
.series-nav { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; width: 100%; max-width: 1920px; }
.sn-eps { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; list-style: none; margin: 0; padding: 0; }
.sn-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); font: 800 15px var(--font); text-decoration: none; box-shadow: 0 3px 0 rgba(59,51,85,.2); }
a.sn-btn:hover { background: var(--yellow-soft); }
a.sn-btn:focus-visible { outline: 3px solid var(--blue-ink); outline-offset: 3px; }
.sn-btn[aria-disabled] { opacity: .4; box-shadow: none; }
.sn-ep { padding-left: 8px; }
.sn-ep b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 14px; }
.sn-ep[aria-current] { background: var(--yellow); border-width: 3px; }
.sn-act { border-style: dashed; }
.sn-ep em { font-style: normal; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #fff; border: 1.5px solid var(--ink); }
@media (max-width: 760px) {
  .sn-ep .t { display: none; }
  .sn-btn { padding: 0 14px; }
}
body.render { padding: 0; display: block; }
body.render .controls, body.render .series-nav { display: none; }
body.render .stage-wrap { box-shadow: none; border-radius: 0; }

.stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
  background-color: var(--cream);
  background-image: radial-gradient(rgba(59,51,85,.09) 2px, transparent 2.5px);
  background-size: 34px 34px;
}

/* ---------- 머리줄 ---------- */
.head { position: absolute; left: 0; right: 0; top: 0; height: 92px; display: flex; align-items: center; gap: 26px; padding: 0 36px; background: #fff; border-bottom: 3px solid var(--ink); z-index: 10; }
.head .brand { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.head .brand strong { font-size: 30px; font-weight: 800; letter-spacing: -.5px; background: linear-gradient(transparent 60%, var(--yellow) 60%); padding: 0 4px; }
.head .brand span { font-size: 19px; color: var(--muted); font-weight: 700; }
.chips { margin-left: auto; display: flex; gap: 8px; }
.chips span { padding: 8px 14px; border-radius: 999px; border: 2px solid transparent; background: #f4efe6; color: var(--muted); font-size: 17px; font-weight: 800; white-space: nowrap; }
.chips span.done { color: var(--ink); background: #fff; border-color: var(--line); }
.chips span.on { background: var(--yellow); border-color: var(--ink); color: var(--ink); box-shadow: 0 3px 0 rgba(59,51,85,.25); }

/* ---------- 그림 층 ---------- */
#deco, #art, #mascot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
#mascot { z-index: 40; pointer-events: none; }
.svg-text { font-family: var(--font); font-weight: 800; }
.chap-tag {
  position: absolute; left: 44px; top: 106px; z-index: 8; padding: 10px 22px; border-radius: 16px;
  background: var(--yellow); border: 3px solid var(--ink); box-shadow: var(--pop);
  font-size: 26px; font-weight: 800; opacity: 0; transform-origin: 0 50%; white-space: nowrap;
}

/* 위치를 지정하는 글자(수식) 층 */
.labs { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.lab { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; opacity: 0; font-weight: 800; color: var(--ink); }
.lab .katex { font-size: 1em; }
.lab.pill { padding: 6px 18px; border-radius: 999px; background: #fff; border: 3px solid var(--ink); font-size: 24px; box-shadow: 0 4px 0 rgba(59,51,85,.15); }
.lab.pill.a, .lab.pill.orange { background: var(--orange-soft); color: var(--orange-ink); }
.lab.pill.b, .lab.pill.blue { background: var(--blue-soft); color: var(--blue-ink); }
.lab.pill.ab, .lab.pill.purple { background: var(--purple-soft); color: var(--purple-ink); }
.lab.pill.coral { background: var(--coral-soft); color: var(--coral-ink); }
.lab.pill.mint { background: var(--mint-soft); color: var(--green-ink); }
.lab.pill.yellow { background: var(--yellow-soft); }
.lab.tx { font-size: 30px; padding: 4px 12px; border-radius: 14px; background: #fff; border: 2.5px solid var(--ink); box-shadow: 0 4px 0 rgba(59,51,85,.12); }
.lab.tx.sm { font-size: 26px; }
.lab.plain { font-size: 26px; }
.lab.dv { font-size: 50px; padding: 14px 24px; border-radius: 22px; }
.lab.dv.num { font-size: 42px; color: var(--muted); }
.lab.dv.box { background: var(--yellow-soft); border: 3px solid var(--ink); box-shadow: var(--pop); }
.lab.step { font-size: 22px; color: var(--ink); padding: 6px 16px; border-radius: 999px; background: #fff; border: 2px dashed #b9afcc; }

/* ---------- 오른쪽 공식 판 ---------- */
.board { position: absolute; left: 1296px; top: 122px; width: 584px; height: 812px; padding: 30px 30px; background: #fff; border: 3px solid var(--ink); border-radius: 30px; box-shadow: 0 8px 0 rgba(59,51,85,.14); display: flex; flex-direction: column; gap: 18px; z-index: 6; overflow: hidden; }
.board .kicker { align-self: flex-start; padding: 6px 16px; border-radius: 12px; background: var(--yellow); border: 2.5px solid var(--ink); font-size: 20px; font-weight: 800; transform: rotate(-2deg); }
.board .item { opacity: 0; }
.board p { margin: 0; font-size: 25px; line-height: 1.5; font-weight: 700; }
.board p.note { font-size: 21px; color: var(--ink); padding: 12px 16px; border-radius: 16px; background: #f6f1e8; font-weight: 700; }
.board .tex { font-size: 30px; padding: 14px 16px; border-radius: 20px; background: #f7f3ff; text-align: center; }
.board .tex.big { font-size: 32px; }
.board .tex.box { background: var(--yellow-soft); border: 3px solid var(--ink); box-shadow: 0 5px 0 rgba(59,51,85,.14); }
.board b.cA, .board b.orange { color: var(--orange-ink); } .board b.cB, .board b.blue { color: var(--blue-ink); }
.board b.cAB, .board b.purple { color: var(--purple-ink); } .board b.coral { color: var(--coral-ink); } .board b.green { color: var(--green-ink); }
.board table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 22px; font-weight: 800; text-align: center; border: 2.5px solid var(--ink); border-radius: 16px; overflow: hidden; }
.board th, .board td { padding: 8px 6px; border-bottom: 2px solid #eee6da; }
.board th { background: #f6f1e8; font-size: 19px; }
.board tr:last-child td { border-bottom: 0; }
.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 14px; font-size: 23px; font-weight: 800; }
.track { position: relative; height: 40px; border-radius: 999px; background: #f4efe6; border: 2.5px solid var(--ink); overflow: visible; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; }
.track em { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 20px; font-weight: 800; }

/* ---------- 여는 화면 · 정리 ---------- */
.intro, .summary { position: absolute; inset: 0; z-index: 30; opacity: 0;
  background-color: var(--cream); background-image: radial-gradient(rgba(59,51,85,.09) 2px, transparent 2.5px); background-size: 34px 34px; }
.intro .kick { position: absolute; left: 820px; top: 250px; font-size: 28px; font-weight: 800; color: var(--purple-ink); padding: 6px 18px; border-radius: 999px; background: var(--purple-soft); border: 2.5px solid var(--ink); }
.intro h1 { position: absolute; left: 812px; top: 300px; margin: 0; font-size: 120px; font-weight: 800; letter-spacing: -2px; display: flex; }
.intro h1 span { display: inline-block; transform-origin: 50% 90%; white-space: pre; }
.intro .sub { position: absolute; left: 826px; top: 470px; font-size: 38px; font-weight: 800; color: var(--muted); }
.intro .q { position: absolute; left: 820px; top: 580px; padding: 26px 40px; border-radius: 30px; background: #fff; border: 4px solid var(--ink); box-shadow: 0 8px 0 rgba(59,51,85,.16); font-size: 40px; font-weight: 800; }
.intro svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
.summary { top: 95px; padding: 36px 70px 120px; display: grid; grid-template-rows: auto auto auto; align-content: start; gap: 28px; }
.summary h2 { margin: 0; font-size: 46px; font-weight: 800; letter-spacing: -1px; }

<script>
/* 모션 해설 공통 엔진 — 수업 내용과 무관한 부분만 둔다.
 *
 * ※ 경사하강법 모션 해설의 공통 엔진에 player()의 reserve 옵션(무대 위아래에 내줄 높이)을 더한 판이다.
 *
 * 타임라인은 "장면을 길이로 이어 붙이는" 방식이다.
 *   tl.chapter('1. 기울기 정하기')      현재 위치에 장 표시(재생기의 장 이동 목록)
 *   tl.beat(4.2, (s, lt) => { … })      지속형: 시작 뒤로 계속 적용되어 상태가 쌓인다(그래프, 패널 내용 등)
 *   tl.scene(8, (s, lt) => { … })       구간형: 그 길이 동안만 적용된다(개념 카드처럼 잠깐 덮는 장면)
 * 장면을 중간에 끼우거나 길이를 바꾸면 뒤 장면의 시작 시각이 자동으로 밀린다.
 * 화면은 stateAt(t) 가 그 시각의 상태를 처음부터 다시 계산해 그리므로, 되감기·건너뛰기·영상 렌더가 모두 같은 결과를 낸다.
 */
(function (root) {
  'use strict';

  /* ---------- 시간 도구 ---------- */
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ease = (x) => (x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
  const prog = (lt, start, dur) => ease(clamp((lt - start) / dur));
  const lerp = (a, b, p) => a + (b - a) * p;
  const fade = (lt, start = 0, dur = .4) => prog(lt, start, dur);
  const pressed = (lt, at) => lt >= at && lt < at + .2;
  /* 구간형 장면의 들어오고 나가는 정도(0~1) */
  const inOut = (lt, dur, fadeIn = .45, fadeOut = .4) => Math.min(prog(lt, 0, fadeIn), 1 - prog(lt, dur - fadeOut, fadeOut));
  /* 키프레임 [[시각, 값], …] 사이를 부드럽게 보간 */
  function frames(lt, kf) {
    if (lt <= kf[0][0]) return kf[0][1];
    for (let i = 1; i < kf.length; i++) {
      const [t1, v1] = kf[i], [t0, v0] = kf[i - 1];
      if (lt <= t1) return lerp(v0, v1, ease((lt - t0) / (t1 - t0)));
    }
    return kf[kf.length - 1][1];
  }
  /* 키프레임을 따라 지나온 값의 [최소, 최대] */
  function visited(lt, kf) {
    let lo = kf[0][1], hi = lo;
    for (const [t, v] of kf) if (lt >= t) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
    const v = frames(lt, kf);
    return [Math.min(lo, v), Math.max(hi, v)];
  }

  /* ---------- 타임라인 ---------- */
  function timeline() {
    const entries = [], chapters = [];
    let cursor = 0;
    return {
      get time() { return cursor; },
      get duration() { return cursor; },
      chapters,
      chapter(label) { chapters.push([cursor, label]); },
      beat(dur, fn) { entries.push({ t0: cursor, until: Infinity, fn }); cursor += dur; },
      scene(dur, fn) { entries.push({ t0: cursor, until: cursor + dur, fn, dur }); cursor += dur; },
      wait(dur) { cursor += dur; },
      stateAt(t, makeState) {
        const s = makeState();
        for (const e of entries) {
          if (t < e.t0) break;
          if (t < e.until) e.fn(s, t - e.t0, e.dur);
        }
        return s;
      },
    };
  }

  /* ---------- 자막 · 포인터 상태 ---------- */
  function cap(s, lt, text, at = 0) { if (lt >= at) s.caption = { text, o: clamp((lt - at) / .35) }; }
  /* 포인터: from → to 로 moveAt 부터 dur 동안 이동, clickAt 에 클릭. 대상은 data-target 이름 */
  function point(s, lt, from, to, moveAt, clickAt, dur = .65) {
    s.pointer = {
      from, to, p: prog(lt, moveAt, dur), o: 1,
      click: clickAt != null && lt >= clickAt && lt < clickAt + .5 ? (lt - clickAt) / .5 : -1,
    };
  }
  const hidePointer = (s, lt, at = 0) => { if (s.pointer) s.pointer.o = 1 - prog(lt, at, .3); };

  /* ---------- DOM 도구 ---------- */
  const SVGNS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs = {}, parent) {
    const el = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (parent) parent.appendChild(el);
    return el;
  }
  const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  /* 수식 그리기. Σ의 범위(i=1, 5 등)는 항상 기호 바로 위·아래에 둔다(\sum → \sum\limits).
   * root.TEX_MACROS(kit.js)에 핵심 기호의 색을 한곳에서 정해 두고 \pa(기울기 a) 같은 이름으로 쓴다. */
  function setTex(el, tex) {
    if (el.dataset.cur === tex) return;
    el.dataset.cur = tex;
    if (!tex) { el.textContent = ''; return; }
    root.katex.render(tex.replace(/\\sum(?!\\limits)/g, '\\sum\\limits'), el, { throwOnError: false, macros: { ...(root.TEX_MACROS || {}) } });
  }
  const renderTexIn = (host) => host.querySelectorAll('[data-tex]').forEach((el) => setTex(el, el.dataset.tex));
  function setText(el, text) { if (el.textContent !== text) el.textContent = text; }

  /* ---------- 공통 렌더러 ---------- */
  function captionRenderer(el) {
    return (s) => {
      setText(el, s.caption ? s.caption.text : '');
      el.style.opacity = s.caption ? s.caption.o : 0;
    };
  }
  function pointerRenderer(stage, ptr, rip, rest = { x: 1780, y: 1140 }) {
    const lastPos = new Map();
    function targetPos(key) {
      if (key == null) return rest;
      const el = stage.querySelector(`[data-target="${key}"]`);
      if (!el) return lastPos.get(key) || rest;
      const st = stage.getBoundingClientRect(), r = el.getBoundingClientRect(), k = st.width / stage.offsetWidth;
      const pos = { x: (r.left + r.width * .55 - st.left) / k, y: (r.top + r.height * .6 - st.top) / k };
      lastPos.set(key, pos);
      return pos;
    }
    return (s) => {
      if (!s.pointer || s.pointer.o <= 0) { ptr.style.opacity = 0; rip.style.opacity = 0; return; }
      const a = targetPos(s.pointer.from), b = targetPos(s.pointer.to), p = s.pointer.p;
      const x = lerp(a.x, b.x, p), y = lerp(a.y, b.y, p) - Math.sin(Math.PI * p) * 40;
      const press = s.pointer.click >= 0 && s.pointer.click < .3 ? .88 : 1;
      ptr.style.opacity = s.pointer.o;
      ptr.style.transform = `translate(${x}px, ${y}px) scale(${press})`;
      if (s.pointer.click >= 0) {
        rip.style.opacity = (1 - s.pointer.click) * .7;
        rip.style.transform = `translate(${x}px, ${y}px) scale(${.3 + s.pointer.click * 1.2})`;
      } else rip.style.opacity = 0;
    };
  }

  /* ---------- 재생기 ----------
   * ?render=1 이면 컨트롤을 숨기고 1:1 크기로 둔다. render.mjs 는 window.__ready / __seek / __duration 을 쓴다. */
  /* audio(선택): 화면과 함께 재생할 <audio>. 재생·정지·건너뛰기에 맞춰 위치를 맞춘다. */
  // reserve: 무대 밖 위아래 요소에 내줄 높이(px). 숫자나 함수(창 크기가 바뀔 때마다 다시 잼)
  function player({ stage, wrap, width = 1920, height = 1080, duration, chapters, render, controls, audio = null, ready = null, reserve = 110 }) {
    const RENDER = new URLSearchParams(location.search).has('render');
    const st = { t: 0, playing: false, startAt: 0, startT: 0, raf: 0, rate: 1 };
    const syncAudio = () => {
      if (!audio || RENDER) return;
      audio.playbackRate = st.rate;
      if (st.playing) {
        if (Math.abs(audio.currentTime - st.t) > .25) audio.currentTime = st.t;
        if (audio.paused) audio.play().catch(() => { /* 사용자 조작 전에는 재생이 막힐 수 있음 */ });
      } else if (!audio.paused) audio.pause();
    };
    const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
    function seek(t) {
      st.t = clamp(t, 0, duration);
      render(st.t);
      controls.scrub.value = st.t.toFixed(2);
      controls.time.value = `${fmt(st.t)} / ${fmt(duration)}`;
    }
    function setPlaying(on) {
      st.playing = on;
      cancelAnimationFrame(st.raf);
      if (on) {
        if (st.t >= duration) seek(0);
        st.startAt = performance.now(); st.startT = st.t;
        st.raf = requestAnimationFrame(tick);
      }
      controls.play.textContent = on ? '❚❚ 일시정지' : '▶ 재생';
      syncAudio();
    }
    function tick(now) {
      if (!st.playing) return;
      const t = st.startT + (now - st.startAt) / 1000 * st.rate;
      seek(t);
      if (audio && !audio.paused && Math.abs(audio.currentTime - t) > .3) audio.currentTime = t;
      if (t >= duration) { setPlaying(false); return; }
      st.raf = requestAnimationFrame(tick);
    }
    function fit() {
      const r = typeof reserve === 'function' ? reserve() : reserve;
      const k = RENDER ? 1 : Math.min((innerWidth - 32) / width, (innerHeight - r) / height, 1);
      stage.style.transform = `scale(${k})`;
      wrap.style.width = width * k + 'px';
      wrap.style.height = height * k + 'px';
    }
    async function init() {
      if (RENDER) document.body.classList.add('render');
      fit();
      addEventListener('resize', () => { fit(); seek(st.t); });
      try { await document.fonts.ready; } catch { /* 기본 글꼴로 계속 */ }
      // Optional first-frame assets must finish before the autoplay clock starts.
      // Other lessons retain their existing startup when no promise is supplied.
      if (ready) await ready;
      controls.scrub.max = duration;
      chapters.forEach(([t, label]) => {
        const o = document.createElement('option');
        o.value = t; o.textContent = `${fmt(t)}  ${label}`;
        controls.select.appendChild(o);
      });
      controls.select.addEventListener('change', () => { seek(Number(controls.select.value)); setPlaying(true); });
      controls.play.addEventListener('click', () => setPlaying(!st.playing));
      controls.restart.addEventListener('click', () => { seek(0); setPlaying(true); });
      // 재생 속도(선택): 바꾸는 순간의 위치에서 새 속도로 이어 간다. 음성도 같은 속도(음 높이는 그대로)
      if (controls.speed) controls.speed.addEventListener('change', () => {
        st.rate = Number(controls.speed.value) || 1;
        if (st.playing) { st.startAt = performance.now(); st.startT = st.t; }
        syncAudio();
      });
      // 재생 바를 누르거나 끌면: 재생 중이면 그 자리부터 이어서 재생, 멈춰 있으면 그 자리에 멈춘 채로
      controls.scrub.addEventListener('input', () => {
        seek(Number(controls.scrub.value));
        if (st.playing) {
          st.startAt = performance.now(); st.startT = st.t;
          if (audio && !RENDER) audio.currentTime = st.t;
        }
      });
      seek(0);
      if (!RENDER && !matchMedia('(prefers-reduced-motion: reduce)').matches) setPlaying(true);
    }
    root.__duration = duration;
    root.__seek = seek;
    root.__ready = init();
    return { seek, syncAudio, get playing() { return st.playing; }, get time() { return st.t; } };
  }

  root.Motion = {
    clamp, ease, prog, lerp, fade, pressed, inOut, frames, visited,
    timeline, cap, point, hidePointer,
    svg, esc, setTex, renderTexIn, setText, captionRenderer, pointerRenderer, player,
  };
})(window);

</script>
<script>
/* 귀여운 모션 해설 공통 부품 (window.Kit). motion-core.js(window.Motion) 다음에 넣는다.
 *
 *  - 캐릭터: makeKid / paintKid (얼굴 있는 젤리 친구), makeMascot (학사모 병아리 선생님)
 *  - 장식: makeDeco (둥실둥실 별·동그라미), tag (둥근 이름표)
 *  - 글자: labels (위치 고정 수식·알약), board (오른쪽 공식 판), chips (머리줄 장 표시), chapTag (장 시작 스티커)
 *  - 시간: say (말풍선 자막), narration (TTS 길이에 맞춘 장면 멈춤·입 모양), boot (재생기 시작)
 *
 * 상태(state)는 tl.stateAt(대본 시각)으로 계산하고, 깜빡임·통통 튀기 같은 반복 동작은 영상 시각 V 로 그린다.
 * 그래서 state 안에는 '시간이 지나면 계속 변하는 값'을 넣지 않는다(멈춤 위치 찾기가 깨진다).
 */
(function (root) {
  'use strict';
  const { clamp, lerp, svg, esc, renderTexIn, setText } = root.Motion;
  const $ = (id) => document.getElementById(id);

  const C = {
    ink: '#3b3355', muted: '#6f6787', gray: '#d9d3e6', blue: '#5fa2ff', orange: '#ffa560', purple: '#b084f5', yellow: '#ffd966',
    pink: '#ff8fab', mint: '#7fd6b9', coral: '#ff7a59', sky: '#4f8ff0', gold: '#ffcf4d',
    cream: '#fff8ec', blueInk: '#2f6fd6', orangeInk: '#c25e10', purpleInk: '#6b3fc4', coralInk: '#d4472a', greenInk: '#1f8a5c',
    blueSoft: '#e4efff', orangeSoft: '#ffeedd', purpleSoft: '#f1e8ff', graySoft: '#f1edf6', yellowSoft: '#fff4c4', coralSoft: '#ffe6df', mintSoft: '#ddf6ec',
  };
  /* 핵심 기호 색 — 수식(TeX)에서 이름으로만 쓰고 색은 여기 한곳에서 정한다.
   *  \pa : 기울기 a(예측 직선의 기울기, 그래프의 직선과 같은 산호색)
   *  \pal: 학습률 α(보라)
   * 예) 'L(\\pa)=13\\pa^2-52\\pa+53', 'a_{new}=\\pa-\\pal L′(\\pa)' */
  root.TEX_MACROS = {
    '\\pa': `{\\color{${C.coralInk}}\\boldsymbol{a}}`,
    '\\pal': `{\\color{${C.purpleInk}}\\boldsymbol{\\alpha}}`,
  };
  /* 살짝 튀어 오르며 멈추는 곡선 (0→1, 중간에 1을 조금 넘음) */
  const backOut = (x) => { if (x <= 0) return 0; if (x >= 1) return 1; const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
  const popIn = (lt, t0, dur = .5) => backOut(clamp((lt - t0) / dur));
  const pulse = (lt, t0, dur) => Math.sin(Math.PI * clamp((lt - t0) / dur));
  const rand = (seed) => { const v = Math.sin(seed * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
  const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, p) => { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(p))).toString(16).padStart(2, '0')).join(''); };
  const setA = (el, attrs) => { for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); };
  const text = (parent, x, y, str, attrs = {}) => { const t = svg('text', { x, y, class: 'svg-text', ...attrs }, parent); t.textContent = str; return t; };
  const textWidth = (str, size) => [...str].reduce((w, ch) => w + (ch.codePointAt(0) > 0x2000 && !/[가-힣·∩ᶜ²−]/.test(ch) ? size * 1.2 : /[가-힣]/.test(ch) ? size * .9 : /\s/.test(ch) ? size * .28 : size * .55), 0);
  /* ---------- 핵심 기호 색(일반 글자) ----------
   * 수식(TeX)의 \pa·\pal 과 같은 색을 일반 글자에도 쓴다: 홀로 쓰인 a(기울기, 'ax'·'ab'·'13a' 포함)와 α.
   * 영어 낱말 속 a(예: max)는 앞이 알파벳이라 건드리지 않는다. */
  const VAR_RE = /(?<![A-Za-z\\])a(?=[xb]|[^A-Za-z]|$)|α/g;
  const VAR_COL = { a: C.coralInk, 'α': C.purpleInk };
  /* SVG 글자: 기호만 tspan 으로 색을 입힌다 */
  function setRich(t, s) {
    if (t.textContent === s) return;
    VAR_RE.lastIndex = 0;
    if (!VAR_RE.test(s)) { t.textContent = s; return; }
    t.textContent = '';
    let i = 0;
    s.replace(VAR_RE, (m, at) => {
      if (at > i) t.append(document.createTextNode(s.slice(i, at)));
      svg('tspan', { fill: VAR_COL[m], 'font-weight': 900 }, t).textContent = m;
      i = at + m.length;
      return m;
    });
    if (i < s.length) t.append(document.createTextNode(s.slice(i)));
  }
  /* HTML 덩어리: 글자 마디를 돌며 기호를 <b class="pv"> 로 감싼다(KaTeX 수식·이미 감싼 곳은 건너뜀) */
  function paintVars(el) {
    if (!el) return;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (n.parentElement.closest('.katex, .pv, script, style, svg') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((n) => {
      const s = n.nodeValue;
      VAR_RE.lastIndex = 0;
      if (!VAR_RE.test(s)) return;
      const frag = document.createDocumentFragment();
      let i = 0;
      s.replace(VAR_RE, (m, at) => {
        if (at > i) frag.append(s.slice(i, at));
        const b = document.createElement('b');
        b.className = 'pv';
        b.style.color = VAR_COL[m];
        b.textContent = m;
        frag.append(b);
        i = at + m.length;
        return m;
      });
      if (i < s.length) frag.append(s.slice(i));
      n.replaceWith(frag);
    });
  }

  /* 둥근 이름표(글자 뒤 알약). 반환: { g, rect, text, set(str) } */
  function tag(parent, x, y, str, { size = 24, fill = '#fff', color = C.ink, anchor = 'middle' } = {}) {
    const g = svg('g', {}, parent);
    const h = size + 18;
    const rect = svg('rect', { y: y - h / 2, height: h, rx: h / 2, fill, stroke: C.ink, 'stroke-width': 2.5 }, g);
    const t = text(g, 0, y + size * .36, '', { 'font-size': size, fill: color, 'text-anchor': 'middle' });
    const set = (s) => {
      const w = textWidth(s, size) + 34, x0 = anchor === 'middle' ? x - w / 2 : x;
      setA(rect, { x: x0, width: w });
      t.setAttribute('x', x0 + w / 2);
      setRich(t, s);
    };
    set(str);
    return { g, rect, text: t, set };
  }

  /* ---------- 젤리 친구 ---------- */
  function makeKid(parent) {
    const g = svg('g', {}, parent);
    const shadow = svg('ellipse', { cx: 0, cy: 25, rx: 17, ry: 4, fill: C.ink, opacity: .13 }, g);
    const inner = svg('g', {}, g);
    const body = svg('rect', { x: -21, y: -23, width: 42, height: 46, rx: 19, stroke: C.ink, 'stroke-width': 2.6 }, inner);
    svg('ellipse', { cx: -10, cy: -11, rx: 4, ry: 6.5, fill: '#fff', opacity: .45 }, inner);
    const eyesOpen = svg('g', { fill: C.ink }, inner);
    svg('ellipse', { cx: -7, cy: -4, rx: 2.6, ry: 3.3 }, eyesOpen);
    svg('ellipse', { cx: 7, cy: -4, rx: 2.6, ry: 3.3 }, eyesOpen);
    svg('circle', { cx: -6.2, cy: -5.2, r: .9, fill: '#fff' }, eyesOpen);
    svg('circle', { cx: 7.8, cy: -5.2, r: .9, fill: '#fff' }, eyesOpen);
    const eyesClosed = svg('path', { d: 'M-10 -4 Q-7 -1 -4 -4 M4 -4 Q7 -1 10 -4', stroke: C.ink, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' }, inner);
    svg('ellipse', { cx: -13, cy: 3, rx: 4, ry: 2.5, fill: C.pink, opacity: .8 }, inner);
    svg('ellipse', { cx: 13, cy: 3, rx: 4, ry: 2.5, fill: C.pink, opacity: .8 }, inner);
    const smile = svg('path', { d: 'M-4 4 Q0 8.5 4 4', stroke: C.ink, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' }, inner);
    const worry = svg('ellipse', { cx: 0, cy: 6, rx: 2.3, ry: 2.8, fill: C.ink, opacity: 0 }, inner);
    const happy = svg('path', { d: 'M-5 3 Q0 11 5 3 Z', fill: C.coral, stroke: C.ink, 'stroke-width': 1.8, 'stroke-linejoin': 'round', opacity: 0 }, inner);
    return { g, shadow, inner, body, eyesOpen, eyesClosed, smile, worry, happy };
  }
  /* mood: 'smile' | 'worry' | 'happy'  ·  sleep: 1 이면 눈 감고 천천히 숨쉬기 */
  function paintKid(el, { col, id = 0, t = 0, mood = 'smile', sleep = 0, bob = 1 }) {
    el.body.setAttribute('fill', col);
    const blink = ((t + id * .61) % 3.3) < .12;
    const closed = blink || sleep > .5;
    el.eyesOpen.setAttribute('opacity', closed ? 0 : 1);
    el.eyesClosed.setAttribute('opacity', closed ? 1 : 0);
    el.smile.setAttribute('opacity', mood === 'smile' ? 1 : 0);
    el.worry.setAttribute('opacity', mood === 'worry' ? 1 : 0);
    el.happy.setAttribute('opacity', mood === 'happy' ? 1 : 0);
    const b = sleep > .5 ? Math.sin(t * 1.6 + id) * 1.2 : Math.sin(t * 3.1 + id * 1.7) * 2;
    el.inner.setAttribute('transform', `translate(0 ${(b * bob).toFixed(2)})`);
  }
  function placeKid(el, x, y, sc, o = 1) {
    if (o <= .001 || sc <= .001) { el.g.setAttribute('opacity', 0); return; }
    el.g.setAttribute('opacity', clamp(o).toFixed(3));
    el.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(3)})`);
  }

  /* ---------- 병아리 선생님 ---------- */
  function makeMascot(parent) {
    const g = svg('g', {}, parent);
    svg('ellipse', { cx: 0, cy: 68, rx: 48, ry: 9, fill: C.ink, opacity: .14 }, g);
    const body = svg('g', {}, g);
    const wingL = svg('ellipse', { cx: -56, cy: 14, rx: 15, ry: 24, fill: '#ffc93d', stroke: C.ink, 'stroke-width': 3.5 }, body);
    const wingR = svg('ellipse', { cx: 56, cy: 14, rx: 15, ry: 24, fill: '#ffc93d', stroke: C.ink, 'stroke-width': 3.5 }, body);
    svg('circle', { r: 60, fill: C.yellow, stroke: C.ink, 'stroke-width': 4 }, body);
    svg('ellipse', { cx: 0, cy: 26, rx: 34, ry: 24, fill: '#fff2b8' }, body);
    svg('path', { d: 'M-30 -62 L0 -76 L30 -62 L0 -48 Z', fill: C.ink }, body);
    svg('rect', { x: -15, y: -58, width: 30, height: 12, rx: 3, fill: C.ink }, body);
    svg('path', { d: 'M24 -63 Q34 -50 30 -36', stroke: C.ink, 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, body);
    svg('circle', { cx: 30, cy: -33, r: 5, fill: C.pink, stroke: C.ink, 'stroke-width': 2 }, body);
    const eyes = svg('g', {}, body);
    [-20, 20].forEach((x) => {
      svg('circle', { cx: x, cy: -12, r: 7, fill: C.ink }, eyes);
      svg('circle', { cx: x + 2.4, cy: -14.5, r: 2.4, fill: '#fff' }, eyes);
    });
    const eyesShut = svg('path', { d: 'M-27 -12 Q-20 -6 -13 -12 M13 -12 Q20 -6 27 -12', stroke: C.ink, 'stroke-width': 3.5, fill: 'none', 'stroke-linecap': 'round', opacity: 0 }, body);
    svg('ellipse', { cx: -36, cy: 6, rx: 10, ry: 6.5, fill: C.pink, opacity: .85 }, body);
    svg('ellipse', { cx: 36, cy: 6, rx: 10, ry: 6.5, fill: C.pink, opacity: .85 }, body);
    const beakShut = svg('path', { d: 'M-10 2 Q0 -4 10 2 Q0 14 -10 2 Z', fill: '#ff9f43', stroke: C.ink, 'stroke-width': 2.8, 'stroke-linejoin': 'round' }, body);
    const beakOpen = svg('g', { opacity: 0 }, body);
    svg('path', { d: 'M-11 0 Q0 -6 11 0 Q0 6 -11 0 Z', fill: '#ff9f43', stroke: C.ink, 'stroke-width': 2.8, 'stroke-linejoin': 'round' }, beakOpen);
    svg('path', { d: 'M-9 7 Q0 4 9 7 Q0 20 -9 7 Z', fill: '#ff7a59', stroke: C.ink, 'stroke-width': 2.8, 'stroke-linejoin': 'round' }, beakOpen);
    return {
      render(m, t, talking) {
        const o = m.o === undefined ? 1 : m.o;
        g.setAttribute('opacity', clamp(o));
        const hop = Math.abs(Math.sin(t * 2.2)) * 4;
        g.setAttribute('transform', `translate(${m.x.toFixed(1)} ${(m.y - hop).toFixed(1)}) scale(${(m.k * (.6 + .4 * clamp(o))).toFixed(3)})`);
        beakOpen.setAttribute('opacity', talking ? 1 : 0);
        beakShut.setAttribute('opacity', talking ? 0 : 1);
        const blink = (t % 3.9) < .14;
        eyes.setAttribute('opacity', blink ? 0 : 1);
        eyesShut.setAttribute('opacity', blink ? 1 : 0);
        const wave = m.wave || 0;
        const flap = wave * Math.sin(t * 11) * 28 + (talking ? Math.sin(t * 6) * 6 : 0);
        wingL.setAttribute('transform', `rotate(${(-flap).toFixed(1)} -46 0)`);
        wingR.setAttribute('transform', `rotate(${(flap - wave * 20).toFixed(1)} 46 0)`);
      },
    };
  }
  const MASCOT_HOME = { x: 108, y: 1002, k: .8 };

  /* ---------- 배경 장식 ---------- */
  const STAR = 'M0 -12 L3.5 -4 L12 -3.5 L5.5 2.5 L7.5 11 L0 6.5 L-7.5 11 L-5.5 2.5 L-12 -3.5 L-3.5 -4 Z';
  function makeDeco(parent, list) {
    const items = (list || [
      { x: 58, y: 150, star: 1, c: C.yellow, s: 1.6 }, { x: 1262, y: 128, r: 9, c: C.pink }, { x: 44, y: 640, star: 1, c: C.mint, s: 1.1 },
      { x: 1268, y: 600, star: 1, c: C.blue, s: 1.2 }, { x: 1262, y: 905, r: 11, c: C.yellow }, { x: 36, y: 400, r: 7, c: C.purple },
      { x: 1898, y: 122, star: 1, c: C.pink, s: .9 },
    ]).map((d, i) => {
      const g = svg('g', {}, parent);
      if (d.star) svg('path', { d: STAR, fill: d.c, stroke: C.ink, 'stroke-width': 2, transform: `scale(${d.s})` }, g);
      else svg('circle', { r: d.r, fill: d.c, stroke: C.ink, 'stroke-width': 2 }, g);
      return { ...d, g, i };
    });
    return (t, o = 1) => {
      parent.setAttribute('opacity', o.toFixed(3));
      items.forEach((d) => d.g.setAttribute('transform', `translate(${d.x} ${(d.y + Math.sin(t * 1.1 + d.i * 1.7) * 7).toFixed(1)}) rotate(${(Math.sin(t * .8 + d.i) * 12).toFixed(1)})`));
    };
  }

  /* ---------- 말풍선 자막 ---------- */
  function say(s, lt, str, at = 0) {
    if (lt < at) return;
    s.caption = { text: str, o: clamp((lt - at) / .3) };
    s.talk = lt - at;
  }

  /* ---------- 위치 고정 글자·수식 (s.lab[id] = 0..1, s.labS[id] = 크기 배율) ---------- */
  function labels(container, LABS) {
    container.innerHTML = LABS.map((l) => `<div class="lab ${l.cls || ''}" id="lab-${l.id}" style="left:${l.x}px;top:${l.y}px">${l.tex ? `<span data-tex="${esc(l.tex)}"></span>` : l.html}</div>`).join('');
    renderTexIn(container);
    paintVars(container);
    const els = LABS.map((l) => [l.id, $('lab-' + l.id)]);
    return (s) => els.forEach(([id, el]) => {
      const o = (s.lab && s.lab[id]) || 0;
      el.style.opacity = clamp(o * 1.5);
      if (o > 0) el.style.transform = `translate(-50%, -50%) scale(${((.6 + .4 * backOut(o)) * ((s.labS && s.labS[id]) || 1)).toFixed(3)})`;
    });
  }

  /* ---------- 오른쪽 공식 판 (s.board = { key, items: [0..1] }, s.bars[id] = 0..1) ---------- */
  function board(el, BOARDS) {
    let current = '';
    const itemHTML = (it) => {
      if (it.tex) return `<div class="tex${it.big ? ' big' : ''}${it.box ? ' box' : ''}"${it.fs ? ` style="font-size:${it.fs}px"` : ''} data-tex="${esc(it.tex)}"></div>`;
      if (it.bars) return `<div class="bars">${it.bars.map(([label, val, id, col]) => `<div class="bar-row"><span>${esc(label)}</span><div class="track"><i data-bar="${id}" style="background:${col}"></i><em>${esc(val)}</em></div></div>`).join('')}</div>`;
      return it.html;
    };
    return (s) => {
      if (!s.board) { el.style.opacity = 0; return; }
      el.style.opacity = 1;
      if (s.board.key !== current) {
        current = s.board.key;
        const cfg = BOARDS[current];
        el.innerHTML = `<div class="kicker">${esc(cfg.kicker)}</div>` + cfg.items.map((it) => `<div class="item">${itemHTML(it)}</div>`).join('');
        renderTexIn(el);
        paintVars(el);
      }
      el.querySelectorAll('.item').forEach((node, i) => {
        const o = s.board.items[i] || 0;
        node.style.opacity = clamp(o * 1.4);
        node.style.transform = `scale(${(.85 + .15 * backOut(o)).toFixed(3)})`;
      });
      el.querySelectorAll('[data-bar]').forEach((bar) => {
        const v = ((s.bars && s.bars[bar.dataset.bar]) || 0) * 100;
        bar.style.width = v + '%';
        // 막대가 거의 꽉 차면 글자를 막대 안쪽 끝에 둔다
        const em = bar.nextElementSibling;
        if (v > 72) { em.style.left = 'auto'; em.style.right = `calc(${100 - v}% + 14px)`; } else { em.style.right = 'auto'; em.style.left = `calc(${v}% + 12px)`; }
      });
    };
  }

  function chips(el, names) {
    el.innerHTML = names.map((c, i) => `<span>${i + 1}. ${esc(c)}</span>`).join('');
    const spans = [...el.children];
    return (chap) => spans.forEach((sp, i) => { sp.classList.toggle('on', i === chap); sp.classList.toggle('done', i < chap); });
  }

  function chapTag(el) {
    return (s) => {
      if (s.chapTag && s.chapTag.o > 0) {
        setText(el, s.chapTag.text);
        el.style.opacity = clamp(s.chapTag.o * 1.5);
        el.style.transform = `rotate(-3deg) scale(${(.5 + .5 * s.chapTag.o).toFixed(3)})`;
      } else el.style.opacity = 0;
    };
  }

  /* ---------- 내레이션(TTS) 시간 ----------
   * window.NARRATION(narration.js, narrate.py 가 생성) = { holds: [[대본시각, 멈출 초], …], lines: [{start, lead, dur}, …] } */
  function narration() {
    const NAR = root.NARRATION || { holds: [], lines: [] };
    const HOLDS = NAR.holds.slice().sort((a, b) => a[0] - b[0]);
    const HOLD_TOTAL = HOLDS.reduce((sum, [, d]) => sum + d, 0);
    const scriptTime = (V) => {
      let acc = 0;
      for (const [at, dur] of HOLDS) {
        const vs = at + acc;
        if (V < vs) break;
        if (V < vs + dur) return at;
        acc += dur;
      }
      return V - acc;
    };
    const videoTime = (S) => S + HOLDS.reduce((acc, [at, dur]) => acc + (at < S ? dur : 0), 0);
    const LINES = NAR.lines.map((l) => ({ ...l, v: videoTime(l.start) + (l.lead || 0) }));
    const talking = (V, s) => {
      if (LINES.length) {
        let cur = null;
        for (const l of LINES) { if (l.v <= V) cur = l; else break; }
        const k = cur ? V - cur.v : -1;
        return k >= 0 && k < cur.dur && Math.floor(k * 7) % 2 === 0;
      }
      return s.talk < 2.6 && Math.floor(s.talk * 7) % 2 === 0;
    };
    return { HOLDS, HOLD_TOTAL, scriptTime, videoTime, LINES, talking };
  }

  /* 자막 목록(대본 시각)과 멈춤 후보 — narrate.py 가 render.mjs --captions 로 받아 간다.
   * hold: 그 자막 구간에서 화면이 멈춰 있는(state 가 변하지 않는) 가장 늦은 시각 */
  function exportCaptions(tl, baseState) {
    root.__exportCaptions = () => {
      const out = [];
      let last = '';
      for (let k = 0; k * .02 <= tl.duration; k++) {
        const t = k * .02, c = tl.stateAt(t, baseState).caption, txt = c ? c.text : '';
        if (txt !== last) { if (txt) out.push({ text: txt, start: Number(t.toFixed(2)) }); last = txt; }
      }
      const still = (t) => { const s = tl.stateAt(t, baseState); s.caption = null; s.talk = 0; return JSON.stringify(s); };
      out.forEach((c, i) => {
        const b = (i + 1 < out.length ? out[i + 1].start : tl.duration) - .05;
        c.hold = Number(b.toFixed(2));
        for (let t = b; t >= c.start + .3; t -= .02) {
          if (still(t) === still(t + .04)) { c.hold = Number(t.toFixed(2)); break; }
        }
      });
      return { duration: tl.duration, captions: out };
    };
  }

  /* ---------- 시리즈 편 이동 (무대 밖, 영상에는 찍히지 않는다) ---------- */
  const SERIES = [
    { dir: 'ep1-mean-variance', title: '평균·편차·분산' },
    { dir: 'ep2-loss-function', title: '오차와 손실함수' },
    { dir: 'ep3-gradient-descent', title: '경사하강법' },
  ];
  /* <nav id="seriesNav" data-ep="1"> 안에 목록·이전·편 번호·다음 링크를 만든다. 경로는 편 폴더 기준 상대 경로 */
  function seriesNav(nav) {
    if (!nav) return;
    const cur = Number(nav.dataset.ep) - 1;
    const href = (i) => `../${SERIES[i].dir}/index.html`;
    const step = (i, cls, label) => (SERIES[i]
      ? `<a class="sn-btn ${cls}" href="${href(i)}" aria-label="${label}: ${i + 1}편 ${SERIES[i].title}">${cls === 'prev' ? '← ' : ''}${label}${cls === 'next' ? ' →' : ''}</a>`
      : `<span class="sn-btn ${cls}" aria-disabled="true">${cls === 'prev' ? '← ' : ''}${label}${cls === 'next' ? ' →' : ''}</span>`);
    const eps = SERIES.map((e, i) => (i === cur
      ? `<li><span class="sn-btn sn-ep" aria-current="page"><b>${i + 1}</b><span class="t">${e.title}</span><em>보는 중</em></span></li>`
      : `<li><a class="sn-btn sn-ep" href="${href(i)}" aria-label="${i + 1}편 ${e.title}"><b>${i + 1}</b><span class="t">${e.title}</span></a></li>`)).join('');
    // 마지막 편은 바로 옆의 체험활동 버튼이 다음 단계라서 '다음 편'을 두지 않는다
    const next = SERIES[cur + 1] ? step(cur + 1, 'next', '다음 편') : '';
    nav.innerHTML = `<a class="sn-btn sn-home" href="../index.html">☰ 전체 목록</a>${step(cur - 1, 'prev', '이전 편')}<ol class="sn-eps">${eps}<li><a class="sn-btn sn-act" href="${ACTIVITY}">✎ 체험활동${next ? '' : ' →'}</a></li></ol>${next}`;
  }
  const ACTIVITY = '../activity/index.html';

  /* 재생기 시작. draw(s, V, talking) 가 장면을 그린다(자막은 여기서 그린다). */
  function boot({ tl, baseState, draw }) {
    const nav = $('seriesNav');
    seriesNav(nav);
    const N = narration();
    const renderCaption = root.Motion.captionRenderer($('caption'));
    exportCaptions(tl, baseState);
    function render(V) {
      const s = tl.stateAt(N.scriptTime(V), baseState);
      draw(s, V, N.talking(V, s));
      renderCaption(s);
    }
    const audio = $('narration');
    // 재생 속도 고르기(재생 바 앞). 세 편 template 을 고치지 않도록 여기서 만든다
    const scrub = $('scrub'), speed = document.createElement('select');
    speed.id = 'speedSel';
    [[.75, '0.75×'], [1, '1×'], [1.25, '1.25×'], [1.5, '1.5×']].forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; o.selected = v === 1; speed.append(o); });
    const speedLab = document.createElement('label');
    speedLab.className = 'sr'; speedLab.htmlFor = 'speedSel'; speedLab.textContent = '재생 속도';
    const scrubLab = scrub.previousElementSibling && scrub.previousElementSibling.tagName === 'LABEL' ? scrub.previousElementSibling : scrub;
    scrubLab.before(speedLab, speed);
    root.Motion.player({
      stage: $('stage'), wrap: $('stageWrap'), duration: tl.duration + N.HOLD_TOTAL,

      [0, 1, 2, 3, 4].forEach((i) => { const a = (-160 + i * 35) * Math.PI / 180; bl += L(Math.cos(a) * 42, by + Math.sin(a) * 42, Math.cos(a) * 58, by + Math.sin(a) * 58, { stroke: P.brass, 'stroke-width': 5, 'stroke-linecap': 'round' }); });
      s += G(bl, 'translate(-46 -44) rotate(-8)');

    if (face === 'surprised') [[-96, -300], [96, -300]].forEach(([x, y], i) => { s += Pth(`M${x} ${y} l${i ? 12 : -12} -14 M${x + (i ? 6 : -6)} ${y + 10} l${i ? 16 : -16} -4`, { stroke: P.ink, 'stroke-width': 4.5, 'stroke-linecap': 'round' }); });
    if (face === 'sad') s += Pth('M-150 -300 q10 -10 20 0 q10 10 20 0 q10 -10 20 0', { fill: 'none', stroke: '#8a9aa0', 'stroke-width': 5, 'stroke-linecap': 'round' });
    if (face === 'happy') [[-100, -300, 1], [104, -262, .8]].forEach(([x, y, k]) => { s += G(Pth('M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z', { fill: P.brassLight, ...OL(2.5) }), `translate(${x} ${f1(y + Math.sin(V * 3 + x) * 3)}) scale(${k})`); });
    const o = g.o === undefined ? 1 : g.o;
    return G(s, `translate(${f1(g.x)} ${f1(g.y)}) scale(${(g.k || 1).toFixed(3)})`, o);
  }

  root.GrayChar = { draw, P, FACES: ['smile', 'happy', 'think', 'puzzled', 'eureka', 'surprised', 'sad'], POSES: Object.keys(POSES) };
})(window);

<script>
/* 「빗나간 예측」 — 그레이 박사의 연구 노트 ① (오차 → 오차가 작아야 하는 이유 → 오차 제곱의 평균)
 *
 * 말하는 사람은 그레이 박사 한 명. 박사가 혼잣말로 묻고 스스로 답을 찾아간다.
 * 대사 한 줄 = 타임라인 한 마디(beat). 길이는 글자 수로 정하고, TTS 를 붙이면 narrate.py 가 말 길이만큼 장면을 멈춰 늘린다.
 * 그림은 매 프레임 SVG 문자열로 다시 그린다(장면이 단순해서 충분히 가볍다).
 * state 에는 대본 시각(lt)으로 계산한 값만 넣는다. 흔들림·깜빡임처럼 계속 변하는 것은 영상 시각 V 로 그린다.
 */
(function (root) {
  'use strict';
  const { clamp, lerp, prog, frames, visited, timeline, inOut } = root.Motion;
  const { say, chips, chapTag, boot, backOut, textWidth } = root.Kit;
  const $ = (id) => document.getElementById(id);

  /* ---------- 색 (방탈출 연구소 색을 밝고 귀엽게) ---------- */
  const P = {
    ink: '#33403f', muted: '#6d7a78', paper: '#fffdf7', line: '#d9cfbb',
    teal: '#3f8a8f', tealSoft: '#d8edeb', tealInk: '#2a6a70',
    brass: '#e2a940', brassSoft: '#fbefd0', brassInk: '#9c6a14',
    coral: '#ec7357', coralSoft: '#fde1d8', coralInk: '#c2472d',
    sky: '#4f8fd6', skySoft: '#deebfb', skyInk: '#2c66b0',
    wood: '#b07a52', woodLight: '#d39f72', woodDark: '#7d5236',
    green: '#3e9b6d', iron: '#5d6a72', ironHi: '#9aa7ae', rust: '#b8763d', rustLight: '#d29a62',
    skin: '#f9d7b9', cheek: '#f3a49b', hair: '#7a4a2e', streak: '#f1ede6', beard: '#a3917f', beardDk: '#8a7969',
    vest: '#3f8a8f', shirt: '#fff4df', tie: '#c35b3f', pants: '#8a5a3c', boot: '#5a3b29', mouth: '#7a3527',
  };
  const GOOD = [117, 122, 120, 123, 118];
  const OLD = [90, 140, 120, 150, 100];
  /* 5장: 추 개수 x 와 용수철 전체 길이 y(cm). 평균점 (3, 16) */
  const BX = [1, 2, 3, 4, 5], BY = [12.5, 13, 16.5, 18, 20], BMX = 3, BMY = 16;
  const fitY = (a, x) => a * (x - BMX) + BMY;
  const resid = (a) => BX.map((x, i) => BY[i] - fitY(a, x));
  const sgn1 = (e) => { const v = Math.round(e * 10) / 10; return (v > 0 ? '+' : v < 0 ? '−' : '') + String(Math.abs(v)); };
  const msd = (arr, c) => arr.reduce((s, v) => s + (v - c) ** 2, 0) / arr.length;
  const sgn = (e) => (e > 0 ? '+' : e < 0 ? '−' : '') + Math.abs(e);
  const fmt1 = (v) => (Math.round(v * 10) / 10).toFixed(1);

  /* ---------- SVG 문자열 도구 ---------- */
  const f1 = (n) => (Math.round(n * 10) / 10).toString();
  const A = (o) => Object.entries(o).filter(([, v]) => v !== undefined && v !== null && v !== false).map(([k, v]) => `${k}="${typeof v === 'number' ? f1(v) : v}"`).join(' ');
  const R = (x, y, w, h, o = {}) => `<rect ${A({ x, y, width: Math.max(0, w), height: Math.max(0, h), ...o })}/>`;
  const Cc = (cx, cy, r, o = {}) => `<circle ${A({ cx, cy, r: Math.max(0, r), ...o })}/>`;
  const E = (cx, cy, rx, ry, o = {}) => `<ellipse ${A({ cx, cy, rx: Math.max(0, rx), ry: Math.max(0, ry), ...o })}/>`;
  const L = (x1, y1, x2, y2, o = {}) => `<line ${A({ x1, y1, x2, y2, ...o })}/>`;
  const Pth = (d, o = {}) => `<path d="${d}" ${A(o)}/>`;
  const T = (x, y, str, o = {}) => `<text ${A({ x, y, class: 't', 'text-anchor': 'middle', ...o })}>${str}</text>`;
  const G = (inner, { tx = 0, ty = 0, k = 1, o = 1, rot = 0 } = {}) => (o <= .002 || !inner ? '' :
    `<g transform="translate(${f1(tx)} ${f1(ty)})${rot ? ` rotate(${f1(rot)})` : ''}${k !== 1 ? ` scale(${k.toFixed(3)})` : ''}"${o < .999 ? ` opacity="${clamp(o).toFixed(3)}"` : ''}>${inner}</g>`);
  const OL = (w = 4) => ({ stroke: P.ink, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });

  /* 둥근 알약 글자 */
  function pill(x, y, str, { size = 28, fill = '#fff', color = P.ink, anchor = 'middle', pad = 22, sw = 3 } = {}) {
    const w = textWidth(str, size) + pad * 2, h = size + 22;
    const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
    return R(x0, y - h / 2, w, h, { rx: h / 2, fill, ...OL(sw) }) + T(x0 + w / 2, y + size * .36, str, { 'font-size': size, fill: color });
  }
  /* 흰 판(노트 한 장) + 제목 스티커 */
  function panel(x, y, w, h, title = '', { fill = P.paper } = {}) {
    let s = R(x + 6, y + 8, w, h, { rx: 26, fill: P.ink, opacity: .12 }) + R(x, y, w, h, { rx: 26, fill, ...OL(3) });
    if (title) s += G(pill(0, 0, title, { size: 22, fill: P.brass, anchor: 'start', pad: 16 }), { tx: x + 26, ty: y, rot: -2 });
    return s;
  }
  function arrowH(x1, x2, y, col, w = 9) {
    if (Math.abs(x2 - x1) < 3) return '';
    const dir = Math.sign(x2 - x1), head = Math.min(24, Math.abs(x2 - x1) * .55), xe = x2 - dir * head;
    return L(x1, y, xe, y, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }) +
      Pth(`M${f1(x2)} ${f1(y)} L${f1(xe)} ${f1(y - head * .62)} L${f1(xe)} ${f1(y + head * .62)} Z`, { fill: col, stroke: col, 'stroke-width': 2, 'stroke-linejoin': 'round' });
  }
  function coin(x, y, r = 19, { dashed = false, hl = false } = {}) {
    if (dashed) return Cc(x, y, r, { fill: 'none', stroke: P.muted, 'stroke-width': 3, 'stroke-dasharray': '6 5' });
    return Cc(x, y, r, { fill: hl ? P.coral : P.brass, ...OL(3) }) + Cc(x, y, r * .55, { fill: 'none', stroke: hl ? '#fff' : P.brassInk, 'stroke-width': 2.5, opacity: .7 });
  }
  function envelope(x, y, w = 130, h = 84, seal = true) {
    return R(x - w / 2, y - h / 2, w, h, { rx: 8, fill: '#fffaf0', ...OL(3.5) }) +
      Pth(`M${f1(x - w / 2 + 4)} ${f1(y - h / 2 + 4)} L${f1(x)} ${f1(y + 6)} L${f1(x + w / 2 - 4)} ${f1(y - h / 2 + 4)}`, { fill: 'none', ...OL(3) }) +
      (seal ? Cc(x, y + 6, 11, { fill: P.coralInk, ...OL(2.5) }) : '');
  }
  function check(x, y, s = 1, col = P.green) { return Pth(`M${x - 18 * s} ${y} L${x - 5 * s} ${y + 14 * s} L${x + 20 * s} ${y - 16 * s}`, { fill: 'none', stroke: col, 'stroke-width': 9 * s, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }); }
  function cross(x, y, s = 1, col = P.coralInk) { return Pth(`M${x - 15 * s} ${y - 15 * s} L${x + 15 * s} ${y + 15 * s} M${x + 15 * s} ${y - 15 * s} L${x - 15 * s} ${y + 15 * s}`, { stroke: col, 'stroke-width': 9 * s, 'stroke-linecap': 'round' }); }
  function gear(x, y, r, teeth, rot, col = P.brass, o = 1) {
    let d = '';
    for (let i = 0; i < teeth * 2; i++) {
      const a = (i / (teeth * 2)) * Math.PI * 2, rr = i % 2 ? r : r * 1.16;
      d += `${i ? 'L' : 'M'}${f1(Math.cos(a) * rr)} ${f1(Math.sin(a) * rr)} `;
    }
    return G(Pth(d + 'Z', { fill: col, ...OL(3) }) + Cc(0, 0, r * .38, { fill: P.paper, ...OL(3) }), { tx: x, ty: y, rot, o });
  }
  /* 와이 햇(ŷ): 글꼴에 없을 수 있어 y 위에 모자를 직접 그린다 */
  function yhat(x, y, size, col = P.ink) {
    return T(x, y, 'y', { 'font-size': size, fill: col, 'font-style': 'italic' }) +
      Pth(`M${f1(x - size * .2)} ${f1(y - size * .78)} L${f1(x + size * .02)} ${f1(y - size * .98)} L${f1(x + size * .24)} ${f1(y - size * .78)}`, { fill: 'none', stroke: col, 'stroke-width': size * .07, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  }

  /* ---------- 그레이 박사: gray.js(window.GrayChar) 를 쓴다. 캐릭터 시트는 character-sheet.html ---------- */
  const gray = (g, V, talking) => root.GrayChar.draw(g, V, talking);

  /* ---------- 용수철 측정대 ---------- */
  function springRig({ cx, top, h = 560, len = 160, weights = 1, old = false, tag = '', o = 1, V = 0, shake = 0, k = 1 }) {
    const wob = old ? Math.sin(V * 11) * 5 * shake : 0;
    const metal = old ? P.rust : P.brass;
    let s = R(-176, h, 352, 38, { rx: 16, fill: P.wood, ...OL(4) });
    s += R(-130, 0, 26, h, { rx: 9, fill: metal, ...OL(4) }) + R(104, 0, 26, h, { rx: 9, fill: metal, ...OL(4) });
    s += R(-152, -28, 304, 34, { rx: 15, fill: metal, ...OL(4) });
    s += R(64, 34, 32, h - 72, { rx: 7, fill: '#fff', ...OL(3) });
    for (let yy = 52; yy < h - 46; yy += 24) s += L(64, yy, (yy - 52) % 96 === 0 ? 88 : 78, yy, { stroke: P.ink, 'stroke-width': 2.5 });
    const n = 14, x0 = wob, y1 = 6 + len;
    let d = `M${f1(x0)} 6`;
    for (let i = 1; i <= n; i++) d += ` L${f1(x0 + (i % 2 ? 28 : -28))} ${f1(6 + len * (i - .5) / n)}`;
    d += ` L${f1(x0)} ${f1(y1)}`;
    s += Pth(d, { fill: 'none', stroke: P.ink, 'stroke-width': 11, 'stroke-linejoin': 'round' }) + Pth(d, { fill: 'none', stroke: old ? P.rustLight : '#e8b850', 'stroke-width': 5.5, 'stroke-linejoin': 'round' });
    s += L(x0, y1, x0, y1 + 16, { stroke: P.ink, 'stroke-width': 6 });
    s += L(x0, y1, 62, y1, { stroke: P.coralInk, 'stroke-width': 5 }) + Pth(`M62 ${f1(y1)} l-14 -9 l0 18 Z`, { fill: P.coralInk });
    for (let i = 0; i < weights; i++) {
      const wy = y1 + 16 + i * 50;
      s += R(x0 - 36, wy, 72, 46, { rx: 13, fill: P.iron, ...OL(4) }) + R(x0 - 25, wy + 8, 18, 8, { rx: 4, fill: P.ironHi });

    return G(s, { tx: cx, ty: top, k, o });
  }

  /* ---------- 수직선 ---------- */
  function numLine({ x0, x1, y, lo, hi, every = 1, size = 22 }) {
    const X = (v) => x0 + ((v - lo) / (hi - lo)) * (x1 - x0);
    let s = L(x0 - 20, y, x1 + 20, y, { stroke: P.ink, 'stroke-width': 4, 'stroke-linecap': 'round' });
    for (let v = lo; v <= hi + 1e-9; v += 1) {
      const major = Math.round(v - lo) % every === 0;
      s += L(X(v), y - (major ? 12 : 7), X(v), y + (major ? 12 : 7), { stroke: P.ink, 'stroke-width': 3 });
      if (major) s += T(X(v), y + 42, String(v), { 'font-size': size, fill: P.muted });
    }
    return { svg: s, X };
  }

  /* ---------- 손님 ---------- */
  function customer(x, y, k, mood, V) {
    const col = '#8cc3d3';
    let s = E(0, 0, 86, 92, { fill: col, ...OL(4) });
    s += E(0, -88, 64, 14, { fill: P.ink }) + R(-38, -150, 76, 62, { rx: 24, fill: P.ink });
    s += R(-38, -112, 76, 10, { fill: P.coral });
    if (mood === 'angry') {
      s += Pth('M-36 -42 L-12 -32 M36 -42 L12 -32', { stroke: P.ink, 'stroke-width': 5, 'stroke-linecap': 'round' });
      s += Cc(-24, -18, 7, { fill: P.ink }) + Cc(24, -18, 7, { fill: P.ink }) + Pth('M-16 18 Q0 6 16 18', { fill: 'none', ...OL(5) });
      s += Pth(`M70 -96 q12 -14 24 0 q12 -14 24 0`, { fill: 'none', stroke: P.coralInk, 'stroke-width': 5, 'stroke-linecap': 'round', transform: `translate(0 ${f1(Math.sin(V * 8) * 3)})` });
    } else {
      s += Cc(-24, -18, 7, { fill: P.ink }) + Cc(24, -18, 7, { fill: P.ink });
      s += mood === 'puzzled' ? Pth('M-10 16 q5 -5 10 0 q5 5 10 0', { fill: 'none', ...OL(4) }) : Pth('M-12 10 Q0 20 12 10', { fill: 'none', ...OL(4) });
      if (mood === 'puzzled') s += T(96, -88, '?', { 'font-size': 60, fill: P.coralInk });
    }
    s += E(-44, 0, 11, 7, { fill: P.cheek, opacity: .7 }) + E(44, 0, 11, 7, { fill: P.cheek, opacity: .7 });
    return G(s, { tx: x, ty: y, k });
  }

  /* ---------- 천칭 ---------- */
  function balance({ cx, py = 400, by = 800, tilt = 0, tokens = [], label = '', o = 1, sum = null }) {
    const t = tilt * Math.PI / 180, arm = 240;
    const ends = [-1, 1].map((d) => ({ x: cx + d * arm * Math.cos(t), y: py + d * arm * Math.sin(t) }));
    const pans = ends.map((e) => ({ x: e.x, y: e.y + 170 }));
    let s = E(cx, by + 6, 120, 24, { fill: P.wood, ...OL(4) }) + R(cx - 13, py, 26, by - py, { rx: 8, fill: P.brass, ...OL(4) });
    pans.forEach((p, i) => {
      s += L(ends[i].x, ends[i].y, p.x - 74, p.y, { stroke: P.ink, 'stroke-width': 3 }) + L(ends[i].x, ends[i].y, p.x + 74, p.y, { stroke: P.ink, 'stroke-width': 3 });
    });
    s += G(R(-arm - 14, -11, arm * 2 + 28, 22, { rx: 11, fill: P.brass, ...OL(4) }), { tx: cx, ty: py, rot: tilt });
    s += Cc(cx, py, 15, { fill: P.brassSoft, ...OL(4) });
    s += Pth(`M${cx - 18} ${py - 12} L${cx} ${py - 46} L${cx + 18} ${py - 12} Z`, { fill: P.coralInk, ...OL(3) });
    // 토큰(접시 위·가운데)
    const slot = { L: [0, 0], R: [0, 0] };
    tokens.forEach((tk) => {
      const side = tk.e < 0 ? 0 : tk.e > 0 ? 1 : -1;
      let tx, ty;
      if (side < 0) { tx = cx; ty = py - 84; } else {
        const key = side ? 'R' : 'L', n = slot[key][0]++;
        const gap = (tk.r || 32) + 8;
        tx = pans[side].x + (n ? gap : -gap); ty = pans[side].y - (tk.r || 32);
      }
      const p = tk.p;
      if (p <= 0) return;
      const sx = tk.sx, sy = tk.sy;
      const x = lerp(sx, tx, p), y = lerp(sy, ty, p) - Math.sin(Math.PI * p) * 60;
      s += token(x, y, tk.e, tk.r || 32);
    });
    pans.forEach((p) => { s += Pth(`M${f1(p.x - 86)} ${f1(p.y)} Q${f1(p.x)} ${f1(p.y + 56)} ${f1(p.x + 86)} ${f1(p.y)} Z`, { fill: P.brass, ...OL(4) }); });
    if (label) s += pill(cx, by + 64, label, { size: 26 });
    if (sum !== null && sum.o > 0) s += G(pill(cx, py - 150, sum.text, { size: 34, fill: P.brassSoft }), { o: sum.o });
    return G(s, { o });
  }

  line('오늘 찾은 것. 오차는 실제값 빼기 예측값.', { face: 'smile', pose: 'idle' }, (s, lt) => {

  /* ---------- 장별 그림 ---------- */

  DRAW[0] = (s, V) => {

    let o = '';
    const post = (c.post || 0) * (1 - (c.lab || 0));
    if (post > 0) {
      let p = R(1050, 150, 420, 70, { rx: 20, fill: P.teal, ...OL(4) }) + T(1260, 197, '헤일번 우체국', { 'font-size': 34, fill: '#fff' });

      p += customer(1560, 560, 1, (c.drop2 || 0) > .95 ? 'puzzled' : 'calm', V);

      const d1 = c.drop1 || 0, lf = c.lift || 0, d2 = c.drop2 || 0;

      // 편지

  DRAW[1] = (s, V) => {

    if ((c.card1 || 0) > 0) {

    }

  DRAW[2] = (s, V) => {

    let o = '';
    const fadeA = 1 - (c.j || 0);
    const caseCard = (x, e, lines, coinsNeed, coinsGot, loser, col, soft, ink) => {
      let k = panel(x, 170, 690, 410);

      k += T(x + 150, 418, '받아야 할 요금', { 'font-size': 22, fill: P.muted, 'text-anchor': 'end' });
      k += T(x + 150, 478, e < 0 ? '받은 요금' : '낸 요금', { 'font-size': 22, fill: P.muted, 'text-anchor': 'end' });
      for (let i = 0; i < 5; i++) {

    if ((c.b || 0) > 0) o += G(caseCard(1150, 3, ['바늘이 더 내려간다', '→ 편지가 무겁게 재진다'], 3, 4, '손님 손해', P.coral, P.coralSoft, P.coralInk), { o: c.b * fadeA, tx: (1 - c.b) * 40 });

      o += G(springRig({ cx: 700, top: 210, h: 560, len: 260 + wob, weights: 1, tag: `${reads[Math.floor(V * 1.6) % 5]} mm`, V }), { o: jo });

    }

      g += check(1150, 500) + T(1200, 512, '오차를 되도록 작게', { 'font-size': 46, 'text-anchor': 'start' });

    if ((c.ga || 0) > 0) {

      ta.forEach((t) => { if (t.p <= 0 && (c.tokO || 0) > 0) b += G(token(t.sx, t.sy, t.e), { o: c.tokO }); });
      o += G(b, { o: c.balA * dim });

    if ((c.oldRead || 0) > 0) {
      OLD.forEach((v, i) => { o += G(pill(1200 + i * 100, 200, String(v), { size: 26, fill: P.tealSoft, color: P.tealInk, pad: 14 }), { o: clamp(c.oldRead * 5 - i) * dim }); });

      tb.forEach((t) => { if (t.p <= 0) b += token(t.sx, t.sy, t.e, 38); });

    }

      k += T(980, 300, '편차의 합은 언제나 0', { 'font-size': 52 });
      const chip = (x, e, p, toX) => G(token(0, 0, e, 44), { tx: lerp(x, toX, p), ty: 470, o: 1 - prog(p, .8, .2) });

      k += chip(760, -2, p2, 920) + chip(1200, 2, p2, 1040);

      if (p2 > .9) k += G(T(980, 400, '−2 + 2 = 0', { 'font-size': 30, fill: P.muted }), { o: prog(p2, .9, .1) });
      k += T(980, 640, '양수와 음수가 서로 지워진다', { 'font-size': 36, fill: P.coralInk });
      o += G(k, { o: c.card, tx: (1 - c.card) * 60 });
    }

  };

  /* 5장. 평균점의 함정 */
  const MPX = (x) => 500 + x * 165, MPY = (y) => 860 - (y - 8) * 38;
  const STAR5 = 'M0 -20 L5.9 -8.1 L19 -6.2 L9.5 3.1 L11.8 16.2 L0 10 L-11.8 16.2 L-9.5 3.1 L-19 -6.2 L-5.9 -8.1 Z';
  function fitPlot({ X, Y, a, pts = 1, mean = 0, line = 1, res = 0, sq = 0, ys = 38, fan = 0, bad = 0, x0 = 0, x1 = 6.2, y0 = 8, y1 = 24, small = false }) {
    const fs = small ? 18 : 22;
    let o = L(X(x0), Y(y0), X(x1), Y(y0), { stroke: P.ink, 'stroke-width': 4, 'stroke-linecap': 'round' }) + L(X(x0), Y(y0), X(x0), Y(y1), { stroke: P.ink, 'stroke-width': 4, 'stroke-linecap': 'round' });
    for (let x = 1; x <= 6; x++) o += L(X(x), Y(y0) - 7, X(x), Y(y0) + 7, { stroke: P.ink, 'stroke-width': 3 }) + T(X(x), Y(y0) + 34, String(x), { 'font-size': fs, fill: P.muted });
    for (let y = 8; y <= 24; y += 4) o += L(X(x0) - 7, Y(y), X(x0) + 7, Y(y), { stroke: P.ink, 'stroke-width': 3 }) + T(X(x0) - 16, Y(y) + 7, String(y), { 'font-size': fs, fill: P.muted, 'text-anchor': 'end' });
    o += T(X(x1) - 4, Y(y0) + (small ? 62 : 70), '추 개수', { 'font-size': fs, fill: P.muted, 'text-anchor': 'end' }) + T(X(x0) + 14, Y(y1) + 6, '길이(cm)', { 'font-size': fs, fill: P.muted, 'text-anchor': 'start' });
    if (fan > 0) [3, 2.5, 1.5, .5, -.5, -1.5, -2].forEach((fa, i) => {
      const f = clamp(fan * 7 - i);
      if (f > 0) o += L(X(.4), Y(fitY(fa, .4)), X(5.6), Y(fitY(fa, 5.6)), { stroke: P.brass, 'stroke-width': 3, opacity: .45 * f, 'stroke-dasharray': '10 8' });
    });
    if (line > 0) {
      const xa = lerp(BMX, .4, line), xb = lerp(BMX, 5.6, line);
      o += L(X(xa), Y(fitY(a, xa)), X(xb), Y(fitY(a, xb)), { stroke: bad > 0 ? P.coralInk : P.brassInk, 'stroke-width': 6, 'stroke-linecap': 'round' });
    }
    const r = resid(a);
    BX.forEach((x, i) => {
      const p = clamp(pts * 5 - i);
      if (p <= 0) return;
      const e = r[i], yp = Y(BY[i]), yl = Y(fitY(a, x));
      if (res > 0 && Math.abs(e) > .01) {
        const col = e > 0 ? P.coral : P.sky;
        if (sq > 0) {
          const sd = Math.abs(e) * ys * backOut(sq);
          o += R(X(x), Math.min(yp, yl), sd, sd, { fill: P.coralSoft, 'fill-opacity': .7, stroke: P.coralInk, 'stroke-width': 3 });
        }
        o += L(X(x), yl, X(x), lerp(yl, yp, res), { stroke: col, 'stroke-width': 7, 'stroke-linecap': 'round' });
        if (!sq) o += G(pill(X(x) - 18, (yp + yl) / 2, sgn1(e), { size: small ? 18 : 20, fill: e > 0 ? P.coralSoft : P.skySoft, color: e > 0 ? P.coralInk : P.skyInk, pad: 10, sw: 2.5, anchor: 'end' }), { o: prog(res, .6, .4) });
      }
      o += G(Cc(X(x), yp, small ? 10 : 13, { fill: P.teal, ...OL(3) }), { o: p });
    });
    if (mean > 0) {
      o += G(L(X(BMX), Y(BMY), X(BMX), Y(y0), { stroke: P.tealInk, 'stroke-width': 2.5, 'stroke-dasharray': '6 6' }) + L(X(BMX), Y(BMY), X(x0), Y(BMY), { stroke: P.tealInk, 'stroke-width': 2.5, 'stroke-dasharray': '6 6' }) +
        G(Pth(STAR5, { fill: P.brass, ...OL(3) }), { tx: X(BMX), ty: Y(BMY), k: small ? .8 : 1.1 }), { o: mean });
    }
    return o;
  }

  DRAW.mp = (s) => {
    const c = s.cm, a = c.a ?? 2;
    let o = panel(400, 150, 1130, 780, '추 개수와 용수철 길이');
    o += fitPlot({ X: MPX, Y: MPY, a, pts: c.pts || 0, mean: c.mean || 0, line: c.line || 0, res: c.res || 0, fan: c.fan || 0, bad: c.bad || 0 });
    if ((c.mean || 0) > 0) o += G(pill(MPX(BMX) + 30, MPY(BMY) + 52, '평균점 (3, 16)', { size: 26, fill: P.tealSoft, color: P.tealInk, anchor: 'start' }), { o: c.mean * (1 - (c.fan || 0)) });
    if ((c.bad || 0) > 0) o += G(pill(MPX(.4), MPY(fitY(a, .4)) - 44, '엉뚱한 예측', { size: 24, fill: P.coralSoft, color: P.coralInk, anchor: 'start' }), { o: c.bad * (1 - (c.fan || 0)) });
    if ((c.box || 0) > 0) {
      const r = resid(a);
      let k = panel(1570, 150, 310, 600, '오차');
      k += pill(1725, 216, `기울기 ${fmt1(a)}`, { size: 26, fill: c.bad > 0 ? P.coralSoft : P.brassSoft, color: c.bad > 0 ? P.coralInk : P.brassInk });
      r.forEach((e, i) => {
        k += T(1620, 300 + i * 56, `추 ${BX[i]}개`, { 'font-size': 22, fill: P.muted, 'text-anchor': 'start' });
        k += T(1850, 300 + i * 56, Math.abs(e) < .05 ? '0' : sgn1(e), { 'font-size': 28, fill: e > .05 ? P.coralInk : e < -.05 ? P.skyInk : P.brassInk, 'text-anchor': 'end' });
      });
      k += L(1600, 572, 1850, 572, { stroke: P.ink, 'stroke-width': 3 });
      k += G(T(1620, 640, '합', { 'font-size': 30, 'text-anchor': 'start' }) + T(1850, 652, '0', { 'font-size': 72, fill: P.coralInk, 'text-anchor': 'end' }), { o: c.sum || 0 });
      o += G(k, { o: c.box });
    }
    if ((c.why || 0) > 0) {
      let k = R(560, 640, 950, 260, { rx: 26, fill: '#fff', ...OL(3.5) });
      k += T(600, 700, '오차의 합', { 'font-size': 30, 'text-anchor': 'start', fill: P.muted });
      k += T(600, 760, '= (높이 편차의 합) − 기울기 × (추 개수 편차의 합)', { 'font-size': 32, 'text-anchor': 'start' });
      k += G(T(600, 840, '= 0 − 기울기 × 0 = 0', { 'font-size': 44, 'text-anchor': 'start', fill: P.coralInk }), { o: c.why2 || 0 });
      o += G(k, { o: c.why });
    }
    if ((c.ban || 0) > 0) o += G(R(480, 172, 970, 76, { rx: 38, fill: P.coralSoft, ...OL(3.5) }) + T(965, 222, '평균점을 지나는 직선은 모두 오차의 합 = 0', { 'font-size': 34, fill: P.coralInk }), { o: c.ban });
    return o;
  };

  DRAW[4] = (s) => {
    const c = s.c4;
    let o = '';
    const pq = c.pq || 0;
    if (pq < 1) {
      const u = 48, base = 720;
      let k = '';
      GOOD.forEach((v, i) => {
        const e = v - 120, x = 470 + i * 230, side = Math.abs(e) * u, p = (c.sq || [])[i] || 0;
        const col = e < 0 ? P.sky : P.coral;
        if (e !== 0) k += G(L(x - side / 2, base + 46, x + side / 2, base + 46, { stroke: col, 'stroke-width': 14, 'stroke-linecap': 'round' }), { o: (c.bars || 0) * (1 - p * .5) });
        k += G(T(x, base + 100, e === 0 ? '0' : sgn(e), { 'font-size': 34, fill: e < 0 ? P.skyInk : e > 0 ? P.coralInk : P.brassInk }), { o: c.bars || 0 });
        if (p > 0 && e !== 0) {
          const h = side * backOut(p);
          k += R(x - side / 2, base - h, side, h, { fill: P.coralSoft, stroke: P.coralInk, 'stroke-width': 4, 'stroke-linejoin': 'round' });
          k += G(T(x, base - side / 2 + 14, String(e * e), { 'font-size': 40, fill: P.coralInk }), { o: prog(p, .6, .4) });
        }
        if (p > 0 && e === 0) k += G(T(x, base - 20, '0', { 'font-size': 40, fill: P.brassInk }), { o: p });
      });
      k += L(380, base, 1560, base, { stroke: P.ink, 'stroke-width': 4, 'stroke-linecap': 'round' });
      if ((c.sum || 0) > 0) k += G(pill(970, 330, '9 + 4 + 0 + 9 + 4 = 26', { size: 44, fill: P.brassSoft }), { o: c.sum });
      o += G(k, { o: (c.bars || 0) * (1 - pq) });
    }
    if (pq > 0) {
      const u = 55;
      const card = (x, name, errs, sqTotal) => {
        let k = panel(x, 160, 600, 740);
        k += pill(x + 300, 214, name, { size: 34, fill: P.tealSoft, color: P.tealInk });
        k += T(x + 300, 278, `오차: ${errs.map((e) => (e === 0 ? '0' : sgn(e))).join(', ')}`, { 'font-size': 28, fill: P.muted });
        // 부호 뗀 길이 막대
        const bp = c.pqBar || 0;
        let bx = x + 300 - 2 * u;
        errs.forEach((e, i) => {
          const w = Math.abs(e) * u * bp;
          if (w > 0) k += R(bx, 330, w, 30, { rx: 8, fill: i % 2 ? P.coral : P.sky, ...OL(3) });
          bx += Math.abs(e) * u;
        });
        k += G(T(x + 300, 404, '부호 뗀 합 = 4', { 'font-size': 30 }), { o: prog(bp, .7, .3) });
        // 정사각형
        const sp = c.pqSq || 0;
        const sides = errs.map((e) => Math.abs(e) * u).filter((v) => v > 0);
        const totalW = sides.reduce((a, b) => a + b, 0) + (sides.length - 1) * 20;
        let sx = x + 300 - totalW / 2;
        sides.forEach((sd) => {
          const h = sd * backOut(sp);
          if (sp > 0) k += R(sx, 830 - h, sd, h, { fill: P.coralSoft, stroke: P.coralInk, 'stroke-width': 4 });
          if (sp > .6) k += T(sx + sd / 2, 830 - sd / 2 + 14, String((sd / u) ** 2), { 'font-size': 38, fill: P.coralInk });
          sx += sd + 20;
        });
        k += G(T(x + 300, 880, `제곱의 합 = ${sqTotal}`, { 'font-size': 32, fill: P.coralInk }), { o: prog(sp, .7, .3) });
        return k;
      };
      let k = card(400, '예측 P', [2, -2], 8) + card(1080, '예측 Q', [0, 4], 16);
      k += G(T(1040, 400, '=', { 'font-size': 70, fill: P.muted }), { o: c.pqEq || 0 });
      k += G(T(1040, 760, '<', { 'font-size': 90, fill: P.coralInk }), { o: c.pqCmp || 0 });
      if ((c.angry || 0) > 0) k += G(customer(0, 0, .62, 'angry', 0) + '', { tx: 1790, ty: 600, o: c.angry, k: .5 + .5 * backOut(c.angry) }) + G(pill(1380, 470, '한 번 크게 틀림', { size: 26, fill: P.coralSoft, color: P.coralInk }), { o: c.angry });
      o += G(k, { o: pq * (1 - (c.ln || 0)) });
    }
    if ((c.ln || 0) > 0) {
      const mini = (px, a, title, total, bad) => {
        const X = (x) => px + 90 + x * 92, Y = (y) => 790 - (y - 8) * 30;
        let k = panel(px, 160, 720, 760);
        k += pill(px + 360, 214, title, { size: 30, fill: bad ? P.coralSoft : P.brassSoft, color: bad ? P.coralInk : P.brassInk });
        k += fitPlot({ X, Y, a, pts: 1, mean: 1, line: 1, res: c.lnRes || 0, sq: c.lnSq || 0, ys: 30, bad: bad ? 1 : 0, small: true });
        k += G(T(px + 360, 896, `제곱의 합 = ${total}`, { 'font-size': 38, fill: bad ? P.coralInk : P.ink }), { o: c.lnTot || 0 });
        return k;
      };
      o += G(mini(400, 2, '평균점을 지나는 직선 ①', '1.5', false) + mini(1150, -1, '평균점을 지나는 직선 ②', '91.5', true), { o: c.ln });
    }
    return o;
  };

  DRAW[5] = (s) => {
    const c = s.c5;
    let o = '';
    const base = 830, unit = 10, sp = c.split || 0;
    const group = (x0, n, sum, o1, grow) => {
      const W = 260, H = sum * unit * grow, w1 = lerp(W / n, n === 5 ? 44 : 36, sp), gap = lerp(0, n === 5 ? 10 : 8, sp);
      let k = '';
      for (let j = 0; j < n; j++) {
        const h = lerp(H, 5.2 * unit, sp), x = x0 + j * (w1 + gap);
        k += R(x, base - h, w1, h, { fill: P.coralSoft, stroke: P.coralInk, 'stroke-width': sp > .05 ? 3 : 0 });
      }
      k += R(x0, base - H, W, H, { fill: 'none', stroke: P.coralInk, 'stroke-width': 4, opacity: 1 - sp });
      k += G(T(x0 + W / 2, base - H / 2 + 14, `넓이의 합 ${sum}`, { 'font-size': 30, fill: P.coralInk }), { o: (1 - sp) * prog(grow, .8, .2) });
      k += pill(x0 + 130, base - Math.max(H, 52) * (1 - sp) - 52 * sp - 50, n === 5 ? '5번 잰 것' : '10번 잰 것', { size: 28, fill: P.tealSoft, color: P.tealInk });
      k += G(T(x0 + 130, base + 56, n === 5 ? '26 ÷ 5 = 5.2' : '52 ÷ 10 = 5.2', { 'font-size': 34 }), { o: prog(sp, .7, .3) });
      return G(k, { o: o1 });
    };
    o += L(380, base, 1620, base, { stroke: P.ink, 'stroke-width': 4, 'stroke-linecap': 'round' });
    if ((c.left || 0) > 0) o += group(480, 5, 26, c.left, 1);
    if ((c.right || 0) > 0) o += group(1060, 10, 52, 1, c.right);
    if ((c.level || 0) > 0) {
      const y = base - 5.2 * unit;
      o += G(L(400, y, 1580, y, { stroke: P.brassInk, 'stroke-width': 4, 'stroke-dasharray': '14 10' }) + pill(1660, y, '5.2', { size: 34, fill: P.brassSoft }) +
        pill(1000, 640, '한 번 잴 때 평균적으로 틀린 정도', { size: 32, fill: '#fff' }), { o: c.level });
    }
    return o;
  };

  DRAW[6] = (s) => {
    const c = s.c6;
    let o = '';
    const ch = c.chain || [0, 0, 0];
    const xs = [520, 840, 1210], words = ['오차', '오차²', '오차²의 평균'];
    words.forEach((w, i) => {
      if (ch[i] > 0) o += G(pill(0, 0, w, { size: 44, fill: i === 2 ? P.brassSoft : '#fff' }), { tx: xs[i], ty: 250, k: .6 + .4 * backOut(ch[i]), o: ch[i] });
      if (i && ch[i] > 0) o += G(arrowH(xs[i - 1] + (i === 1 ? 70 : 90), xs[i] - (i === 1 ? 90 : 150), 250, P.muted, 6), { o: ch[i] });
    });
    if ((c.name || 0) > 0) o += G(pill(1210, 340, '= 평균제곱오차', { size: 34, fill: P.brass, color: '#fff' }), { o: c.name });
    if ((c.card || 0) > 0) {
      o += G(panel(420, 430, 1080, 170, '중학교 수학') + T(960, 540, '분산 = 편차²의 평균', { 'font-size': 52 }), { o: c.card, tx: (1 - c.card) * 120 });
    }
    if ((c.eq || 0) > 0) {
      let k = T(700, 700, '예측값 = 평균 이면', { 'font-size': 34, fill: P.muted }) + arrowH(880, 960, 690, P.muted, 6) + T(1150, 700, '오차 = 편차', { 'font-size': 40 });
      k += G(R(560, 750, 800, 110, { rx: 26, fill: P.brassSoft, ...OL(4) }) + T(960, 822, '평균제곱오차 = 분산', { 'font-size': 52, fill: P.brassInk }), { o: c.eq2 || 0 });
      o += G(k, { o: c.eq });
    }
    if ((c.bars || 0) > 0) {
      const b = c.bars;
      let k = panel(1560, 160, 320, 760, '비교');
      const base = 820;
      k += L(1590, base, 1850, base, { stroke: P.ink, 'stroke-width': 4 });
      const h1 = 5.2 * 6 * b;
      k += R(1610, base - h1, 90, h1, { fill: P.tealSoft, stroke: P.tealInk, 'stroke-width': 4 });
      k += T(1655, base - h1 - 16, '5.2', { 'font-size': 32, fill: P.tealInk });
      const h2 = lerp(0, 560, b);
      k += R(1740, base - h2, 90, h2, { fill: P.coralSoft, stroke: P.coralInk, 'stroke-width': 4 });
      if (b > .95) k += Pth(`M1730 ${base - 420} l20 -10 l20 10 l20 -10 l20 10 l20 -10 M1730 ${base - 400} l20 -10 l20 10 l20 -10 l20 10 l20 -10`, { fill: 'none', stroke: P.paper, 'stroke-width': 8 });
      k += T(1785, base - h2 - 16, '520', { 'font-size': 32, fill: P.coralInk });
      k += T(1655, base + 40, '좋은', { 'font-size': 24 }) + T(1785, base + 40, '낡은', { 'font-size': 24 });
      o += G(k, { o: Math.min(1, b * 2) });
    }
    return o;
  };

  DRAW[7] = (s) => {
    const c = s.c7;
    if (!c.show) return '';
    const cv = c.kf ? frames(c.lt, c.kf) : 120;
    let o = '';
    const nl = numLine({ x0: 380, x1: 1100, y: 330, lo: 116, hi: 124 });
    o += panel(300, 150, 880, 760, '예측값 바꿔 보기') + nl.svg;
    const X = nl.X;
    GOOD.forEach((v) => { o += Cc(X(v), 330, 12, { fill: P.teal, ...OL(3) }); });
    o += L(X(cv), 330, X(cv), 220, { stroke: P.brassInk, 'stroke-width': 6, 'stroke-linecap': 'round' }) + Pth(`M${f1(X(cv))} 220 l56 16 l-56 16 Z`, { fill: P.brass, ...OL(3) });
    o += pill(X(cv) + 112, 230, `예측 ${fmt1(cv)}`, { size: 24, fill: P.brassSoft, color: P.brassInk, pad: 12 });
    const u = 24, base = 700;
    GOOD.forEach((v, i) => {
      const x = 420 + i * 162, e = v - cv, sd = Math.abs(e) * u;
      if (sd > .5) o += R(x - sd / 2, base - sd, sd, sd, { fill: P.coralSoft, stroke: P.coralInk, 'stroke-width': 3 });
      o += T(x, base + 38, String(v), { 'font-size': 24, fill: P.tealInk });
    });
    o += L(360, base, 1140, base, { stroke: P.ink, 'stroke-width': 3 });
    o += pill(740, 820, `오차 제곱의 평균 = ${fmt1(msd(GOOD, cv))}`, { size: 38, fill: P.brassSoft });
    // 오른쪽 그래프
    o += panel(1230, 150, 640, 760, '그래프');
    const gx = (v) => 1310 + (v - 117) * 85, gy = (m) => 820 - m * 40;
    o += L(1300, 820, 1840, 820, { stroke: P.ink, 'stroke-width': 4 }) + L(1310, 830, 1310, 230, { stroke: P.ink, 'stroke-width': 4 });
    for (let v = 117; v <= 123; v++) o += T(gx(v), 860, String(v), { 'font-size': 20, fill: P.muted }) + L(gx(v), 814, gx(v), 826, { stroke: P.ink, 'stroke-width': 3 });
    o += T(1575, 896, '예측값', { 'font-size': 22, fill: P.muted }) + T(1330, 214, '오차 제곱의 평균', { 'font-size': 22, fill: P.muted, 'text-anchor': 'start' });
    for (let m = 0; m <= 14; m += 2) o += T(1290, gy(m) + 7, String(m), { 'font-size': 18, fill: P.muted, 'text-anchor': 'end' });
    if ((c.curve || 0) > 0) {
      let d = '';
      const end = lerp(117.3, 122.7, c.curve);
      for (let v = 117.3; v <= end + 1e-6; v += .05) d += `${d ? 'L' : 'M'}${f1(gx(v))} ${f1(gy(msd(GOOD, v)))} `;
      o += Pth(d, { fill: 'none', stroke: P.coral, 'stroke-width': 5, 'stroke-dasharray': '2 10', 'stroke-linecap': 'round' });
    }
    // 지나온 정수 예측값의 점(2번째 대사부터 기록)
    const seen = [];
    if (c.lo !== undefined) for (let v = 118; v <= 122; v++) if (v >= c.lo - 1e-6 && v <= c.hi + 1e-6) seen.push(v);
    seen.forEach((v) => { o += Cc(gx(v), gy(msd(GOOD, v)), 11, { fill: P.coral, ...OL(3) }) + T(gx(v), gy(msd(GOOD, v)) - 22, fmt1(msd(GOOD, v)), { 'font-size': 22, fill: P.coralInk }); });
    o += Cc(gx(cv), gy(msd(GOOD, cv)), 16, { fill: 'none', stroke: P.brassInk, 'stroke-width': 5 });
    if ((c.star || 0) > 0) o += G(pill(gx(120), gy(5.2) + 70, '바닥 = 평균 120', { size: 26, fill: P.brass, color: '#fff' }), { o: c.star });
    if ((c.note || 0) > 0) o += G(pill(740, 890, '평균 = 가장 덜 틀리는 예측값', { size: 30, fill: P.tealSoft, color: P.tealInk }), { o: c.note });
    return o;
  };

  DRAW[8] = (s, V) => {
    const c = s.c8;
    let o = '';
    const dim = 1 - (c.teaser || 0);
    if ((c.card || 0) > 0) {
      let k = panel(380, 160, 1120, 680, '오늘의 노트');
      const items = [['①', '오차 = 실제값 − 예측값'], ['②', '그냥 더하면 지워진다 → 제곱한다'], ['③', '잰 횟수와 상관없게 → 평균을 낸다']];
      items.forEach(([n, t], i) => {
        const p = (c.items || [])[i] || 0;
        k += G(Cc(470, 280 + i * 120, 30, { fill: P.brass, ...OL(3) }) + T(470, 292 + i * 120, n, { 'font-size': 30, fill: '#fff' }) + T(530, 294 + i * 120, t, { 'font-size': 40, 'text-anchor': 'start' }), { o: p, tx: (1 - p) * 30 });
      });
      if ((c.banner || 0) > 0) k += G(R(440, 640, 1000, 140, { rx: 30, fill: P.brassSoft, ...OL(4) }) + T(940, 692, '좋은 예측이란', { 'font-size': 30, fill: P.brassInk }) + T(940, 750, '오차 제곱의 평균이 작은 예측', { 'font-size': 48 }), { o: c.banner, k: 1 });
      o += G(k, { o: c.card * dim });
    }
    if ((c.teaser || 0) > 0) {
      const wn = c.wn || 1, nW = Math.floor(wn + 1e-6);
      o += springRig({ cx: 1680, top: 200, h: 600, len: 130 + (wn - 1) * 90, weights: nW, tag: '', o: c.teaser, V });
      o += G(pill(940, 480, '다음 편 · 움직이는 예측선', { size: 52, fill: P.teal, color: '#fff' }), { o: c.teaser, k: .8 + .2 * backOut(c.teaser) });
    }
    if ((c.next || 0) > 0) o += G(T(940, 580, '2편에서 계속', { 'font-size': 34, fill: P.muted }), { o: c.next });
    return o;
  };

  /* ---------- 그리기 ---------- */
  const art = $('art');
  const setChip = chips($('chips'), CHAPS);
  const renderTag = chapTag($('chapTag'));
  function draw(s, V, talking) {
    setChip(s.chap);
    let out = '';
    const cur = s.chap >= 0 ? DRAW[KEY[s.chap]] : DRAW[-1];
    const prev = s.prevChap >= 0 ? DRAW[KEY[s.prevChap]] : DRAW[-1];
    if (s.chap >= 0 && s.fadeIn < 1 && prev) out += G(prev(s, V), { o: 1 - s.fadeIn });
    if (cur) out += G(cur(s, V), { o: s.chap >= 0 ? s.fadeIn : 1 });
    out += gray(s.gray, V, talking);
    art.innerHTML = out;
    renderTag(s);
  }

  root.__SCRIPT = SCRIPT;
  boot({ tl, baseState: base, draw });
})(window);

</script>
