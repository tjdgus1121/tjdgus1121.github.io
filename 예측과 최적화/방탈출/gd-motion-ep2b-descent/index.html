<style>
/* 귀여운 모션 해설 공통 스타일 (조건부확률 모션에서 정리한 것).
 * 무대 1920×1080 · 크림색 점무늬 · 남색 굵은 외곽선 · 오프셋 그림자 스티커 카드 · 나눔스퀘어라운드 */
:root {
  --ink: #3b3355; --muted: #6f6787; --cream: #fff8ec; --line: #e7dfd2; --page: #efe6d8;
  --gray: #d9d3e6; --blue: #5fa2ff; --orange: #ffa560; --purple: #b084f5; --yellow: #ffd966; --pink: #ff8fab; --mint: #7fd6b9;
  --coral: #ff7a59; --sky: #4f8ff0;
  --blue-ink: #2f6fd6; --orange-ink: #c25e10; --purple-ink: #6b3fc4; --coral-ink: #d4472a; --green-ink: #1f8a5c;
  --blue-soft: #e4efff; --orange-soft: #ffeedd; --purple-soft: #f1e8ff; --yellow-soft: #fff4c4; --coral-soft: #ffe6df; --mint-soft: #ddf6ec;
  --font: "NSRound", "NanumSquareRound", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --pop: 0 6px 0 rgba(59, 51, 85, .16);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink); font-family: var(--font);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px;
}

/* ---------- 플레이어 ---------- */
.stage-wrap { position: relative; overflow: hidden; border-radius: 18px; box-shadow: 0 4px 18px rgba(59,51,85,.18); }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; max-width: 1920px; justify-content: center; }
.controls button, .controls select { min-height: 44px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); font: 800 15px var(--font); cursor: pointer; box-shadow: 0 3px 0 rgba(59,51,85,.2); }
.controls button.primary { background: var(--yellow); min-width: 120px; }
.controls :focus-visible { outline: 3px solid var(--blue-ink); outline-offset: 3px; }
.controls .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.controls input[type=range] { flex: 1 1 240px; min-width: 160px; height: 44px; accent-color: var(--purple-ink); }
.controls output { font: 800 15px var(--font); min-width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
/* ---------- 시리즈 편 이동 ---------- */
.series-nav { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; width: 100%; max-width: 1920px; }
.sn-eps { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; list-style: none; margin: 0; padding: 0; }
.sn-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); font: 800 15px var(--font); text-decoration: none; box-shadow: 0 3px 0 rgba(59,51,85,.2); }
a.sn-btn:hover { background: var(--yellow-soft); }
a.sn-btn:focus-visible { outline: 3px solid var(--blue-ink); outline-offset: 3px; }
.sn-btn[aria-disabled] { opacity: .4; box-shadow: none; }
.sn-ep { padding-left: 8px; }
.sn-ep b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 14px; }
.sn-ep[aria-current] { background: var(--yellow); border-width: 3px; }
.sn-act { border-style: dashed; }
.sn-ep em { font-style: normal; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #fff; border: 1.5px solid var(--ink); }
@media (max-width: 760px) {
  .sn-ep .t { display: none; }
  .sn-btn { padding: 0 14px; }
}

<script>
/* 모션 해설 공통 엔진 — 수업 내용과 무관한 부분만 둔다.

 *

 *   tl.chapter('1. 기울기 정하기')      현재 위치에 장 표시(재생기의 장 이동 목록)
 *   tl.beat(4.2, (s, lt) => { … })      지속형: 시작 뒤로 계속 적용되어 상태가 쌓인다(그래프, 패널 내용 등)
 *   tl.scene(8, (s, lt) => { … })       구간형: 그 길이 동안만 적용된다(개념 카드처럼 잠깐 덮는 장면)

  /* ---------- 내레이션(TTS) 시간 ----------
   * window.NARRATION(narration.js, narrate.py 가 생성) = { holds: [[대본시각, 멈출 초], …], lines: [{start, lead, dur}, …] } */
  function narration() {
    const NAR = root.NARRATION || { holds: [], lines: [] };
    const HOLDS = NAR.holds.slice().sort((a, b) => a[0] - b[0]);
    const HOLD_TOTAL = HOLDS.reduce((sum, [, d]) => sum + d, 0);
    const scriptTime = (V) => {
      let acc = 0;
      for (const [at, dur] of HOLDS) {
        const vs = at + acc;
        if (V < vs) break;
        if (V < vs + dur) return at;
        acc += dur;
      }
      return V - acc;
    };
    const videoTime = (S) => S + HOLDS.reduce((acc, [at, dur]) => acc + (at < S ? dur : 0), 0);

  function exportCaptions(tl, baseState) {

      let last = '';
      for (let k = 0; k * .02 <= tl.duration; k++) {
        const t = k * .02, c = tl.stateAt(t, baseState).caption, txt = c ? c.text : '';
        if (txt !== last) { if (txt) out.push({ text: txt, start: Number(t.toFixed(2)) }); last = txt; }
      }
      const still = (t) => { const s = tl.stateAt(t, baseState); s.caption = null; s.talk = 0; return JSON.stringify(s); };
      out.forEach((c, i) => {

  const SERIES = [

    { dir: 'ep2-loss-function', title: '오차와 손실함수' },

  /* <nav id="seriesNav" data-ep="1"> 안에 목록·이전·편 번호·다음 링크를 만든다. 경로는 편 폴더 기준 상대 경로 */
  function seriesNav(nav) {

      : `<li><a class="sn-btn sn-ep" href="${href(i)}" aria-label="${i + 1}편 ${e.title}"><b>${i + 1}</b><span class="t">${e.title}</span></a></li>`)).join('');
    // 마지막 편은 바로 옆의 체험활동 버튼이 다음 단계라서 '다음 편'을 두지 않는다
    const next = SERIES[cur + 1] ? step(cur + 1, 'next', '다음 편') : '';

  }
  const ACTIVITY = '../activity/index.html';

  /* 재생기 시작. draw(s, V, talking) 가 장면을 그린다(자막은 여기서 그린다). */
  function boot({ tl, baseState, draw }) {
    const nav = $('seriesNav');
    seriesNav(nav);
    const N = narration();
    const renderCaption = root.Motion.captionRenderer($('caption'));
    exportCaptions(tl, baseState);
    function render(V) {
      const s = tl.stateAt(N.scriptTime(V), baseState);
      draw(s, V, N.talking(V, s));

    // 재생 속도 고르기(재생 바 앞). 세 편 template 을 고치지 않도록 여기서 만든다
    const scrub = $('scrub'), speed = document.createElement('select');
    speed.id = 'speedSel';
    [[.75, '0.75×'], [1, '1×'], [1.25, '1.25×'], [1.5, '1.5×']].forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; o.selected = v === 1; speed.append(o); });
    const speedLab = document.createElement('label');
    speedLab.className = 'sr'; speedLab.htmlFor = 'speedSel'; speedLab.textContent = '재생 속도';
    const scrubLab = scrub.previousElementSibling && scrub.previousElementSibling.tagName === 'LABEL' ? scrub.previousElementSibling : scrub;
    scrubLab.before(speedLab, speed);

      stage: $('stage'), wrap: $('stageWrap'), duration: tl.duration + N.HOLD_TOTAL,
      chapters: [[0, '시작'], ...tl.chapters.map(([c, label]) => [N.videoTime(c), label])], render,
      controls: { play: $('playBtn'), restart: $('restartBtn'), select: $('chapterSel'), scrub, time: $('timeOut'), speed },
      audio: N.LINES.length && audio && audio.getAttribute('src') ? audio : null,
      reserve: () => 110 + (nav ? nav.offsetHeight + 14 : 0),
    });
    return N;
  }

  root.Kit = {
    C, backOut, popIn, pulse, rand, mix, setA, text, textWidth, tag, setRich, paintVars,
    makeKid, paintKid, placeKid, makeMascot, MASCOT_HOME, makeDeco, STAR,
    say, labels, board, chips, chapTag, narration, exportCaptions, boot,
  };
})(window);

</script>

    b += Pth('M4 -70 Q18 -56 30 -70', { fill: 'none', stroke: P.brassDark, 'stroke-width': 3.5, 'stroke-dasharray': '3 2.5' }) + Cc(31, -72, 5, { fill: P.brass, stroke: P.ink, 'stroke-width': 2 });

    return G(s, `translate(${f1(g.x)} ${f1(g.y)}) scale(${(g.k || 1).toFixed(3)})`, o);
  }

  root.GrayChar = { draw, P, FACES: ['smile', 'happy', 'think', 'puzzled', 'eureka', 'surprised', 'sad'], POSES: Object.keys(POSES) };
})(window);

<script>
/* 「안개 속 바닥 찾기」 — 그레이 박사의 연구 노트 ②-2 (손실함수 그릇 → 안개 → 발밑 기울기 → 학습률 → 수렴 → 경사하강법)

(function (root) {

  /* ---------- 색 (1편과 같은 약속: 실제 점 = 청록, 예측선 = 놋쇠, 오차² = 산호) ---------- */
  const P = {

    brass: '#e2a940', brassSoft: '#fbefd0', brassInk: '#9c6a14',
    coral: '#ec7357', coralSoft: '#fde1d8', coralInk: '#c2472d',
    sky: '#4f8fd6', skySoft: '#deebfb', skyInk: '#2c66b0',
    wood: '#b07a52', woodLight: '#d39f72', woodDark: '#7d5236',
    green: '#3e9b6d', greenSoft: '#d9f0e3', iron: '#5d6a72', ironHi: '#9aa7ae',
    fog: '#dfe5e4', violet: '#7b6fd0', violetSoft: '#e7e3fa', orange: '#e08a2e', orangeSoft: '#fde7cc', jade: '#2f9c8c', jadeSoft: '#d3efea',

  /* 측정 기록 B: 추 x 개, 길이 y cm. 점수는 절편 10 고정, 추 1~5개 다섯 점의 오차 제곱 평균 */

  }
  function check(x, y, s = 1, col = P.green) { return Pth(`M${x - 18 * s} ${y} L${x - 5 * s} ${y + 14 * s} L${x + 20 * s} ${y - 16 * s}`, { fill: 'none', stroke: col, 'stroke-width': 9 * s, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }); }
  function cross(x, y, s = 1, col = P.coralInk) { return Pth(`M${x - 15 * s} ${y - 15 * s} L${x + 15 * s} ${y + 15 * s} M${x + 15 * s} ${y - 15 * s} L${x - 15 * s} ${y + 15 * s}`, { stroke: col, 'stroke-width': 9 * s, 'stroke-linecap': 'round' }); }
  function gear(x, y, r, teeth, rot, col = P.brass, o = 1) {
    let d = '';
    for (let i = 0; i < teeth * 2; i++) {

  function yhat(x, y, size, col = P.ink) {
    return T(x, y, 'y', { 'font-size': size, fill: col, 'font-style': 'italic' }) +
      Pth(`M${f1(x - size * .2)} ${f1(y - size * .78)} L${f1(x + size * .02)} ${f1(y - size * .98)} L${f1(x + size * .24)} ${f1(y - size * .78)}`, { fill: 'none', stroke: col, 'stroke-width': size * .07, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
  }

  function eqLine(x, y, rest, size = 54, col = P.ink, anchor = 'middle') {
    const w = textWidth('y ' + rest, size), x0 = anchor === 'middle' ? x - w / 2 : x;
    return yhat(x0 + size * .28, y, size, col) + T(x0 + size * .62, y, rest, { 'font-size': size, fill: col, 'text-anchor': 'start' });
  }

  function sym(k, x, y, r = 18, col = P.ink) {
    if (k === 'moon') return Pth(`M${f1(x + r * .3)} ${f1(y - r)} A${r} ${r} 0 1 0 ${f1(x + r * .3)} ${f1(y + r)} A${f1(r * .5)} ${r} 0 1 1 ${f1(x + r * .3)} ${f1(y - r)} Z`, { fill: col, ...OL(2.5) });
    if (k === 'sun') return Cc(x, y, r * .9, { fill: '#fff', stroke: col, 'stroke-width': r * .22 }) + Cc(x, y, r * .25, { fill: col });
    let d = '';
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; d += `${i ? 'L' : 'M'}${f1(x + Math.cos(a) * rr)} ${f1(y + Math.sin(a) * rr)} `; }
    return Pth(d + 'Z', { fill: col, ...OL(2.5) });
  }

  const gray = (g, V, talking) => root.GrayChar.draw(g, V, talking);

  /* ---------- 용수철 측정대(1편과 같은 모양) ---------- */
  function springRig({ cx, top, h = 640, len = 160, weights = 1, tag = '', o = 1, k = 1 }) {
    let s = R(-176, h, 352, 38, { rx: 16, fill: P.wood, ...OL(4) });
    s += R(-130, 0, 26, h, { rx: 9, fill: P.brass, ...OL(4) }) + R(104, 0, 26, h, { rx: 9, fill: P.brass, ...OL(4) });
    s += R(-152, -28, 304, 34, { rx: 15, fill: P.brass, ...OL(4) });
    s += R(64, 34, 32, h - 72, { rx: 7, fill: '#fff', ...OL(3) });
    for (let yy = 52; yy < h - 46; yy += 24) s += L(64, yy, (yy - 52) % 96 === 0 ? 88 : 78, yy, { stroke: P.ink, 'stroke-width': 2.5 });
    const n = 14, y1 = 6 + len;
    let d = 'M0 6';
    for (let i = 1; i <= n; i++) d += ` L${i % 2 ? 28 : -28} ${f1(6 + len * (i - .5) / n)}`;
    d += ` L0 ${f1(y1)}`;
    s += Pth(d, { fill: 'none', stroke: P.ink, 'stroke-width': 11, 'stroke-linejoin': 'round' }) + Pth(d, { fill: 'none', stroke: '#e8b850', 'stroke-width': 5.5, 'stroke-linejoin': 'round' });
    s += L(0, y1, 0, y1 + 16, { stroke: P.ink, 'stroke-width': 6 });
    s += L(0, y1, 62, y1, { stroke: P.coralInk, 'stroke-width': 5 }) + Pth(`M62 ${f1(y1)} l-14 -9 l0 18 Z`, { fill: P.coralInk });
    for (let i = 0; i < weights; i++) {
      const wy = y1 + 16 + i * 46;
      s += R(-34, wy, 68, 42, { rx: 12, fill: P.iron, ...OL(4) }) + R(-23, wy + 8, 18, 8, { rx: 4, fill: P.ironHi });
    }
    if (tag) s += pill(108, y1, tag, { size: 26, anchor: 'start', fill: P.coralSoft, color: P.coralInk });
    return G(s, { tx: cx, ty: top, k, o });
  }
  function parcel(x, y, w, h, label, { big = false } = {}) {
    let s = R(x - w / 2, y - h / 2, w, h, { rx: 10, fill: big ? '#c99a63' : '#d8b07c', ...OL(4) });
    s += L(x, y - h / 2, x, y + h / 2, { stroke: P.woodDark, 'stroke-width': 7 }) + L(x - w / 2, y, x + w / 2, y, { stroke: P.woodDark, 'stroke-width': 7 });
    s += R(x - w / 2 + 14, y - h / 2 + 14, w * .36, 34, { rx: 6, fill: '#fffaf0', ...OL(2.5) });
    if (label) s += T(x - w / 2 + 14 + w * .18, y - h / 2 + 40, label, { 'font-size': 22 });
    return s;
  }
  function envelope(x, y, w = 130, h = 84) {
    return R(x - w / 2, y - h / 2, w, h, { rx: 8, fill: '#fffaf0', ...OL(3.5) }) +
      Pth(`M${f1(x - w / 2 + 4)} ${f1(y - h / 2 + 4)} L${f1(x)} ${f1(y + 6)} L${f1(x + w / 2 - 4)} ${f1(y - h / 2 + 4)}`, { fill: 'none', ...OL(3) }) + Cc(x, y + 6, 11, { fill: P.coralInk, ...OL(2.5) });
  }

  /* ---------- 좌표판: 추 개수 x(0~7) · 길이 y(8~26 cm) ---------- */
  const PL = { x0: 300, y0: 140, w: 980, h: 800 };
  const X = (x) => 410 + x * 108, Y = (y) => 836 - (y - 8) * 31.5;
  function plot(title = '측정 기록 B', { xmax = 7 } = {}) {
    let s = panel(PL.x0, PL.y0, PL.w, PL.h, title);
    for (let x = 0; x <= xmax; x++) s += L(X(x), Y(8), X(x), Y(26), { stroke: P.line, 'stroke-width': 2 }) + T(X(x), 880, String(x), { 'font-size': 24, fill: P.muted });
    for (let y = 10; y <= 26; y += 4) s += L(X(0), Y(y), X(xmax), Y(y), { stroke: P.line, 'stroke-width': 2 }) + T(X(0) - 18, Y(y) + 8, String(y), { 'font-size': 22, fill: P.muted, 'text-anchor': 'end' });
    s += L(X(0), Y(8), X(xmax) + 20, Y(8), { stroke: P.ink, 'stroke-width': 4 }) + L(X(0), Y(8), X(0), Y(26) - 10, { stroke: P.ink, 'stroke-width': 4 });
    s += T(X(xmax) + 24, 918, '추 개수 x', { 'font-size': 22, fill: P.muted, 'text-anchor': 'end' }) + T(X(0) + 12, Y(26) + 4, '길이 y (cm)', { 'font-size': 22, fill: P.muted, 'text-anchor': 'start' });
    return s;
  }
  const dot = (x, y, r = 13) => Cc(X(x), Y(y), r, { fill: P.teal, ...OL(3.5) });
  const dots = (n = 6) => XS.slice(0, Math.floor(n)).map((x) => dot(x, YS[x])).join('') + (n % 1 > 0 && n < 6 ? G(dot(XS[Math.floor(n)], YS[Math.floor(n)]), { o: n % 1 }) : '');
  function predLine(a, b = 10, { col = P.brass, w = 7, x1 = 5, x0 = 0, dash } = {}) {
    return L(X(x0), Y(a * x0 + b), X(x1), Y(a * x1 + b), { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-dasharray': dash });
  }
  /* 점마다 오차(세로)와 그 오차를 한 변으로 하는 정사각형(직선 쪽으로 붙임) */
  function squares(a, col, p = 1, arrows = true) {
    let s = '';
    [1, 2, 3, 4, 5].forEach((x, i) => {
      const q = clamp(p * 5 - i);
      if (q <= 0) return;
      const yh = a * x + 10, y = YS[x], side = Math.abs(y - yh) * 31.5 * q;
      if (side > 1) s += R(X(x), Math.min(Y(y), Y(yh)), side, Math.abs(Y(y) - Y(yh)) * q, { fill: P.coralSoft, opacity: .85, stroke: P.coralInk, 'stroke-width': 2.5 });
      if (arrows) s += L(X(x), Y(yh), X(x), Y(y), { stroke: P.coralInk, 'stroke-width': 5, 'stroke-linecap': 'round', opacity: q });
    });
    return s;
  }

  /* ---------- 손실 그래프: 기울기 a(0~4) · 손실 L(0~14) ---------- */
  function lossAxes(m, { x0, y0, w, h, title = '손실함수', ticks = true }) {
    let s = panel(x0, y0, w, h, title);
    s += L(m.X(0), m.Y(0), m.X(4) + 16, m.Y(0), { stroke: P.ink, 'stroke-width': 4 }) + L(m.X(0), m.Y(0), m.X(0), m.Y(14) - 10, { stroke: P.ink, 'stroke-width': 4 });
    if (ticks) for (let a = 0; a <= 4; a++) s += L(m.X(a), m.Y(0) - 8, m.X(a), m.Y(0) + 8, { stroke: P.ink, 'stroke-width': 3 }) + T(m.X(a), m.Y(0) + 38, String(a), { 'font-size': 22, fill: P.muted });
    s += T(m.X(4) + 10, m.Y(0) + 70, '기울기 a', { 'font-size': 22, fill: P.muted, 'text-anchor': 'end' }) + T(m.X(0) + 12, m.Y(14) + 2, '손실 L(a)', { 'font-size': 22, fill: P.muted, 'text-anchor': 'start' });
    return s;
  }
  function bowl(m, p = 1, { col = P.coral, w = 5, dash = '2 10' } = {}) {
    if (p <= 0) return '';
    let d = '';
    const lo = 2 - 1.116, hi = lo + 2.232 * p;
    for (let a = lo; a <= hi + 1e-6; a += .02) d += `${d ? 'L' : 'M'}${f1(m.X(a))} ${f1(m.Y(loss(a)))} `;
    return Pth(d, { fill: 'none', stroke: col, 'stroke-width': w, 'stroke-dasharray': dash, 'stroke-linecap': 'round' });
  }
  const ball = (m, a, r = 17) => { const v = loss(a), y = v > 14 ? m.Y(14) : m.Y(v); return Cc(m.X(clamp(a, -.3, 4.3)), y, r, { fill: P.coral, stroke: '#fff', 'stroke-width': 4 }) + (v > 14 ? arrow(m.X(clamp(a, -.3, 4.3)), y - 24, m.X(clamp(a, -.3, 4.3)), y - 70, P.coralInk, 6) : ''); };
  function tangent(m, a, len = .5, col = P.green) {
    const v = loss(a), k = dL(a), sx = m.X(1) - m.X(0), sy = m.Y(0) - m.Y(1);
    const half = (len * 400) / Math.hypot(sx, sy * k);   // len .5 ≈ 화면 400px
    return L(m.X(a - half), m.Y(v - k * half), m.X(a + half), m.Y(v + k * half), { stroke: col, 'stroke-width': 7, 'stroke-linecap': 'round' });
  }
  const MS = { X: (a) => 1400 + a * 112, Y: (v) => 830 - v * 40 };                 // 오른쪽 작은 그래프(6장)
  const MB = { X: (a) => 450 + a * 330, Y: (v) => 830 - v * 40 };                  // 가운데 큰 그래프(7~8장)
  const MR = { X: (a) => 420 + a * 205, Y: (v) => 830 - v * 40 };                  // 왼쪽 그래프 + 표(9~10장)

  /* 안개: 지금 자리(a) 둘레만 보이고 나머지는 흐리게 */
  function fog(m, a, o, area, rad = 150) {
    if (o <= 0) return '';
    const v = loss(a), cx = m.X(a), cy = m.Y(Math.min(v, 14));
    return `<defs><radialGradient id="fogHole" cx="${f1(cx)}" cy="${f1(cy)}" r="${rad * 1.6}" gradientUnits="userSpaceOnUse"><stop offset="0.45" stop-color="black"/><stop offset="1" stop-color="white"/></radialGradient><mask id="fogMask"><rect x="0" y="0" width="1920" height="1080" fill="url(#fogHole)"/></mask></defs>` +
      R(area.x0 + 3, area.y0 + 3, area.w - 6, area.h - 6, { rx: 24, fill: P.fog, opacity: (o * .96).toFixed(3), mask: 'url(#fogMask)' });
  }

  /* ---------- 타임라인 ---------- */
  const CHAPS = ['지난 이야기', '안개 낀 그릇', '발밑 기울기', '걸음 크기', '바닥에 닿다', '정리'];
  /* 장 번호 → 그림 함수(그림·상태 이름은 2편 원본 번호 6~10을 그대로 쓴다) */
  const KEY = ['recap', 6, 7, 8, 9, 10];
  const HOME = { x: 120, y: 1066, k: .9 };
  const tl = timeline();
  const SCRIPT = [];
  let curChap = -1, firstOfChap = false;
  function chapter(i) { curChap = i; firstOfChap = true; tl.chapter(`${i + 1}. ${CHAPS[i]}`); }
  /* 대사 한 줄. opt: face, pose, at({x,y,k} 로 걸어감), min(최소 길이) */
  function line(text, opt = {}, fn = null) {
    const ci = curChap, first = firstOfChap;

    tl.beat(dur, (s, lt) => {
      s.chap = ci;

        s.chapTag = { text: `${ci + 1}. ${CHAPS[ci]}`, o: inOut(lt, 2.6, .35, .45) };
      }
      if (opt.face) s.gray.face = opt.face;
      if (opt.pose) s.gray.pose = opt.pose;
      if (opt.at) {
        const p = prog(lt, 0, .9), g = s.gray, fx = g.x, fy = g.y, fk = g.k;
        g.x = lerp(fx, opt.at.x, p); g.y = lerp(fy, opt.at.y, p); g.k = lerp(fk, opt.at.k, p);
      }
      say(s, lt, text, .15);
      if (fn) fn(s, lt, dur);
    });
  }
  function base() {
    const c = {};
    for (let i = 0; i <= 10; i++) c['c' + i] = {};
    c.cr = {}; c.cs = {};
    return { chap: -1, prevChap: -1, fadeIn: 1, gray: { x: 400, y: 990, k: 1.55, face: 'smile', pose: 'idle', o: 1 }, talk: 99, ...c };
  }

  // 여는 화면

  /* 1장. 지난 이야기 */
  chapter(0);

  line('그릇의 바닥에 있는 기울기가 가장 좋은 직선이다. 문제는 그 바닥을 어떻게 찾느냐야.', { face: 'puzzled', pose: 'shrug', min: 6.5 }, (s, lt) => {
    Object.assign(s.cr, { g: 1, pts: 3, curve: 1, bot: prog(lt, .4, .7), q: prog(lt, 3.4, .6) });
  });

  /* 2장. 안개 낀 그릇 */
  chapter(1);
  line('그릇을 다 그려 보면 바닥이 보이겠지. 하지만 점 하나를 계산하는 데도 한참 걸린다.', { face: 'think', pose: 'think', min: 7 }, (s, lt) => {
    Object.assign(s.c6, { slow: clamp((lt - .6) / 5.6) * 4, glass: prog(lt, .3, .5) });
  });
  line('기울기를 0.01씩 바꿔 가며 다 계산하려면, 밤을 몇 번이나 새워야 할지 몰라.', { face: 'sad', pose: 'shrug' }, (s, lt) => {

  line('안개 낀 산에서 길을 찾는 것 같다. 보이는 건 지금 서 있는 발밑뿐.', { face: 'puzzled', pose: 'idle' }, (s, lt) => {
    Object.assign(s.c6, { slow: 4, glass: 1 - prog(lt, 0, .5), nights: 1 - prog(lt, 0, .5), fog: prog(lt, .4, 1.6) });
  });
  line('지금 a는 1, 손실은 11.3이야. 여기서 어느 쪽으로 가야 내려갈까?', { face: 'think', pose: 'think' }, (s, lt) => {

  line('발밑의 기울기를 재 보자. 그릇에 살짝 대 본 직선, 접선의 기울기다.', { face: 'think', pose: 'point' }, (s, lt) => {
    Object.assign(s.c7, { a: 1, tan: prog(lt, .6, .9) });
  });
  line('손실함수를 미분하면 발밑의 기울기는 22a 빼기 44가 된다. a가 1일 때는 −22, 내리막이야.', { face: 'eureka', pose: 'idle', min: 8 }, (s, lt) => {
    Object.assign(s.c7, { a: 1, tan: 1, f: prog(lt, .3, .7), val: prog(lt, 3.6, .7) });

  line('기울기가 음수면 오른쪽으로 갈수록 내려간다. a를 키워야 해.', { face: 'smile', pose: 'point' }, (s, lt) => {

  line('결국 발밑 기울기의 반대쪽으로 가면 된다. 바닥에서는 기울기가 0이 되고.', { face: 'happy', pose: 'point' }, (s, lt) => {
    Object.assign(s.c7, { a: 1.3, tan: 1, f: 1, val: 1, right: 1, pos: 1, rule: prog(lt, .3, .7), flat: prog(lt, 2.8, .8) });
  });

  /* 4장. 한 걸음의 크기 */

  line('새 a는 a 빼기, 학습률 곱하기 발밑 기울기. 학습률은 한 걸음의 비율이야.', { face: 'eureka', pose: 'point' }, (s, lt) => {

  line('바닥은 a가 2인 곳. 손실은 0.3까지 줄었다.', { face: 'happy', pose: 'idle' }, (s, lt) => {
    Object.assign(s.c9, { conv: 1, bottom: prog(lt, .3, .7) });

  line('그래서 내 예측선은 와이 햇은 2x 더하기 10이다. 추 하나에 2센티미터씩, 아무것도 없으면 10센티미터에서 시작한다.', { face: 'smile', pose: 'point', min: 8 }, (s, lt) => {
    Object.assign(s.c9, { swap: prog(lt, 0, .8), ln: prog(lt, .8, 1.2), eq: prog(lt, 2, .7) });

  /* 6장. 정리 */
  chapter(5);
  line('오늘 찾은 것. 그릇 전체를 몰라도, 발밑의 기울기만 알면 내려갈 수 있다.', { face: 'smile', pose: 'idle' }, (s, lt) => {
    Object.assign(s.c10, { card: prog(lt, 0, .6), items: [prog(lt, .8, .6)] });
  });
  line('발밑 기울기의 반대쪽으로, 학습률만큼 한 걸음씩. 바닥에 닿을 때까지 되풀이한다.', { face: 'think', pose: 'think' }, (s, lt) => {
    Object.assign(s.c10, { card: 1, items: [1, prog(lt, .3, .6)] });
  });
  line('학습률이 너무 크면 발산하고, 너무 작으면 느리다. 알맞은 걸음이어야 수렴한다.', { face: 'eureka', pose: 'point' }, (s, lt) => {
    Object.assign(s.c10, { card: 1, items: [1, 1, prog(lt, .3, .6)] });
  });
  line('언젠가 이 손잡이를 기계가 스스로 돌린다면… 그걸 학습이라고 부르게 될지도 모르겠어.', { face: 'happy', pose: 'idle', min: 7.5 }, (s, lt) => {
    Object.assign(s.c10, { card: 1, items: [1, 1, 1], end: prog(lt, 2, 1) });
  });
  tl.beat(3.5, (s, lt) => { s.chap = 5; s.c10 = { card: 1, items: [1, 1, 1], end: 1 }; s.gray.face = 'happy'; s.caption = null; s.outro = prog(lt, .2, 1); });

  /* ---------- 장면 그림 ---------- */
  const DRAW = {};
  DRAW[-1] = (s, V) => {
    const t = s.introT ?? 9;
    let o = gear(1600, 250, 70, 12, V * 12, P.brassSoft) + gear(1730, 360, 44, 9, -V * 19, P.tealSoft) + gear(300, 230, 52, 10, -V * 15, P.tealSoft);
    o += G(pill(1180, 300, '그레이 박사의 연구 노트 · 2-2편', { size: 30, fill: P.tealSoft, color: P.tealInk }), { o: prog(t, .1, .5) });
    const title = '안개 속 바닥 찾기';   // 글자 7개 + 띄어쓰기 3개
    let tx = 1180 - (7 * 118 + 3 * 44) / 2 + 59;
    [...title].forEach((ch, i) => {
      if (ch === ' ') { tx += 44; return; }
      const p = backOut(clamp((t - .4 - i * .1) / .5));
      if (p > 0) o += G(T(0, 0, ch, { 'font-size': 118 }), { tx, ty: 470, k: p });
      tx += 118;
    });
    o += G(T(1180, 570, '손실함수에서, 경사하강법까지', { 'font-size': 42, fill: P.muted }), { o: prog(t, 1.4, .6) });
    o += G(R(780, 640, 800, 110, { rx: 30, fill: '#fff', ...OL(4) }) + T(1180, 708, '그릇의 바닥은 어떻게 찾을까?', { 'font-size': 38 }), { o: prog(t, 2.2, .6) });
    return o;
  };

  DRAW.recap = (s, V) => {
    const c = s.cr, m = MB;
    let o = G(lossAxes(m, { ...AREA_B, title: '지난 이야기 · 손실함수' }), { o: c.g ?? 1 });
    SCROLLS.forEach((x, i) => {
      const p = clamp((c.pts || 0) - i);
      if (p <= 0) return;
      const px = m.X(x.a), py = m.Y(loss(x.a));
      const lf = x.k === 'sun' ? -1 : 1;   // 한낮 라벨은 바닥 화살표와 겹치지 않게 왼쪽에
      o += G(Cc(px, py, 14 * backOut(p), { fill: x.col, ...OL(3) }) + sym(x.k, px + lf * 46, py - 34, 16, x.col) + T(px + lf * 70, py - 24, `${x.name} ${r2(loss(x.a))}`, { 'font-size': 26, 'text-anchor': lf > 0 ? 'start' : 'end', fill: x.col }), { o: p });
    });
    o += bowl(m, c.curve || 0);
    if ((c.bot || 0) > 0) o += G(Cc(m.X(2), m.Y(loss(2)), 20, { fill: 'none', stroke: P.green, 'stroke-width': 6 }) + pill(m.X(2), m.Y(7.5), '바닥 = 가장 좋은 직선', { size: 28, fill: P.greenSoft, color: P.green }) + arrow(m.X(2), m.Y(6.6), m.X(2), m.Y(1.3), P.green, 5), { o: c.bot });
    if ((c.q || 0) > 0) o += G(R(1350, 200, 480, 130, { rx: 28, fill: '#fff', ...OL(4) }) + T(1590, 280, '바닥은 어떻게 찾지?', { 'font-size': 40, fill: P.coralInk }), { o: c.q, k: .85 + .15 * backOut(c.q) });
    return o;
  };

  const AREA_B = { x0: 330, y0: 140, w: 1560, h: 790 };
  DRAW[6] = (s, V) => {
    const c = s.c6, m = MB;
    let o = lossAxes(m, { ...AREA_B, title: '안개 낀 그릇' });
    const n = c.slow || 0, pts = [1.5, 1, 2.8, 1.2];
    // 그릇 전체 모양은 아직 모른다: 안개가 낀 뒤에야(안개에 가려진 채로) 그린다
    if ((c.fog || 0) > 0) o += G(bowl(m, 1, { col: P.coral, w: 4, dash: '2 12' }), { o: c.fog });
    pts.forEach((a, i) => { const p = clamp(n - i); if (p > 0) o += Cc(m.X(a), m.Y(loss(a)), 12 * backOut(p), { fill: P.coral, ...OL(3) }); });
    if ((c.glass || 0) > 0) {
      let hg = R(-46, -80, 92, 14, { rx: 6, fill: P.wood, ...OL(3) }) + R(-46, 66, 92, 14, { rx: 6, fill: P.wood, ...OL(3) });
      hg += Pth('M-36 -66 L36 -66 L6 0 L36 66 L-36 66 L-6 0 Z', { fill: P.skySoft, ...OL(3) });
      const sand = (V * .25) % 1;
      hg += Pth(`M${f1(-30 + sand * 24)} ${f1(-60 + sand * 54)} L${f1(30 - sand * 24)} ${f1(-60 + sand * 54)} L0 -4 Z`, { fill: P.brass }) + Pth(`M-30 60 L30 60 L${f1(sand * 22)} ${f1(60 - sand * 40)} L${f1(-sand * 22)} ${f1(60 - sand * 40)} Z`, { fill: P.brass });
      o += G(hg, { tx: 1700, ty: 320, o: c.glass });
    }
    if ((c.nights || 0) > 0) o += G(R(1300, 470, 520, 150, { rx: 28, fill: '#fff', ...OL(4) }) + T(1560, 530, 'a = 0.00, 0.01, 0.02 …', { 'font-size': 30, fill: P.muted }) + T(1560, 588, '밤을 몇 번이나?', { 'font-size': 40, fill: P.coralInk }), { o: c.nights });
    o += fog(m, 1, c.fog || 0, AREA_B, 150);
    if ((c.fog || 0) > 0) o += ball(m, 1);
    if ((c.here || 0) > 0) o += G(pill(m.X(1) + 10, m.Y(loss(1)) - 70, 'a = 1 · 손실 11.3', { size: 30, fill: '#fff' }), { o: c.here });
    if ((c.ask || 0) > 0) o += G(arrow(m.X(1) - 40, m.Y(loss(1)) + 50, m.X(1) - 170, m.Y(loss(1)) + 50, P.muted, 7) + arrow(m.X(1) + 40, m.Y(loss(1)) + 50, m.X(1) + 170, m.Y(loss(1)) + 50, P.muted, 7) + T(m.X(1), m.Y(loss(1)) + 130, '?', { 'font-size': 64, fill: P.coralInk }), { o: c.ask });
    return o;
  };

  DRAW[7] = (s, V) => {
    const c = s.c7, m = MB, a = c.a ?? 1;
    let o = lossAxes(m, { ...AREA_B, title: '발밑의 기울기' });
    o += bowl(m, 1, { col: P.coral, w: 4, dash: '2 12' });
    if ((c.flat || 0) > 0) o += G(tangent(m, 2, .45, P.green) + pill(m.X(2), m.Y(6.6), '바닥: 기울기 0', { size: 26, fill: P.greenSoft, color: P.green }), { o: c.flat });
    if ((c.pos || 0) > 0) o += G(tangent(m, 2.5, .3, P.skyInk) + Cc(m.X(2.5), m.Y(loss(2.5)), 14, { fill: P.sky, stroke: '#fff', 'stroke-width': 4 }) + pill(m.X(2.5) + 60, m.Y(loss(2.5)) - 70, `발밑 기울기 +${r2(dL(2.5))}`, { size: 26, fill: P.skySoft, color: P.skyInk }) + arrow(m.X(2.5) - 30, m.Y(loss(2.5)) + 60, m.X(2.5) - 150, m.Y(loss(2.5)) + 60, P.skyInk, 7) + T(m.X(2.5) - 90, m.Y(loss(2.5)) + 110, 'a를 줄인다', { 'font-size': 26, fill: P.skyInk }), { o: c.pos });
    o += fog(m, a, 1 - (c.flat || 0) * .7 - (c.pos || 0) * .25, AREA_B, 160 + (c.pos || 0) * 120);
    if ((c.tan || 0) > 0) o += G(tangent(m, a, .28 * c.tan + .02, P.green), {});
    o += ball(m, a);
    if ((c.tan || 0) > 0) o += G(pill(m.X(a) + 40, m.Y(loss(a)) - 74, '발밑 기울기(접선)', { size: 26, fill: P.greenSoft, color: P.green, anchor: 'start' }), { o: c.tan * (1 - (c.val || 0)) });
    if ((c.val || 0) > 0) o += G(pill(m.X(a) + 40, m.Y(loss(a)) - 74, `발밑 기울기 ${sgnN(dL(a))}`, { size: 28, fill: P.greenSoft, color: P.green, anchor: 'start' }), { o: c.val });
    if ((c.f || 0) > 0) o += G(R(1290, 200, 560, 130, { rx: 28, fill: '#fff', ...OL(4) }) + T(1570, 250, '손실함수를 미분하면', { 'font-size': 26, fill: P.muted }) + T(1570, 305, 'L′(a) = 22a − 44', { 'font-size': 44 }), { o: c.f });
    if ((c.right || 0) > 0) o += G(arrow(m.X(1.3) + 30, m.Y(loss(1.3)) + 70, m.X(1.3) + 170, m.Y(loss(1.3)) + 70, P.green, 8) + T(m.X(1.3) + 100, m.Y(loss(1.3)) + 124, 'a를 키운다', { 'font-size': 28, fill: P.green }), { o: c.right * (1 - (c.flat || 0) * .5) });
    if ((c.rule || 0) > 0) o += G(R(1290, 360, 560, 120, { rx: 28, fill: P.brassSoft, ...OL(4) }) + T(1570, 410, '규칙', { 'font-size': 24, fill: P.brassInk }) + T(1570, 458, '발밑 기울기의 반대쪽으로', { 'font-size': 36 }), { o: c.rule, k: .85 + .15 * backOut(c.rule) });
    return o;
  };

  /* 9~10장: 왼쪽 그래프 위에서 공이 학습률만큼 걸어가고, 오른쪽 표에 a 가 쌓인다 */
  const AREA_R = { x0: 300, y0: 140, w: 1000, h: 790 };
  function walkGraph(rate, k, n, { tag = 0, tagText = '' } = {}) {
    const m = MR, seq = run(rate, n), i = Math.floor(k), fr = k - i;
    let o = lossAxes(m, { ...AREA_R, title: rate ? `학습률 ${rate}` : '손실 그릇' });
    o += bowl(m, 1, { col: P.coral, w: 4, dash: '2 12' });
    const path = seq.slice(0, i + 1);
    if (i < n && fr > 0) path.push(lerp(seq[i], seq[i + 1], fr));
    const pt = (a) => `${f1(m.X(clamp(a, -.3, 4.3)))},${f1(loss(a) > 14 ? m.Y(14) : m.Y(loss(a)))}`;
    if (path.length > 1) o += `<polyline points="${path.map(pt).join(' ')}" fill="none" stroke="${P.coralInk}" stroke-width="3" stroke-dasharray="6 6"/>`;
    seq.slice(0, i + 1).forEach((a) => { o += Cc(m.X(clamp(a, -.3, 4.3)), loss(a) > 14 ? m.Y(14) : m.Y(loss(a)), 6, { fill: P.coralInk }); });
    o += ball(m, path[path.length - 1]);
    if (tag > 0) o += G(pill(m.X(2), 230, tagText, { size: 40, fill: tagText === '수렴' ? P.greenSoft : P.coralSoft, color: tagText === '수렴' ? P.green : P.coralInk }), { o: tag, k: .8 + .2 * backOut(tag) });
    // 표
    let t = panel(1330, 330, 550, 600, '걸음마다 a');
    seq.slice(0, Math.min(n, 10) + 1).forEach((a, j) => {
      if (j > i) return;
      const y = 400 + j * 49, far = Math.abs(a) > 9;
      t += T(1400, y, j === 0 ? '출발' : `${j}번`, { 'font-size': 24, fill: P.muted, 'text-anchor': 'start' }) + T(1680, y, far ? '…' : r2(a), { 'font-size': 28, 'text-anchor': 'end', fill: Math.abs(a - 2) < .05 ? P.green : P.ink });
      if (j > 0 && !far) t += T(1850, y, r2(loss(a)), { 'font-size': 22, fill: P.muted, 'text-anchor': 'end' });
    });
    t += T(1850, 372, '손실', { 'font-size': 20, fill: P.muted, 'text-anchor': 'end' });
    o += t;
    return o;
  }
  DRAW[8] = (s, V) => {
    const c = s.c8;
    let o = '';
    if (c.rate) o += walkGraph(c.rate, c.k || 0, c.n || 10, { tag: c.tag || 0, tagText: c.tagText || '' });
    else o += lossAxes(MR, { ...AREA_R, title: '손실 그릇' }) + bowl(MR, 1, { col: P.coral, w: 4, dash: '2 12' }) + ball(MR, 1) + tangent(MR, 1, .25, P.green);
    if ((c.f1 || 0) > 0) {
      let f = R(1330, 150, 550, 160, { rx: 28, fill: '#fff', ...OL(4) });
      f += (c.f2 || 0) > 0 ? G(T(1605, 214, '새 a = a − 학습률 × 발밑 기울기', { 'font-size': 32 }) + T(1605, 270, '학습률 = 한 걸음의 비율', { 'font-size': 26, fill: P.brassInk }), { o: c.f2 }) : '';
      f += (c.f2 || 0) < 1 ? G(T(1605, 214, '방향: 기울기의 반대쪽', { 'font-size': 32 }) + T(1605, 270, '크기: 얼마나?', { 'font-size': 30, fill: P.coralInk }), { o: 1 - (c.f2 || 0) }) : '';
      o += G(f, { o: c.f1 });
    }
    return o;
  };

  DRAW[9] = (s, V) => {
    const c = s.c9;
    let o = '';
    const sw = c.swap || 0;
    if (sw < 1) {
      let g = walkGraph(.04, 10, 10, { tag: c.conv || 0, tagText: '수렴' });
      if ((c.bottom || 0) > 0) g += G(pill(MR.X(2), MR.Y(.3) + 70, 'a = 2 · 손실 0.3', { size: 30, fill: P.greenSoft, color: P.green }), { o: c.bottom });
      o += G(g, { o: 1 - sw });
    }
    if (sw > 0) {
      let g = plot('완성한 예측선') + dots(6);
      if ((c.ln || 0) > 0) g += predLine(2, 10, { x1: 5 * c.ln });
      if ((c.ext || 0) > 0) {
        g += predLine(2, 10, { x0: 5, x1: 5 + 2 * c.ext, dash: '14 12' });
        if (c.ext > .9) g += L(X(7), Y(8), X(7), Y(24), { stroke: P.coralInk, 'stroke-width': 4, 'stroke-dasharray': '8 8' }) + Cc(X(7), Y(24), 14, { fill: P.brass, ...OL(3.5) }) + pill(X(7) - 40, Y(24) - 52, '24 cm', { size: 30, fill: P.coralSoft, color: P.coralInk });
      }
      if ((c.eq || 0) > 0) g += G(R(790, 700, 440, 110, { rx: 28, fill: '#fff', ...OL(4) }) + eqLine(1010, 776, '= 2x + 10', 54), { o: c.eq });
      o += G(g, { o: sw });
      if ((c.plate || 0) > 0) {
        // 눈금판: 추 0~7개 자리에 10~24 cm 눈금
        let p = R(1420, 160, 360, 620, { rx: 26, fill: P.brassSoft, ...OL(5) }) + T(1600, 212, '눈금판', { 'font-size': 32, fill: P.brassInk });
        for (let x = 0; x <= 7; x++) {
          const y = 264 + x * 66, q = clamp(c.plate * 8 - x);
          if (q <= 0) continue;
          p += G(L(1470, y, 1560, y, { stroke: P.ink, 'stroke-width': 5 }) + T(1580, y + 10, `${2 * x + 10} cm`, { 'font-size': 28, 'text-anchor': 'start' }) + T(1740, y + 10, `${x}개`, { 'font-size': 24, fill: P.muted, 'text-anchor': 'end' }), { o: q });
        }
        o += G(p, { o: clamp(c.plate * 3), tx: (1 - clamp(c.plate * 3)) * 60 });
      }
      if ((c.name || 0) > 0) o += G(R(-270, -58, 540, 116, { rx: 34, fill: P.teal, ...OL(4) }) + T(0, 22, '경사하강법', { 'font-size': 60, fill: '#fff' }), { tx: 1600, ty: 868, o: c.name, k: .8 + .2 * backOut(c.name) });
    }
    return o;
  };

  DRAW[10] = (s, V) => {
    const c = s.c10;
    let k = panel(330, 150, 1500, 700, '오늘의 노트');
    const items = [['①', '그릇 전체를 몰라도 발밑 기울기(미분계수)면 충분'], ['②', '새 a = a − 학습률 × 발밑 기울기'], ['③', '너무 크면 발산, 너무 작으면 느림 → 알맞으면 수렴']];
    items.forEach(([n, t], i) => {
      const p = (c.items || [])[i] || 0;
      k += G(Cc(430, 290 + i * 140, 32, { fill: P.brass, ...OL(3) }) + T(430, 302 + i * 140, n, { 'font-size': 32, fill: '#fff' }) + T(490, 304 + i * 140, t, { 'font-size': 42, 'text-anchor': 'start' }), { o: p, tx: (1 - p) * 30 });
    });
    if ((c.end || 0) > 0) k += G(R(480, 690, 1200, 120, { rx: 30, fill: P.tealSoft, ...OL(4) }) + T(1080, 764, '손잡이를 기계가 스스로 돌린다면 → 학습', { 'font-size': 44, fill: P.tealInk }), { o: c.end });
    let o = G(k, { o: c.card || 0 });
    if ((s.outro || 0) > 0) o += G(gear(1720, 200, 60, 12, V * 14, P.brassSoft) + gear(1820, 300, 38, 9, -V * 22, P.tealSoft), { o: s.outro });
    return o;
  };

  /* ---------- 그리기 ---------- */
  const art = $('art');
  const setChip = chips($('chips'), CHAPS);
  const renderTag = chapTag($('chapTag'));
  function draw(s, V, talking) {
    setChip(s.chap);
    let out = '';
    const cur = s.chap >= 0 ? DRAW[KEY[s.chap]] : DRAW[-1];
    const prev = s.prevChap >= 0 ? DRAW[KEY[s.prevChap]] : DRAW[-1];
    if (s.chap >= 0 && s.fadeIn < 1 && prev) out += G(prev(s, V), { o: 1 - s.fadeIn });
    if (cur) out += G(cur(s, V), { o: s.chap >= 0 ? s.fadeIn : 1 });
    out += gray(s.gray, V, talking);
    art.innerHTML = out;
    renderTag(s);
  }

  root.__SCRIPT = SCRIPT;
  boot({ tl, baseState: base, draw });
})(window);

</script>
</body>
</html>
