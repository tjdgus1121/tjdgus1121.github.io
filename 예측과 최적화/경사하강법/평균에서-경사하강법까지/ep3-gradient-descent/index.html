<style>
/* 귀여운 모션 해설 공통 스타일 (조건부확률 모션에서 정리한 것).
 * 무대 1920×1080 · 크림색 점무늬 · 남색 굵은 외곽선 · 오프셋 그림자 스티커 카드 · 나눔스퀘어라운드 */
:root {
  --ink: #3b3355; --muted: #6f6787; --cream: #fff8ec; --line: #e7dfd2; --page: #efe6d8;
  --gray: #d9d3e6; --blue: #5fa2ff; --orange: #ffa560; --purple: #b084f5; --yellow: #ffd966; --pink: #ff8fab; --mint: #7fd6b9;
  --coral: #ff7a59; --sky: #4f8ff0;
  --blue-ink: #2f6fd6; --orange-ink: #c25e10; --purple-ink: #6b3fc4; --coral-ink: #d4472a; --green-ink: #1f8a5c;
  --blue-soft: #e4efff; --orange-soft: #ffeedd; --purple-soft: #f1e8ff; --yellow-soft: #fff4c4; --coral-soft: #ffe6df; --mint-soft: #ddf6ec;
  --font: "NSRound", "NanumSquareRound", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --pop: 0 6px 0 rgba(59, 51, 85, .16);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink); font-family: var(--font);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px;
}

/* ---------- 플레이어 ---------- */
.stage-wrap { position: relative; overflow: hidden; border-radius: 18px; box-shadow: 0 4px 18px rgba(59,51,85,.18); }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; max-width: 1920px; justify-content: center; }
.controls button, .controls select { min-height: 44px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); font: 800 15px var(--font); cursor: pointer; box-shadow: 0 3px 0 rgba(59,51,85,.2); }
.controls button.primary { background: var(--yellow); min-width: 120px; }
.controls :focus-visible { outline: 3px solid var(--blue-ink); outline-offset: 3px; }
.controls .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.controls input[type=range] { flex: 1 1 240px; min-width: 160px; height: 44px; accent-color: var(--purple-ink); }
.controls output { font: 800 15px var(--font); min-width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
/* ---------- 시리즈 편 이동 ---------- */
.series-nav { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; width: 100%; max-width: 1920px; }
.sn-eps { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; list-style: none; margin: 0; padding: 0; }
.sn-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); font: 800 15px var(--font); text-decoration: none; box-shadow: 0 3px 0 rgba(59,51,85,.2); }
a.sn-btn:hover { background: var(--yellow-soft); }
a.sn-btn:focus-visible { outline: 3px solid var(--blue-ink); outline-offset: 3px; }
.sn-btn[aria-disabled] { opacity: .4; box-shadow: none; }
.sn-ep { padding-left: 8px; }
.sn-ep b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 14px; }
.sn-ep[aria-current] { background: var(--yellow); border-width: 3px; }
.sn-act { border-style: dashed; }
.sn-ep em { font-style: normal; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #fff; border: 1.5px solid var(--ink); }
@media (max-width: 760px) {
  .sn-ep .t { display: none; }
  .sn-btn { padding: 0 14px; }
}
body.render { padding: 0; display: block; }
body.render .controls, body.render .series-nav { display: none; }
body.render .stage-wrap { box-shadow: none; border-radius: 0; }

.stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
  background-color: var(--cream);
  background-image: radial-gradient(rgba(59,51,85,.09) 2px, transparent 2.5px);
  background-size: 34px 34px;
}

/* ---------- 머리줄 ---------- */
.head { position: absolute; left: 0; right: 0; top: 0; height: 92px; display: flex; align-items: center; gap: 26px; padding: 0 36px; background: #fff; border-bottom: 3px solid var(--ink); z-index: 10; }
.head .brand { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.head .brand strong { font-size: 30px; font-weight: 800; letter-spacing: -.5px; background: linear-gradient(transparent 60%, var(--yellow) 60%); padding: 0 4px; }
.head .brand span { font-size: 19px; color: var(--muted); font-weight: 700; }
.chips { margin-left: auto; display: flex; gap: 8px; }
.chips span { padding: 8px 14px; border-radius: 999px; border: 2px solid transparent; background: #f4efe6; color: var(--muted); font-size: 17px; font-weight: 800; white-space: nowrap; }
.chips span.done { color: var(--ink); background: #fff; border-color: var(--line); }
.chips span.on { background: var(--yellow); border-color: var(--ink); color: var(--ink); box-shadow: 0 3px 0 rgba(59,51,85,.25); }

/* ---------- 그림 층 ---------- */
#deco, #art, #mascot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
#mascot { z-index: 40; pointer-events: none; }
.svg-text { font-family: var(--font); font-weight: 800; }
.chap-tag {
  position: absolute; left: 44px; top: 106px; z-index: 8; padding: 10px 22px; border-radius: 16px;
  background: var(--yellow); border: 3px solid var(--ink); box-shadow: var(--pop);
  font-size: 26px; font-weight: 800; opacity: 0; transform-origin: 0 50%; white-space: nowrap;
}

/* 위치를 지정하는 글자(수식) 층 */
.labs { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.lab { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; opacity: 0; font-weight: 800; color: var(--ink); }
.lab .katex { font-size: 1em; }
.lab.pill { padding: 6px 18px; border-radius: 999px; background: #fff; border: 3px solid var(--ink); font-size: 24px; box-shadow: 0 4px 0 rgba(59,51,85,.15); }
.lab.pill.a, .lab.pill.orange { background: var(--orange-soft); color: var(--orange-ink); }
.lab.pill.b, .lab.pill.blue { background: var(--blue-soft); color: var(--blue-ink); }
.lab.pill.ab, .lab.pill.purple { background: var(--purple-soft); color: var(--purple-ink); }
.lab.pill.coral { background: var(--coral-soft); color: var(--coral-ink); }
.lab.pill.mint { background: var(--mint-soft); color: var(--green-ink); }
.lab.pill.yellow { background: var(--yellow-soft); }
.lab.tx { font-size: 30px; padding: 4px 12px; border-radius: 14px; background: #fff; border: 2.5px solid var(--ink); box-shadow: 0 4px 0 rgba(59,51,85,.12); }
.lab.tx.sm { font-size: 26px; }
.lab.plain { font-size: 26px; }
.lab.dv { font-size: 50px; padding: 14px 24px; border-radius: 22px; }
.lab.dv.num { font-size: 42px; color: var(--muted); }
.lab.dv.box { background: var(--yellow-soft); border: 3px solid var(--ink); box-shadow: var(--pop); }
.lab.step { font-size: 22px; color: var(--ink); padding: 6px 16px; border-radius: 999px; background: #fff; border: 2px dashed #b9afcc; }

/* ---------- 오른쪽 공식 판 ---------- */
.board { position: absolute; left: 1296px; top: 122px; width: 584px; height: 812px; padding: 30px 30px; background: #fff; border: 3px solid var(--ink); border-radius: 30px; box-shadow: 0 8px 0 rgba(59,51,85,.14); display: flex; flex-direction: column; gap: 18px; z-index: 6; overflow: hidden; }
.board .kicker { align-self: flex-start; padding: 6px 16px; border-radius: 12px; background: var(--yellow); border: 2.5px solid var(--ink); font-size: 20px; font-weight: 800; transform: rotate(-2deg); }
.board .item { opacity: 0; }
.board p { margin: 0; font-size: 25px; line-height: 1.5; font-weight: 700; }
.board p.note { font-size: 21px; color: var(--ink); padding: 12px 16px; border-radius: 16px; background: #f6f1e8; font-weight: 700; }
.board .tex { font-size: 30px; padding: 14px 16px; border-radius: 20px; background: #f7f3ff; text-align: center; }
.board .tex.big { font-size: 32px; }
.board .tex.box { background: var(--yellow-soft); border: 3px solid var(--ink); box-shadow: 0 5px 0 rgba(59,51,85,.14); }
.board b.cA, .board b.orange { color: var(--orange-ink); } .board b.cB, .board b.blue { color: var(--blue-ink); }
.board b.cAB, .board b.purple { color: var(--purple-ink); } .board b.coral { color: var(--coral-ink); } .board b.green { color: var(--green-ink); }
.board table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 22px; font-weight: 800; text-align: center; border: 2.5px solid var(--ink); border-radius: 16px; overflow: hidden; }
.board th, .board td { padding: 8px 6px; border-bottom: 2px solid #eee6da; }
.board th { background: #f6f1e8; font-size: 19px; }
.board tr:last-child td { border-bottom: 0; }
.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 14px; font-size: 23px; font-weight: 800; }
.track { position: relative; height: 40px; border-radius: 999px; background: #f4efe6; border: 2.5px solid var(--ink); overflow: visible; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; }
.track em { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 20px; font-weight: 800; }

/* ---------- 여는 화면 · 정리 ---------- */
.intro, .summary { position: absolute; inset: 0; z-index: 30; opacity: 0;
  background-color: var(--cream); background-image: radial-gradient(rgba(59,51,85,.09) 2px, transparent 2.5px); background-size: 34px 34px; }
.intro .kick { position: absolute; left: 820px; top: 250px; font-size: 28px; font-weight: 800; color: var(--purple-ink); padding: 6px 18px; border-radius: 999px; background: var(--purple-soft); border: 2.5px solid var(--ink); }
.intro h1 { position: absolute; left: 812px; top: 300px; margin: 0; font-size: 120px; font-weight: 800; letter-spacing: -2px; display: flex; }
.intro h1 span { display: inline-block; transform-origin: 50% 90%; white-space: pre; }
.intro .sub { position: absolute; left: 826px; top: 470px; font-size: 38px; font-weight: 800; color: var(--muted); }
.intro .q { position: absolute; left: 820px; top: 580px; padding: 26px 40px; border-radius: 30px; background: #fff; border: 4px solid var(--ink); box-shadow: 0 8px 0 rgba(59,51,85,.16); font-size: 40px; font-weight: 800; }
.intro svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
.summary { top: 95px; padding: 36px 70px 120px; display: grid; grid-template-rows: auto auto auto; align-content: start; gap: 28px; }
.summary h2 { margin: 0; font-size: 46px; font-weight: 800; letter-spacing: -1px; }
.summary h2 mark { background: linear-gradient(transparent 58%, var(--yellow) 58%); color: inherit; padding: 0 4px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
.tile { background: #fff; border: 3px solid var(--ink); border-radius: 26px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; box-shadow: 0 7px 0 rgba(59,51,85,.14); }
.tile h3 { margin: 0; font-size: 26px; font-weight: 800; padding: 4px 16px; border-radius: 999px; background: var(--yellow); border: 2.5px solid var(--ink); }
.tile p { margin: 0; font-size: 21px; color: var(--muted); line-height: 1.45; font-weight: 700; }
.tile .big { font-size: 32px; }
.formulas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.formulas div { padding: 18px; border-radius: 24px; background: #fff; border: 3px solid var(--ink); text-align: center; font-size: 32px; box-shadow: 0 6px 0 rgba(59,51,85,.14); }
.formulas div small { display: block; margin-bottom: 8px; font-size: 20px; font-weight: 800; color: var(--muted); }
.formulas div.key { background: var(--yellow-soft); }

/* ---------- 말풍선 자막 ---------- */
.caption { position: absolute; left: 196px; right: 30px; top: 952px; height: 108px; display: flex; align-items: center; z-index: 35; }
.caption span { position: relative; max-width: 1680px; padding: 16px 32px; border-radius: 28px; background: #fff; border: 3.5px solid var(--ink); box-shadow: 0 6px 0 rgba(59,51,85,.16); color: var(--ink); font-size: 30px; font-weight: 800; line-height: 1.35; }
.caption span::before { content: ""; position: absolute; left: -19px; top: 50%; margin-top: -12px; border: 12px solid transparent; border-right: 18px solid var(--ink); border-left: 0; }
.caption span::after { content: ""; position: absolute; left: -13px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right: 13px solid #fff; border-left: 0; }
.caption span:empty { display: none; }

<nav class="series-nav" id="seriesNav" data-ep="3" aria-label="평균에서 경사하강법까지 편 이동"></nav>
<div class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage" role="img" aria-label="이차함수 손실함수로 경사하강법의 원리와 식을 유도하는 모션 해설">
    <svg id="deco" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
    <header class="head">
      <div class="brand"><strong>경사하강법</strong><span>평균에서 경사하강법까지 ③ · 기울기만 보고 가장 낮은 곳으로</span></div>
      <nav class="chips" id="chips"></nav>
    </header>

    <svg id="art" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
    <div class="labs" id="labs"></div>
    <div class="chap-tag" id="chapTag"></div>
    <section class="board" id="board"></section>

    <section class="intro" id="intro">
      <svg id="introArt" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <div class="series">평균에서 경사하강법까지 · 3편</div>
      <div class="kick">모션으로 이해하는 AI 수학</div>
      <h1 id="introTitle"><span>경</span><span>사</span><span>하</span><span>강</span><span>법</span></h1>
      <div class="sub">이차함수로 식까지 유도하기</div>
      <div class="q" id="introQ">공식 없이 <span class="em">가장 낮은 곳</span>을 찾으려면?</div>
    </section>

    <section class="summary" id="summary">
      <h2>한눈에 정리 · <mark>기울기의 반대 방향으로, 학습률만큼</mark></h2>
      <div class="tiles">
        <div class="tile" data-row="0" data-tilt="-1.2">
          <h3>꼭짓점</h3>
          <svg width="250" height="120" viewBox="0 0 250 120" id="sumV"></svg>
          <div class="big" data-tex="13({\pa}-2)^2+1"></div>
          <p>식이 간단하면<br>완전제곱식으로 바로</p>
        </div>
        <div class="tile" data-row="1" data-tilt="1">
          <h3>방향</h3>
          <svg width="250" height="120" viewBox="0 0 250 120" id="sumD"></svg>
          <div class="big" data-tex="-L'({\pa})"></div>
          <p>기울기가 음수면 오른쪽,<br>양수면 왼쪽</p>
        </div>
        <div class="tile" data-row="2" data-tilt="-.8">
          <h3>한 걸음</h3>
          <svg width="250" height="120" viewBox="0 0 250 120" id="sumS"></svg>
          <div class="big" data-tex="{\pa}\leftarrow {\pa}-{\pal} L'({\pa})"></div>
          <p>멀면 성큼, 가까우면 조금<br>(기울기에 비례)</p>
        </div>
        <div class="tile" data-row="3" data-tilt="1.3">
          <h3>학습률</h3>
          <svg width="250" height="120" viewBox="0 0 250 120" id="sumA"></svg>
          <div class="big" data-tex="0<{\pal}<\tfrac{1}{13}"></div>
          <p>너무 크면 지나쳐서<br>멀어져요</p>
        </div>

    ink: '#3b3355', muted: '#6f6787', gray: '#d9d3e6', blue: '#5fa2ff', orange: '#ffa560', purple: '#b084f5', yellow: '#ffd966',
    pink: '#ff8fab', mint: '#7fd6b9', coral: '#ff7a59', sky: '#4f8ff0', gold: '#ffcf4d',
    cream: '#fff8ec', blueInk: '#2f6fd6', orangeInk: '#c25e10', purpleInk: '#6b3fc4', coralInk: '#d4472a', greenInk: '#1f8a5c',
    blueSoft: '#e4efff', orangeSoft: '#ffeedd', purpleSoft: '#f1e8ff', graySoft: '#f1edf6', yellowSoft: '#fff4c4', coralSoft: '#ffe6df', mintSoft: '#ddf6ec',
  };
  /* 핵심 기호 색 — 수식(TeX)에서 이름으로만 쓰고 색은 여기 한곳에서 정한다.
   *  \pa : 기울기 a(예측 직선의 기울기, 그래프의 직선과 같은 산호색)
   *  \pal: 학습률 α(보라)
   * 예) 'L(\\pa)=13\\pa^2-52\\pa+53', 'a_{new}=\\pa-\\pal L′(\\pa)' */
  root.TEX_MACROS = {
    '\\pa': `{\\color{${C.coralInk}}\\boldsymbol{a}}`,
    '\\pal': `{\\color{${C.purpleInk}}\\boldsymbol{\\alpha}}`,
  };
  /* 살짝 튀어 오르며 멈추는 곡선 (0→1, 중간에 1을 조금 넘음) */
  const backOut = (x) => { if (x <= 0) return 0; if (x >= 1) return 1; const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
  const popIn = (lt, t0, dur = .5) => backOut(clamp((lt - t0) / dur));
  const pulse = (lt, t0, dur) => Math.sin(Math.PI * clamp((lt - t0) / dur));
  const rand = (seed) => { const v = Math.sin(seed * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
  const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, p) => { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(p))).toString(16).padStart(2, '0')).join(''); };
  const setA = (el, attrs) => { for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); };
  const text = (parent, x, y, str, attrs = {}) => { const t = svg('text', { x, y, class: 'svg-text', ...attrs }, parent); t.textContent = str; return t; };
  const textWidth = (str, size) => [...str].reduce((w, ch) => w + (ch.codePointAt(0) > 0x2000 && !/[가-힣·∩ᶜ²−]/.test(ch) ? size * 1.2 : /[가-힣]/.test(ch) ? size * .9 : /\s/.test(ch) ? size * .28 : size * .55), 0);
  /* ---------- 핵심 기호 색(일반 글자) ----------
   * 수식(TeX)의 \pa·\pal 과 같은 색을 일반 글자에도 쓴다: 홀로 쓰인 a(기울기, 'ax'·'ab'·'13a' 포함)와 α.
   * 영어 낱말 속 a(예: max)는 앞이 알파벳이라 건드리지 않는다. */
  const VAR_RE = /(?<![A-Za-z\\])a(?=[xb]|[^A-Za-z]|$)|α/g;
  const VAR_COL = { a: C.coralInk, 'α': C.purpleInk };
  /* SVG 글자: 기호만 tspan 으로 색을 입힌다 */
  function setRich(t, s) {
    if (t.textContent === s) return;
    VAR_RE.lastIndex = 0;
    if (!VAR_RE.test(s)) { t.textContent = s; return; }
    t.textContent = '';
    let i = 0;
    s.replace(VAR_RE, (m, at) => {
      if (at > i) t.append(document.createTextNode(s.slice(i, at)));
      svg('tspan', { fill: VAR_COL[m], 'font-weight': 900 }, t).textContent = m;
      i = at + m.length;
      return m;
    });
    if (i < s.length) t.append(document.createTextNode(s.slice(i)));
  }
  /* HTML 덩어리: 글자 마디를 돌며 기호를 <b class="pv"> 로 감싼다(KaTeX 수식·이미 감싼 곳은 건너뜀) */
  function paintVars(el) {
    if (!el) return;
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (n.parentElement.closest('.katex, .pv, script, style, svg') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((n) => {
      const s = n.nodeValue;
      VAR_RE.lastIndex = 0;
      if (!VAR_RE.test(s)) return;
      const frag = document.createDocumentFragment();
      let i = 0;
      s.replace(VAR_RE, (m, at) => {
        if (at > i) frag.append(s.slice(i, at));
        const b = document.createElement('b');
        b.className = 'pv';
        b.style.color = VAR_COL[m];
        b.textContent = m;
        frag.append(b);
        i = at + m.length;
        return m;
      });
      if (i < s.length) frag.append(s.slice(i));
      n.replaceWith(frag);
    });
  }

  /* 둥근 이름표(글자 뒤 알약). 반환: { g, rect, text, set(str) } */
  function tag(parent, x, y, str, { size = 24, fill = '#fff', color = C.ink, anchor = 'middle' } = {}) {
    const g = svg('g', {}, parent);
    const h = size + 18;
    const rect = svg('rect', { y: y - h / 2, height: h, rx: h / 2, fill, stroke: C.ink, 'stroke-width': 2.5 }, g);
    const t = text(g, 0, y + size * .36, '', { 'font-size': size, fill: color, 'text-anchor': 'middle' });
    const set = (s) => {
      const w = textWidth(s, size) + 34, x0 = anchor === 'middle' ? x - w / 2 : x;
      setA(rect, { x: x0, width: w });
      t.setAttribute('x', x0 + w / 2);
      setRich(t, s);
    };
    set(str);
    return { g, rect, text: t, set };
  }

  /* ---------- 젤리 친구 ---------- */
  function makeKid(parent) {
    const g = svg('g', {}, parent);
    const shadow = svg('ellipse', { cx: 0, cy: 25, rx: 17, ry: 4, fill: C.ink, opacity: .13 }, g);
    const inner = svg('g', {}, g);
    const body = svg('rect', { x: -21, y: -23, width: 42, height: 46, rx: 19, stroke: C.ink, 'stroke-width': 2.6 }, inner);
    svg('ellipse', { cx: -10, cy: -11, rx: 4, ry: 6.5, fill: '#fff', opacity: .45 }, inner);
    const eyesOpen = svg('g', { fill: C.ink }, inner);
    svg('ellipse', { cx: -7, cy: -4, rx: 2.6, ry: 3.3 }, eyesOpen);
    svg('ellipse', { cx: 7, cy: -4, rx: 2.6, ry: 3.3 }, eyesOpen);
    svg('circle', { cx: -6.2, cy: -5.2, r: .9, fill: '#fff' }, eyesOpen);
    svg('circle', { cx: 7.8, cy: -5.2, r: .9, fill: '#fff' }, eyesOpen);
    const eyesClosed = svg('path', { d: 'M-10 -4 Q-7 -1 -4 -4 M4 -4 Q7 -1 10 -4', stroke: C.ink, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' }, inner);
    svg('ellipse', { cx: -13, cy: 3, rx: 4, ry: 2.5, fill: C.pink, opacity: .8 }, inner);
    svg('ellipse', { cx: 13, cy: 3, rx: 4, ry: 2.5, fill: C.pink, opacity: .8 }, inner);
    const smile = svg('path', { d: 'M-4 4 Q0 8.5 4 4', stroke: C.ink, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' }, inner);
    const worry = svg('ellipse', { cx: 0, cy: 6, rx: 2.3, ry: 2.8, fill: C.ink, opacity: 0 }, inner);
    const happy = svg('path', { d: 'M-5 3 Q0 11 5 3 Z', fill: C.coral, stroke: C.ink, 'stroke-width': 1.8, 'stroke-linejoin': 'round', opacity: 0 }, inner);
    return { g, shadow, inner, body, eyesOpen, eyesClosed, smile, worry, happy };
  }
  /* mood: 'smile' | 'worry' | 'happy'  ·  sleep: 1 이면 눈 감고 천천히 숨쉬기 */
  function paintKid(el, { col, id = 0, t = 0, mood = 'smile', sleep = 0, bob = 1 }) {
    el.body.setAttribute('fill', col);
    const blink = ((t + id * .61) % 3.3) < .12;
    const closed = blink || sleep > .5;
    el.eyesOpen.setAttribute('opacity', closed ? 0 : 1);
    el.eyesClosed.setAttribute('opacity', closed ? 1 : 0);
    el.smile.setAttribute('opacity', mood === 'smile' ? 1 : 0);
    el.worry.setAttribute('opacity', mood === 'worry' ? 1 : 0);
    el.happy.setAttribute('opacity', mood === 'happy' ? 1 : 0);
    const b = sleep > .5 ? Math.sin(t * 1.6 + id) * 1.2 : Math.sin(t * 3.1 + id * 1.7) * 2;
    el.inner.setAttribute('transform', `translate(0 ${(b * bob).toFixed(2)})`);
  }
  function placeKid(el, x, y, sc, o = 1) {
    if (o <= .001 || sc <= .001) { el.g.setAttribute('opacity', 0); return; }
    el.g.setAttribute('opacity', clamp(o).toFixed(3));
    el.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(3)})`);
  }

  /* ---------- 병아리 선생님 ---------- */
  function makeMascot(parent) {
    const g = svg('g', {}, parent);
    svg('ellipse', { cx: 0, cy: 68, rx: 48, ry: 9, fill: C.ink, opacity: .14 }, g);
    const body = svg('g', {}, g);
    const wingL = svg('ellipse', { cx: -56, cy: 14, rx: 15, ry: 24, fill: '#ffc93d', stroke: C.ink, 'stroke-width': 3.5 }, body);
    const wingR = svg('ellipse', { cx: 56, cy: 14, rx: 15, ry: 24, fill: '#ffc93d', stroke: C.ink, 'stroke-width': 3.5 }, body);
    svg('circle', { r: 60, fill: C.yellow, stroke: C.ink, 'stroke-width': 4 }, body);
    svg('ellipse', { cx: 0, cy: 26, rx: 34, ry: 24, fill: '#fff2b8' }, body);
    svg('path', { d: 'M-30 -62 L0 -76 L30 -62 L0 -48 Z', fill: C.ink }, body);
    svg('rect', { x: -15, y: -58, width: 30, height: 12, rx: 3, fill: C.ink }, body);
    svg('path', { d: 'M24 -63 Q34 -50 30 -36', stroke: C.ink, 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, body);
    svg('circle', { cx: 30, cy: -33, r: 5, fill: C.pink, stroke: C.ink, 'stroke-width': 2 }, body);
    const eyes = svg('g', {}, body);
    [-20, 20].forEach((x) => {
      svg('circle', { cx: x, cy: -12, r: 7, fill: C.ink }, eyes);
      svg('circle', { cx: x + 2.4, cy: -14.5, r: 2.4, fill: '#fff' }, eyes);
    });
    const eyesShut = svg('path', { d: 'M-27 -12 Q-20 -6 -13 -12 M13 -12 Q20 -6 27 -12', stroke: C.ink, 'stroke-width': 3.5, fill: 'none', 'stroke-linecap': 'round', opacity: 0 }, body);
    svg('ellipse', { cx: -36, cy: 6, rx: 10, ry: 6.5, fill: C.pink, opacity: .85 }, body);
    svg('ellipse', { cx: 36, cy: 6, rx: 10, ry: 6.5, fill: C.pink, opacity: .85 }, body);
    const beakShut = svg('path', { d: 'M-10 2 Q0 -4 10 2 Q0 14 -10 2 Z', fill: '#ff9f43', stroke: C.ink, 'stroke-width': 2.8, 'stroke-linejoin': 'round' }, body);
    const beakOpen = svg('g', { opacity: 0 }, body);
    svg('path', { d: 'M-11 0 Q0 -6 11 0 Q0 6 -11 0 Z', fill: '#ff9f43', stroke: C.ink, 'stroke-width': 2.8, 'stroke-linejoin': 'round' }, beakOpen);
    svg('path', { d: 'M-9 7 Q0 4 9 7 Q0 20 -9 7 Z', fill: '#ff7a59', stroke: C.ink, 'stroke-width': 2.8, 'stroke-linejoin': 'round' }, beakOpen);
    return {
      render(m, t, talking) {
        const o = m.o === undefined ? 1 : m.o;
        g.setAttribute('opacity', clamp(o));
        const hop = Math.abs(Math.sin(t * 2.2)) * 4;
        g.setAttribute('transform', `translate(${m.x.toFixed(1)} ${(m.y - hop).toFixed(1)}) scale(${(m.k * (.6 + .4 * clamp(o))).toFixed(3)})`);
        beakOpen.setAttribute('opacity', talking ? 1 : 0);
        beakShut.setAttribute('opacity', talking ? 0 : 1);
        const blink = (t % 3.9) < .14;
        eyes.setAttribute('opacity', blink ? 0 : 1);
        eyesShut.setAttribute('opacity', blink ? 1 : 0);
        const wave = m.wave || 0;
        const flap = wave * Math.sin(t * 11) * 28 + (talking ? Math.sin(t * 6) * 6 : 0);
        wingL.setAttribute('transform', `rotate(${(-flap).toFixed(1)} -46 0)`);
        wingR.setAttribute('transform', `rotate(${(flap - wave * 20).toFixed(1)} 46 0)`);
      },
    };
  }
  const MASCOT_HOME = { x: 108, y: 1002, k: .8 };

  /* ---------- 배경 장식 ---------- */
  const STAR = 'M0 -12 L3.5 -4 L12 -3.5 L5.5 2.5 L7.5 11 L0 6.5 L-7.5 11 L-5.5 2.5 L-12 -3.5 L-3.5 -4 Z';
  function makeDeco(parent, list) {
    const items = (list || [
      { x: 58, y: 150, star: 1, c: C.yellow, s: 1.6 }, { x: 1262, y: 128, r: 9, c: C.pink }, { x: 44, y: 640, star: 1, c: C.mint, s: 1.1 },
      { x: 1268, y: 600, star: 1, c: C.blue, s: 1.2 }, { x: 1262, y: 905, r: 11, c: C.yellow }, { x: 36, y: 400, r: 7, c: C.purple },
      { x: 1898, y: 122, star: 1, c: C.pink, s: .9 },
    ]).map((d, i) => {
      const g = svg('g', {}, parent);
      if (d.star) svg('path', { d: STAR, fill: d.c, stroke: C.ink, 'stroke-width': 2, transform: `scale(${d.s})` }, g);
      else svg('circle', { r: d.r, fill: d.c, stroke: C.ink, 'stroke-width': 2 }, g);
      return { ...d, g, i };
    });
    return (t, o = 1) => {
      parent.setAttribute('opacity', o.toFixed(3));
      items.forEach((d) => d.g.setAttribute('transform', `translate(${d.x} ${(d.y + Math.sin(t * 1.1 + d.i * 1.7) * 7).toFixed(1)}) rotate(${(Math.sin(t * .8 + d.i) * 12).toFixed(1)})`));
    };
  }

  /* ---------- 말풍선 자막 ---------- */
  function say(s, lt, str, at = 0) {
    if (lt < at) return;
    s.caption = { text: str, o: clamp((lt - at) / .3) };
    s.talk = lt - at;
  }

  /* ---------- 위치 고정 글자·수식 (s.lab[id] = 0..1, s.labS[id] = 크기 배율) ---------- */
  function labels(container, LABS) {
    container.innerHTML = LABS.map((l) => `<div class="lab ${l.cls || ''}" id="lab-${l.id}" style="left:${l.x}px;top:${l.y}px">${l.tex ? `<span data-tex="${esc(l.tex)}"></span>` : l.html}</div>`).join('');
    renderTexIn(container);
    paintVars(container);
    const els = LABS.map((l) => [l.id, $('lab-' + l.id)]);
    return (s) => els.forEach(([id, el]) => {
      const o = (s.lab && s.lab[id]) || 0;
      el.style.opacity = clamp(o * 1.5);
      if (o > 0) el.style.transform = `translate(-50%, -50%) scale(${((.6 + .4 * backOut(o)) * ((s.labS && s.labS[id]) || 1)).toFixed(3)})`;
    });
  }

  /* ---------- 오른쪽 공식 판 (s.board = { key, items: [0..1] }, s.bars[id] = 0..1) ---------- */
  function board(el, BOARDS) {
    let current = '';
    const itemHTML = (it) => {
      if (it.tex) return `<div class="tex${it.big ? ' big' : ''}${it.box ? ' box' : ''}"${it.fs ? ` style="font-size:${it.fs}px"` : ''} data-tex="${esc(it.tex)}"></div>`;
      if (it.bars) return `<div class="bars">${it.bars.map(([label, val, id, col]) => `<div class="bar-row"><span>${esc(label)}</span><div class="track"><i data-bar="${id}" style="background:${col}"></i><em>${esc(val)}</em></div></div>`).join('')}</div>`;
      return it.html;
    };
    return (s) => {
      if (!s.board) { el.style.opacity = 0; return; }
      el.style.opacity = 1;
      if (s.board.key !== current) {
        current = s.board.key;
        const cfg = BOARDS[current];
        el.innerHTML = `<div class="kicker">${esc(cfg.kicker)}</div>` + cfg.items.map((it) => `<div class="item">${itemHTML(it)}</div>`).join('');
        renderTexIn(el);
        paintVars(el);
      }
      el.querySelectorAll('.item').forEach((node, i) => {
        const o = s.board.items[i] || 0;
        node.style.opacity = clamp(o * 1.4);
        node.style.transform = `scale(${(.85 + .15 * backOut(o)).toFixed(3)})`;
      });
      el.querySelectorAll('[data-bar]').forEach((bar) => {
        const v = ((s.bars && s.bars[bar.dataset.bar]) || 0) * 100;
        bar.style.width = v + '%';
        // 막대가 거의 꽉 차면 글자를 막대 안쪽 끝에 둔다
        const em = bar.nextElementSibling;
        if (v > 72) { em.style.left = 'auto'; em.style.right = `calc(${100 - v}% + 14px)`; } else { em.style.right = 'auto'; em.style.left = `calc(${v}% + 12px)`; }
      });
    };
  }

  function chips(el, names) {
    el.innerHTML = names.map((c, i) => `<span>${i + 1}. ${esc(c)}</span>`).join('');
    const spans = [...el.children];
    return (chap) => spans.forEach((sp, i) => { sp.classList.toggle('on', i === chap); sp.classList.toggle('done', i < chap); });
  }

  function chapTag(el) {
    return (s) => {
      if (s.chapTag && s.chapTag.o > 0) {
        setText(el, s.chapTag.text);
        el.style.opacity = clamp(s.chapTag.o * 1.5);
        el.style.transform = `rotate(-3deg) scale(${(.5 + .5 * s.chapTag.o).toFixed(3)})`;
      } else el.style.opacity = 0;
    };
  }

  /* ---------- 내레이션(TTS) 시간 ----------
   * window.NARRATION(narration.js, narrate.py 가 생성) = { holds: [[대본시각, 멈출 초], …], lines: [{start, lead, dur}, …] } */
  function narration() {
    const NAR = root.NARRATION || { holds: [], lines: [] };
    const HOLDS = NAR.holds.slice().sort((a, b) => a[0] - b[0]);
    const HOLD_TOTAL = HOLDS.reduce((sum, [, d]) => sum + d, 0);
    const scriptTime = (V) => {
      let acc = 0;
      for (const [at, dur] of HOLDS) {
        const vs = at + acc;
        if (V < vs) break;
        if (V < vs + dur) return at;
        acc += dur;
      }
      return V - acc;
    };
    const videoTime = (S) => S + HOLDS.reduce((acc, [at, dur]) => acc + (at < S ? dur : 0), 0);
    const LINES = NAR.lines.map((l) => ({ ...l, v: videoTime(l.start) + (l.lead || 0) }));
    const talking = (V, s) => {
      if (LINES.length) {
        let cur = null;
        for (const l of LINES) { if (l.v <= V) cur = l; else break; }
        const k = cur ? V - cur.v : -1;
        return k >= 0 && k < cur.dur && Math.floor(k * 7) % 2 === 0;
      }
      return s.talk < 2.6 && Math.floor(s.talk * 7) % 2 === 0;
    };
    return { HOLDS, HOLD_TOTAL, scriptTime, videoTime, LINES, talking };
  }

  /* 자막 목록(대본 시각)과 멈춤 후보 — narrate.py 가 render.mjs --captions 로 받아 간다.
   * hold: 그 자막 구간에서 화면이 멈춰 있는(state 가 변하지 않는) 가장 늦은 시각 */
  function exportCaptions(tl, baseState) {
    root.__exportCaptions = () => {
      const out = [];
      let last = '';
      for (let k = 0; k * .02 <= tl.duration; k++) {
        const t = k * .02, c = tl.stateAt(t, baseState).caption, txt = c ? c.text : '';
        if (txt !== last) { if (txt) out.push({ text: txt, start: Number(t.toFixed(2)) }); last = txt; }
      }
      const still = (t) => { const s = tl.stateAt(t, baseState); s.caption = null; s.talk = 0; return JSON.stringify(s); };
      out.forEach((c, i) => {
        const b = (i + 1 < out.length ? out[i + 1].start : tl.duration) - .05;
        c.hold = Number(b.toFixed(2));
        for (let t = b; t >= c.start + .3; t -= .02) {
          if (still(t) === still(t + .04)) { c.hold = Number(t.toFixed(2)); break; }
        }
      });
      return { duration: tl.duration, captions: out };
    };
  }

  /* ---------- 시리즈 편 이동 (무대 밖, 영상에는 찍히지 않는다) ---------- */
  const SERIES = [
    { dir: 'ep1-mean-variance', title: '평균·편차·분산' },
    { dir: 'ep2-loss-function', title: '오차와 손실함수' },
    { dir: 'ep3-gradient-descent', title: '경사하강법' },
  ];
  /* <nav id="seriesNav" data-ep="1"> 안에 목록·이전·편 번호·다음 링크를 만든다. 경로는 편 폴더 기준 상대 경로 */
  function seriesNav(nav) {
    if (!nav) return;
    const cur = Number(nav.dataset.ep) - 1;
    const href = (i) => `../${SERIES[i].dir}/index.html`;
    const step = (i, cls, label) => (SERIES[i]
      ? `<a class="sn-btn ${cls}" href="${href(i)}" aria-label="${label}: ${i + 1}편 ${SERIES[i].title}">${cls === 'prev' ? '← ' : ''}${label}${cls === 'next' ? ' →' : ''}</a>`
      : `<span class="sn-btn ${cls}" aria-disabled="true">${cls === 'prev' ? '← ' : ''}${label}${cls === 'next' ? ' →' : ''}</span>`);
    const eps = SERIES.map((e, i) => (i === cur
      ? `<li><span class="sn-btn sn-ep" aria-current="page"><b>${i + 1}</b><span class="t">${e.title}</span><em>보는 중</em></span></li>`
      : `<li><a class="sn-btn sn-ep" href="${href(i)}" aria-label="${i + 1}편 ${e.title}"><b>${i + 1}</b><span class="t">${e.title}</span></a></li>`)).join('');
    // 마지막 편은 바로 옆의 체험활동 버튼이 다음 단계라서 '다음 편'을 두지 않는다
    const next = SERIES[cur + 1] ? step(cur + 1, 'next', '다음 편') : '';
    nav.innerHTML = `<a class="sn-btn sn-home" href="../index.html">☰ 전체 목록</a>${step(cur - 1, 'prev', '이전 편')}<ol class="sn-eps">${eps}<li><a class="sn-btn sn-act" href="${ACTIVITY}">✎ 체험활동${next ? '' : ' →'}</a></li></ol>${next}`;
  }
  const ACTIVITY = '../activity/index.html';

  /* 재생기 시작. draw(s, V, talking) 가 장면을 그린다(자막은 여기서 그린다). */
  function boot({ tl, baseState, draw }) {
    const nav = $('seriesNav');
    seriesNav(nav);
    const N = narration();
    const renderCaption = root.Motion.captionRenderer($('caption'));
    exportCaptions(tl, baseState);
    function render(V) {
      const s = tl.stateAt(N.scriptTime(V), baseState);
      draw(s, V, N.talking(V, s));
      renderCaption(s);
    }
    const audio = $('narration');
    // 재생 속도 고르기(재생 바 앞). 세 편 template 을 고치지 않도록 여기서 만든다
    const scrub = $('scrub'), speed = document.createElement('select');
    speed.id = 'speedSel';
    [[.75, '0.75×'], [1, '1×'], [1.25, '1.25×'], [1.5, '1.5×']].forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; o.selected = v === 1; speed.append(o); });
    const speedLab = document.createElement('label');
    speedLab.className = 'sr'; speedLab.htmlFor = 'speedSel'; speedLab.textContent = '재생 속도';
    const scrubLab = scrub.previousElementSibling && scrub.previousElementSibling.tagName === 'LABEL' ? scrub.previousElementSibling : scrub;
    scrubLab.before(speedLab, speed);
    root.Motion.player({
      stage: $('stage'), wrap: $('stageWrap'), duration: tl.duration + N.HOLD_TOTAL,
      chapters: [[0, '시작'], ...tl.chapters.map(([c, label]) => [N.videoTime(c), label])], render,
      controls: { play: $('playBtn'), restart: $('restartBtn'), select: $('chapterSel'), scrub, time: $('timeOut'), speed },
      audio: N.LINES.length && audio && audio.getAttribute('src') ? audio : null,
      reserve: () => 110 + (nav ? nav.offsetHeight + 14 : 0),
    });
    return N;
  }

  root.Kit = {
    C, backOut, popIn, pulse, rand, mix, setA, text, textWidth, tag, setRich, paintVars,
    makeKid, paintKid, placeKid, makeMascot, MASCOT_HOME, makeDeco, STAR,
    say, labels, board, chips, chapTag, narration, exportCaptions, boot,
  };
})(window);

</script>

<script>
/* 평균에서 경사하강법까지 ③ — 이차함수로 유도하는 경사하강법.
 * 공통: motion-core.js(window.Motion) + _cute-kit/kit.js(window.Kit).
 * 2편의 손실함수 L(a) = 13a² − 52a + 53 = 13(a − 2)² + 1,  L′(a) = 26a − 52 = 26(a − 2).
 * 경사하강법 a ← a − αL′(a)  ⇒  a_new − 2 = (1 − 26α)(a − 2).  α = 0.02 이면 남은 거리가 매번 0.48배.
 * 학습률 비교: α = 0.01(×0.74) · 0.05(×−0.3) · 0.08(×−1.08, 발산). 조건 0 < α < 1/13. */
(() => {
  'use strict';
  const { clamp, prog, lerp, fade, svg } = window.Motion;
  const K = window.Kit;
  const { C, popIn, pulse, say, tag } = K;
  const $ = (id) => document.getElementById(id);

  /* ---------- 수학 ---------- */
  const L = (a) => 13 * (a - 2) ** 2 + 1;
  const dL = (a) => 26 * (a - 2);
  const GD = (a0, alpha, k) => 2 + (1 - 26 * alpha) ** k * (a0 - 2);
  const fmt = (v, d = 2) => { const r = Number(v.toFixed(d)); return String(Object.is(r, -0) ? 0 : r); };
  const sgn = (v, d = 2) => (v > 0 ? `+${fmt(v, d)}` : v < 0 ? `−${fmt(-v, d)}` : '0');
  const FRIENDS = [
    { x: 2, y: 4, col: '#ff9fb8' }, { x: 2, y: 6, col: '#ffc75a' }, { x: 4, y: 7, col: '#8fd9a8' }, { x: 4, y: 8, col: '#7fb8ff' }, { x: 5, y: 10, col: '#c4a1ff' },
  ];
  const ALPHA = .02, A0 = 1;
  const STEPS = Array.from({ length: 6 }, (_, k) => GD(A0, ALPHA, k));   // a_0 … a_5

  /* ---------- 배치 ---------- */
  const gx = (a) => 140 + a * 260, gy = (Lv) => 870 - Lv * 11;          // 큰 그래프
  const SMALL = { k: .62, tx: -37, ty: 331 };                            // 5장에서 왼쪽 아래로 줄인 그래프
  const sx = (x) => 790 + x * 68, sy = (y) => 860 - y * 44;              // 5장 산점도
  const PANELS = [.01, .05, .08].map((alpha, i) => ({ alpha, x0: 60 + i * 405 }));
  const px = (P, a) => P.x0 + 30 + a * 80, py = (Lv) => 780 - Lv * 9.5;  // 7장 작은 그래프

  /* ---------- 공식 판 ---------- */
  const stepRows = STEPS.slice(0, 5).map((a, k) => `<tr data-row="${k}"><td>${k}</td><td>${fmt(a, 3)}</td><td class="neg">${sgn(dL(a), 2)}</td><td class="hl">${fmt(STEPS[k + 1], 3)}</td></tr>`).join('');
  const BOARDS = {
    vertex: { kicker: '1 · 이차함수의 꼭짓점', items: [
      { tex: 'L({\\pa})=13{\\pa}^2-52{\\pa}+53', big: 1 },
      { tex: '=13({\\pa}-2)^2+1', big: 1, box: 1 },
      { html: '<p class="note">(a − 2)² ≥ 0 → <b>a = 2</b>일 때 가장 작은 값 <b>1</b></p>' },
    ] },
    fog: { kicker: '2 · 공식이 없다면?', items: [
      { html: '<p class="note">실제 AI는 a 같은 값이 <b>수백만 개</b> → 그래프도 꼭짓점 공식도 쓸 수 없어요</p>' },
      { html: '<p class="note">알 수 있는 건 <b>지금 서 있는 곳의 기울기</b>뿐</p>' },
    ] },
    slope: { kicker: '3 · 기울기 = 방향', items: [
      { tex: "L'({\\pa})=26{\\pa}-52", big: 1, box: 1 },
      { html: "<p>a = 1 → L′ = <b class=\"blue\">−26</b> → <b>오른쪽</b>으로</p>" },
      { html: "<p>a = 3 → L′ = <b class=\"coral\">+26</b> → <b>왼쪽</b>으로</p>" },
      { html: '<p class="note">기울기와 <b>반대 방향</b>으로 가면 내려가요</p>' },
    ] },
    rule: { kicker: '4 · 한 걸음의 크기', items: [
      { tex: "\\Delta {\\pa}=-{\\pal}\\,L'({\\pa})", big: 1 },
      { tex: "{\\pa}\\leftarrow {\\pa}-{\\pal}\\,L'({\\pa})", big: 1, box: 1 },
      { html: '<p class="note">α = <b>학습률</b>. 꼭짓점에 가까울수록 기울기 → 0, 걸음도 저절로 작아져요</p>' },
    ] },
    steps: { kicker: '5 · 한 걸음씩 (α = 0.02)', items: [
      { tex: "{\\pa}_{k+1}={\\pa}_k-0.02\\,L'({\\pa}_k)", big: 1 },
      { html: '<p class="note">a = 1에서 출발 → <b>1.52 → 1.77 → 1.89 → 1.95 …</b></p>' },
      { html: '<p class="note">오른쪽 직선 y = ax 도 점점 데이터에 맞춰져요 = <b>학습</b></p>' },
      { html: '<p class="note">언제 멈출까? 기울기 L′(a) ≈ 0 → 걸음 ≈ 0 → <b>멈춤</b></p>' },
    ] },
    why: { kicker: '6 · 왜 꼭짓점으로 갈까?', items: [
      { tex: '{\\pa}_{\\text{new}}-2=(1-26{\\pal})({\\pa}-2)', big: 1, box: 1, fs: 30 },
      { tex: '1-26\\times0.02=0.48', big: 1 },
      { html: '<p class="note">남은 거리가 매번 <b>0.48배</b> → 꼭짓점에 계속 다가가요</p>' },
    ] },
    alpha: { kicker: '7 · 학습률 α', items: [
      { html: '<p>α = 0.01 → <b class="blue">×0.74</b> 천천히</p><p>α = 0.05 → <b class="green">×(−0.3)</b> 지그재그</p><p>α = 0.08 → <b class="coral">×(−1.08)</b> 발산!</p>' },
      { tex: '|1-26{\\pal}|<1\\iff 0<{\\pal}<\\tfrac{1}{13}', big: 1, box: 1, fs: 29 },
      { html: '<p class="note">너무 작으면 느리고, 너무 크면 지나쳐서 멀어져요</p>' },
    ] },
  };

  /* ---------- 위치 고정 글자 ---------- */
  const LABS = [
    { id: 'v1', x: 660, y: 165, cls: 'dv', tex: '13{\\pa}^2-52{\\pa}+53=13({\\pa}^2-4{\\pa})+53' },
    { id: 'v2', x: 660, y: 245, cls: 'dv', tex: '=13({\\pa}-2)^2-52+53' },
    { id: 'v3', x: 660, y: 330, cls: 'dv box', tex: '=13({\\pa}-2)^2+1' },
    { id: 'm1', x: 660, y: 150, cls: 'pill yellow', html: '접선의 기울기 = 그 점에서의 <b>미분계수</b>' },
    { id: 'm2', x: 660, y: 240, cls: 'dv', tex: "\\footnotesize 13{\\pa}^2\\to26{\\pa},\\quad\\;-52{\\pa}\\to-52,\\quad\\;53\\to0" },
    { id: 'm3', x: 660, y: 330, cls: 'dv box', tex: "L'({\\pa})=26{\\pa}-52" },
    { id: 'd1', x: 680, y: 160, cls: 'pill blue', html: '① 방향: 기울기의 반대 → −L′(a)' },
    { id: 'd2', x: 680, y: 228, cls: 'pill purple', html: '② 크기: 학습률 α 를 곱해 조절 → −α L′(a)' },
    { id: 'd3', x: 680, y: 312, cls: 'dv box', tex: "{\\pa}_{\\text{new}}={\\pa}-{\\pal}\\,L'({\\pa})" },
    { id: 'steps', x: 380, y: 300, cls: 'tbl', html: `<table><tr><th>k</th><th>a</th><th>L′(a)</th><th>새 a</th></tr>${stepRows}</table>` },
    { id: 'e1', x: 640, y: 175, cls: 'dv', tex: "L'({\\pa})=26{\\pa}-52=26({\\pa}-2)" },
    { id: 'e2', x: 640, y: 265, cls: 'dv', tex: '{\\pa}_{\\text{new}}={\\pa}-{\\pal}\\cdot26({\\pa}-2)' },
    { id: 'e3', x: 640, y: 355, cls: 'dv', tex: '{\\pa}_{\\text{new}}-2=({\\pa}-2)-26{\\pal}({\\pa}-2)' },
    { id: 'e4', x: 640, y: 455, cls: 'dv box', tex: '{\\pa}_{\\text{new}}-2=(1-26{\\pal})({\\pa}-2)' },
    { id: 'cond', x: 650, y: 890, cls: 'pill yellow', tex: '|1-26{\\pal}|<1\\;\\Rightarrow\\;0<{\\pal}<\\tfrac{1}{13}\\approx0.077' },
  ];

  const CHAPTERS = ['꼭짓점', '공식 없이', '방향', '보폭', '한 걸음씩', '왜 될까', '학습률', '정리'];
  const CH_TITLES = ['이차함수의 꼭짓점', '공식이 없다면?', '기울기 = 방향', '한 걸음의 크기', '한 걸음씩 내려가기', '왜 꼭짓점으로 갈까?', '학습률 α', '정리'];

  /* ---------- 상태 ---------- */
  function baseState() {
    return {
      chap: -1, chapTag: null, introO: 0, introT: 0, introQ: 0, sumO: 0, sumRows: [0, 0, 0, 0, 0],
      mascot: { ...K.MASCOT_HOME, wave: 0, o: 0 }, talk: 99,
      main: { o: 0, draw: 0, k: 1, tx: 0, ty: 0 }, vtx: 0,
      ball: { a: 1, o: 0, y: 0, mood: 'smile' }, ghost: { a: 1.8, o: 0 },
      tan: 0, tanGhost: 0, step: { o: 0, a1: 1, a2: 1 }, stepGhost: 0,
      fog: 0, inset: 0, rows: [0, 0, 0, 0, 0], bars: 0, barRows: [0, 0, 0, 0, 0, 0],
      panels: 0, pk: [0, 0, 0],
      lab: {}, labS: {}, board: null, caption: null,
    };
  }
  const newChapter = (s, i, lt) => {
    s.chap = i; s.lab = {}; s.labS = {};
    s.chapTag = i < CH_TITLES.length - 1 ? { text: `${i + 1}장 · ${CH_TITLES[i]}`, o: popIn(lt, .1, .45) * (1 - fade(lt, 3.4, .35)) } : null;
  };
  /* k번째 걸음: t0 에 화살표, t0+0.8 에 폴짝 (반환: 현재 a, 화살표 정도, 폴짝 높이) */
  function hops(lt, seq, t0, gap, jump = 70) {
    let a = seq[0], h = 0, arrow = { o: 0, a1: seq[0], a2: seq[0] };
    for (let k = 0; k < seq.length - 1; k++) {
      const ts = t0 + k * gap;
      if (lt < ts) break;
      arrow = { o: fade(lt, ts, .3) * (1 - fade(lt, ts + 1.6, .3)), a1: seq[k], a2: seq[k + 1] };
      const q = prog(lt, ts + .8, .7);
      a = lerp(seq[k], seq[k + 1], q);
      h = Math.sin(Math.PI * q) * jump;
    }
    return { a, h, arrow };
  }

  /* ---------- 타임라인 ---------- */
  const tl = window.Motion.timeline();

  tl.beat(7.5, (s, lt) => {
    s.introO = 1 - prog(lt, 6.6, .7);
    s.introT = Math.min(lt, 7.5);
    s.introQ = popIn(lt, 2.2, .6);
    const q = prog(lt, 6.2, 1.1), H = K.MASCOT_HOME;
    s.mascot = { x: lerp(520, H.x, q), y: lerp(600, H.y, q) - Math.sin(Math.PI * q) * 120, k: lerp(2.1, H.k, q), wave: 1 - fade(lt, 5.4, .6), o: popIn(lt, .2, .7) };
    say(s, lt, '안녕! 오늘은 손실함수의 가장 낮은 곳을 기울기만 보고 찾아가는 방법, 경사하강법을 식까지 유도해 볼 거예요.', 1.2);
  });

  tl.chapter('1. 이차함수의 꼭짓점');
  tl.beat(24, (s, lt) => {
    newChapter(s, 0, lt);
    s.main = { o: fade(lt, .2, .5), draw: prog(lt, .4, 2), k: 1, tx: 0, ty: 0 };
    Object.assign(s.lab, { v1: fade(lt, 4), v2: fade(lt, 8.4), v3: fade(lt, 9.6) });
    s.vtx = popIn(lt, 13.6, .6);
    s.board = { key: 'vertex', items: [fade(lt, .8), fade(lt, 9.8), fade(lt, 14)] };
    say(s, lt, '지난 편에서 만든 손실함수예요. 13 a 제곱 빼기 52 a 더하기 53.', .3);
    say(s, lt, '완전제곱식으로 바꿔 볼게요. 13으로 묶고, a − 2의 제곱을 만들면…', 4);
    say(s, lt, '13 (a − 2)² + 1이 돼요.', 9);
    say(s, lt, '(a − 2)²은 0보다 작아질 수 없으니까, a가 2일 때 손실이 가장 작은 1이에요. 꼭짓점은 (2, 1)!', 13.4);
    say(s, lt, '이렇게 식이 간단하면 공식으로 바로 찾을 수 있어요.', 19.6);
  });

  tl.chapter('2. 공식이 없다면?');
  tl.beat(20, (s, lt) => {
    newChapter(s, 1, lt);
    s.fog = fade(lt, .4, 1);
    s.vtx *= 1 - fade(lt, 0, .5);
    s.ball = { a: 1, o: popIn(lt, 2.4, .5), y: 0, mood: 'worry' };
    s.tan = fade(lt, 8, .6);
    s.board = { key: 'fog', items: [fade(lt, 1), fade(lt, 8.2)] };
    say(s, lt, '그런데 실제 인공지능은 a 같은 값을 수백만 개나 한꺼번에 정해야 해서, 이렇게 그래프를 그리거나 꼭짓점 공식을 쓸 수가 없어요.', .3);
    say(s, lt, '마치 안개 낀 산 위에 서 있는 것과 같아요. 보이는 건 발밑의 기울기뿐이에요.', 7.6);
    say(s, lt, '그렇다면 기울기만 보고도 가장 낮은 곳을 찾아갈 수 있을까요?', 13.4);
  });

  tl.chapter('3. 기울기 = 방향');
  const D3 = 15;   // 3장 앞부분(미분으로 기울기 구하기)의 길이
  tl.beat(26 + D3, (s, lt) => {
    newChapter(s, 2, lt);
    s.fog *= 1 - fade(lt, 0, 1);
    const roll = prog(lt, 10 + D3, 2.4);
    const a = lerp(1, 3, roll);
    s.ball = { a, o: 1, y: 0, mood: roll > 0 && roll < 1 ? 'happy' : 'smile' };
    s.tan = fade(lt, .5) * (1 - fade(lt, 9.6 + D3, .3)) + fade(lt, 12.6 + D3, .4);
    s.step = { o: fade(lt, 5 + D3, .4) * (1 - fade(lt, 9.6 + D3, .3)) + fade(lt, 14.4 + D3, .4), a1: a, a2: lt < 10 + D3 ? a + .55 : a - .55 };
    Object.assign(s.lab, { m1: fade(lt, .8), m2: fade(lt, 4.8), m3: fade(lt, 10) });
    s.labS.m3 = 1 + .07 * pulse(lt, 10.2, 1.2);
    s.board = { key: 'slope', items: [fade(lt, 10.4), fade(lt, 5.2 + D3), fade(lt, 13.6 + D3), fade(lt, 18.4 + D3)] };
    say(s, lt, '발밑의 기울기는 그 점에서 그은 접선의 기울기예요. 이 값을 그 점에서의 미분계수라고 해요.', .3);
    say(s, lt, '이차함수는 항마다 미분해요. 13a²은 26a, −52a는 −52, 상수 53은 0이 돼요.', 4.6);
    say(s, lt, '모두 모으면 L′(a) = 26a − 52. 어느 점이든 a를 넣으면 그 점의 기울기가 나와요.', 9.8);
    say(s, lt, 'a가 1이면 기울기는 −26. 오른쪽으로 갈수록 내려가니까, 오른쪽으로 가야 해요.', 4.6 + D3);
    say(s, lt, 'a가 3이면 기울기는 +26. 이번엔 왼쪽으로 가야 내려가요.', 12.6 + D3);
    say(s, lt, '기울기가 음수면 오른쪽, 양수면 왼쪽. 즉 기울기와 반대 방향으로 가면 돼요!', 18.2 + D3);
  });

  tl.chapter('4. 한 걸음의 크기');
  tl.beat(24, (s, lt) => {
    newChapter(s, 3, lt);
    const back = prog(lt, 0, 1.6);
    const a = lerp(3, 1, back);
    s.ball = { a, o: 1, y: Math.sin(Math.PI * back) * 60, mood: 'smile' };
    s.tan = fade(lt, 2.2, .4);
    s.step = { o: fade(lt, 3, .4), a1: 1, a2: 1 - ALPHA * dL(1) };
    s.ghost = { a: 1.8, o: popIn(lt, 4.4, .5) };
    s.tanGhost = fade(lt, 4.8, .4);
    s.stepGhost = fade(lt, 5.4, .4);
    Object.assign(s.lab, { d1: fade(lt, 11.4), d2: fade(lt, 13), d3: fade(lt, 16.4) });
    s.labS.d3 = 1 + .07 * pulse(lt, 16.6, 1.2);
    s.board = { key: 'rule', items: [fade(lt, 12), fade(lt, 16.6), fade(lt, 6.4)] };
    say(s, lt, '얼마나 움직일까요? 꼭짓점에서 멀수록 기울기가 가파르고, 가까울수록 완만해요.', .3);

        const lt = s.pk[0];
        const h = hops(lt, pn.seq, 4, 2.6, 60);
        const a = h.a, y = py(L(a)) - 18 - h.h;
        placeKid(pn.kid, px(pn.P, a), y, .8, 1);
        paintKid(pn.kid, { col: pn.col, id: 20, t: V, mood: pn.P.alpha > .077 && lt > 12 ? 'worry' : 'smile' });
        pn.trail.forEach((c, k) => {
          const shown = lt > 4 + (k - 1) * 2.6 + 1.5;
          setA(c, { cx: px(pn.P, pn.seq[k]), cy: py(L(pn.seq[k])), opacity: k === 0 || shown ? .9 : 0 });
        });
        pn.res.g.setAttribute('opacity', fade(lt, [5.4, 10.4, 15.4][PANELS.indexOf(pn.P)]));
      });
    }
    drawLabels(s);
    drawBoard(s);
    drawChips(s.chap);
    drawTag(s);
    // 여는 화면 · 정리
    $('intro').style.opacity = s.introO;
    if (s.introO > 0) {
      titleChars.forEach((el, i) => {
        const q = popIn(s.introT, .3 + i * .12, .5);
        el.style.opacity = clamp(q * 2);
        el.style.transform = `translateY(${((1 - q) * 60 + Math.sin(V * 3 + i) * 4).toFixed(1)}px) scale(${(.4 + .6 * q).toFixed(3)})`;
      });
      $('introQ').style.opacity = clamp(s.introQ * 1.5);
      $('introQ').style.transform = `scale(${(.6 + .4 * s.introQ).toFixed(3)}) rotate(-1.5deg)`;
      introKids.forEach(({ k, i, el }) => {
        const q = popIn(s.introT, 2.8 + i * .15, .5);
        placeKid(el, 900 + i * 120, 860 - Math.abs(Math.sin(V * 3 + i)) * 10, 1.6 * q, 1);
        paintKid(el, { col: k.col, id: i, t: V, mood: 'happy' });
      });
    }
    $('summary').style.opacity = s.sumO;
    $('summary').querySelectorAll('[data-row]').forEach((el) => {
      const o = s.sumRows[Number(el.dataset.row)];
      el.style.opacity = clamp(o * 1.5);
      el.style.transform = `translateY(${((1 - o) * 24).toFixed(1)}px) rotate(${el.dataset.tilt || 0}deg) scale(${(.8 + .2 * o).toFixed(3)})`;
    });
    mascot.render(s.mascot, V, talking);
  }

  K.boot({ tl, baseState, draw });
})();

</script>
</body>
</html>
