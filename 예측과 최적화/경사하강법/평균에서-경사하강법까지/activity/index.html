<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="오차와 손실함수, 이차함수의 꼭짓점, 미분계수와 경사하강법의 식과 학습률 조건을 그래프 위 안내를 따라 직접 조작하며 탐구하는 고등학교 인공지능 수학 체험활동입니다.">
<title>손실함수와 경사하강법 실험실</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="activity.css">
<script src="../../../../unit-nav.js" data-unit="predict" data-pos="tab" defer></script>
</head>
<body data-set="main">
<header class="top">
  <a class="pill" href="../index.html">☰ 목록</a>
  <h1>손실함수와 경사하강법 실험실</h1>
  <nav class="stepper" aria-label="활동 단계"><ol id="steps"></ol></nav>
  <button type="button" class="pill" id="resetBtn" title="이 브라우저에 저장된 완료 표시 지우기">↺ 기록 지우기</button>
  <a class="pill watch" id="watch" href="#">▶ 영상</a>

<main class="viewport" id="viewport">

    <div class="stage" id="stage">
      <svg id="scene" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="실험 화면"></svg>
      <svg id="guide" viewBox="0 0 1280 720" width="1280" height="720" aria-hidden="true"></svg>
      <div class="ov" id="ov"></div>
    </div>
  </div>
</main>

<p class="toast" id="toast" role="status" aria-live="polite"></p>

<script src="../_cute-kit/motion-core.js"></script>
<script src="../_cute-kit/kit.js"></script>
<script src="gd-math.js"></script>
<script src="activity.js"></script>

</html>
