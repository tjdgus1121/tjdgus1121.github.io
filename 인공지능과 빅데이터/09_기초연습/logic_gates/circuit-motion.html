:root{
  color-scheme:dark;
  --room:#06080D; --screen:#0E1320; --fg:#F3EFE6; --dim:#8C93A3; --line:#232B3B;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--room);color:var(--fg)}
body{font:15px/1.5 var(--sans)}
.wrap{padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
.col{width:max(min(100%,calc((100vh - 150px) * 16 / 9)),min(100%,520px));display:flex;flex-direction:column;gap:10px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-left:96px;padding-right:52px}
.hd b{font:600 13px var(--mono);letter-spacing:.18em;color:var(--cur)}
.hd span{font:500 13px var(--mono);color:var(--dim)}
.player{position:relative;border-radius:12px;overflow:hidden;background:var(--screen);box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.55)}
#cv{display:block;width:100%;aspect-ratio:16/9;cursor:pointer}
.player:fullscreen{display:grid;place-items:center;border-radius:0;background:#000}
.player:fullscreen #cv{width:min(100vw,calc(100vh * 16 / 9))}
.big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;border:0;background:rgba(243,239,230,.92);color:#0E1320;font-size:30px;padding-left:6px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.bar{display:flex;align-items:center;gap:12px}
.bar button{border:0;background:transparent;color:var(--fg);font:600 15px var(--mono);cursor:pointer;padding:6px 8px;border-radius:8px;min-width:40px}
.bar button:hover{background:var(--line)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--cur);outline-offset:2px}
.time{font:500 13px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
#seek{flex:1;min-width:0;accent-color:var(--cur);height:4px}
.rate{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px}
.rate button{min-width:34px;padding:6px 6px}
#rate{min-width:58px;font-variant-numeric:tabular-nums;color:var(--cur)}
.credit{font:500 12px var(--sans);color:var(--dim);margin:0}
.chapters{display:flex;flex-wrap:wrap;gap:6px}
.chapters button{border:1px solid var(--line);background:transparent;color:var(--dim);font:500 13px var(--sans);border-radius:999px;padding:4px 12px;cursor:pointer}
.chapters button i{font:500 11px var(--mono);font-style:normal;margin-right:6px;opacity:.7}
.chapters button.on{color:var(--fg);border-color:var(--fg)}
.hub-back{position:fixed;top:10px;left:10px;z-index:9999;display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:999px;font:700 13px/1 var(--sans);text-decoration:none;color:#fff;background:rgba(20,20,32,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:.8;transition:opacity .2s}
.hub-back:hover,.hub-back:focus-visible{opacity:1}
@media (max-width:560px){.hd{padding-left:0;padding-top:30px}.bar{gap:6px}.bar button{min-width:34px;padding:6px 4px}}

      Tseg([['0111', FG], [' (7)   +   ', DIM], ['0101', FG], [' (5)', DIM]], 960, 250, { f: MONO, w: 600, size: 50 });
      for (let i = 0; i < 4; i++) {
        const X = 1440 - i * 340, t0 = FAT(i), act = eo(p(t, t0, t0 + .4)), on = act * (1 - .6 * p(t, t0 + 2.2, t0 + 2.6));
        T('A', X - 45, 352, { f: MONO, w: 500, size: 22, c: DIM }); T('B', X + 45, 352, { f: MONO, w: 500, size: 22, c: DIM });
        T(String(FA_A[i]), X - 45, 408, { f: MONO, w: 600, size: 54, c: FA_A[i] ? FG : DIM });
        T(String(FA_B[i]), X + 45, 408, { f: MONO, w: 600, size: 54, c: FA_B[i] ? FG : DIM });
        wire([[X - 45, 444], [X - 45, 484]], FA_A[i] * act, t, { lw: 5 }); wire([[X + 45, 444], [X + 45, 484]], FA_B[i] * act, t, { lw: 5 });
        box(X - 115, 486, 230, 150, 18, { fill: mix(PANEL, CUR, .12 * on), stroke: mix(LINE, CUR, on), lw: 3, glow: on > .5 ? 18 : 0 });
        T('전가산기', X, 546, { f: NOTO, w: 700, size: 30 });
        T('XOR·AND·OR', X, 590, { f: MONO, w: 500, size: 20, c: DIM });
        const sv = eo(p(t, t0 + .9, t0 + 1.3));
        wire([[X, 638], [X, 690]], FA_S[i] * sv, t, { lw: 5 });
        T(String(FA_S[i]), X, 736, { f: MONO, w: 600, size: 64, c: FA_S[i] ? XORC : DIM, a: sv, glow: FA_S[i] ? 18 : 0 });
        const cv2 = eo(p(t, t0 + 1.3, t0 + 1.8));
        wire([[X - 117, 561], [X - 223, 561]], FA_C[i + 1] * cv2, t, { lw: 5 });
        T(String(FA_C[i + 1]), X - 170, 526, { f: MONO, w: 600, size: 30, c: FA_C[i + 1] ? CUR : DIM, a: cv2 });
      }
      wire([[1660, 561], [1557, 561]], 0, t, { lw: 5 }); T('0', 1610, 526, { f: MONO, w: 600, size: 30, c: DIM });
      T('올림', 1610, 600, { f: NOTO, w: 700, size: 22, c: DIM });
      Tseg([['= ', DIM], ['1100', CUR], ['  (12)', DIM]], 960, 830, { f: MONO, w: 600, size: 54, a: eo(p(t, 288.0, 288.6)) });
      ctx.restore();
      cap([['같은 두 입력에서 신호 두 개: ', FG], ['합', XORC], ['과 ', FG], ['올림', ANDC]], t, 276.8, 283.4);
      cap('작은 판단을 이어 붙이면 큰 계산이 된다', t, 284.0, 292.6);
    }
    // B: 신경망의 층
    const aB = sceneA(t, 293.2, 308.8, .5, .6);
    if (aB > 0) {
      ctx.save(); ctx.globalAlpha *= aB;
      const C1 = [], C2 = [];
      for (let k = 0; k < 9; k++) C1.push([420 + (k % 3 - 1) * 110, 530 + ((k / 3 | 0) - 1) * 110]);
      for (let k = 0; k < 4; k++) C2.push([960 + (k % 2 - .5) * 150, 530 + ((k / 2 | 0) - .5) * 150]);
      const e1 = eo(p(t, 295.6, 296.4)), e2 = eo(p(t, 298.6, 299.4));
      C1.forEach(([x, y], i) => C2.forEach(([u, v], j) => {
        line([[x + 48, y], [u - 65, v]], FG, 1.5, .1 * e1);
        const ph = ((t * .7 + i * .13 + j * .29) % 1);
        if (e1 > .5 && (i + j) % 3 === 0) circ(lerp(x + 48, u - 65, ph), lerp(y, v, ph), 4, { fill: CUR, a: .8 * e1 });
      }));
      C2.forEach(([x, y], j) => {
        line([[x + 65, y], [1350, 530]], FG, 2, .14 * e2);
        const ph = ((t * .6 + j * .25) % 1);
        if (e2 > .5) circ(lerp(x + 65, 1350, ph), lerp(y, 530, ph), 5, { fill: CUR, a: .9 * e2 });
      });
      const ANG = [0, 45, 90, 135, 90, 0, 135, 45, 0];
      C1.forEach(([x, y], i) => {
        const k = eo(p(t, 294.0 + i * .08, 294.5 + i * .08)); if (k <= 0) return;
        box(x - 46, y - 46, 92, 92, 12, { fill: PANEL, stroke: LINE, lw: 2, a: k });
        const an = ANG[i] * Math.PI / 180, dx = Math.cos(an) * 30, dy = -Math.sin(an) * 30;
        line([[x - dx, y - dy], [x + dx, y + dy]], FG, 6, k);
      });
      const c2a = j => eo(p(t, 297.0 + j * .15, 297.5 + j * .15));
      C2.forEach(([x, y], j) => {
        const k = c2a(j); if (k <= 0) return;
        box(x - 63, y - 63, 126, 126, 16, { fill: PANEL, stroke: LINE, lw: 2, a: k });
        ctx.save(); ctx.globalAlpha *= k; ctx.strokeStyle = FG; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath();
        if (j === 0) { ctx.ellipse(x, y, 36, 22, 0, 0, Math.PI * 2); ctx.stroke(); circ(x, y, 10, { fill: FG }); }
        if (j === 1) { ctx.ellipse(x, y, 36, 22, 0, 0, Math.PI * 2); ctx.stroke(); circ(x, y, 10, { fill: FG }); }
        if (j === 2) { ctx.moveTo(x - 30, y - 30); ctx.lineTo(x - 30, y + 30); ctx.lineTo(x + 30, y + 30); ctx.stroke(); }
        if (j === 3) { ctx.arc(x, y - 22, 40, Math.PI * .2, Math.PI * .8); ctx.stroke(); }
        ctx.restore();
      });
      const fa = eo(p(t, 300.0, 300.8)), fs = back(p(t, 300.0, 300.7));
      if (fa > 0) {
        ctx.save(); ctx.translate(1500, 530); ctx.scale(fs, fs); ctx.translate(-1500, -530); ctx.globalAlpha *= fa;
        box(1350, 380, 300, 300, 24, { fill: PANEL, stroke: CUR, lw: 3, glow: 20 });
        ctx.strokeStyle = FG; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(1500, 530, 112, 0, Math.PI * 2); ctx.stroke();
        [1458, 1542].forEach(x => { ctx.beginPath(); ctx.ellipse(x, 500, 24, 15, 0, 0, Math.PI * 2); ctx.stroke(); circ(x, 500, 7, { fill: FG }); });
        ctx.beginPath(); ctx.arc(1500, 520, 52, Math.PI * .2, Math.PI * .8); ctx.stroke();
        ctx.restore();
      }
      [['1층', '선 · 모서리', 420, 294.0], ['2층', '모양 · 부분', 960, 297.0], ['3층', '얼굴', 1500, 300.0]].forEach(([h, s, x, t0]) => {
        const k = eo(p(t, t0, t0 + .5));
        T(h, x, 300, { f: BH, size: 48, c: CUR, a: k });
        T(s, x, 760, { f: NOTO, w: 700, size: 32, c: DIM, a: k });
      });
      T('합성곱(CNN) 모션그래픽에서 본 바로 그 구조', 960, 840, { f: NOTO, w: 500, size: 28, c: DIM, a: eo(p(t, 302.4, 303.0)) });
      ctx.restore();
      cap('신경망도 같다: 앞 층의 신호를 다음 층이 조합한다', t, 294.2, 300.8);
      cap('층이 깊을수록 더 복잡한 것을 알아본다', t, 301.2, 308.2);
    }
    // C: 한 문장
    if (t > 308.8) {
      K('한 층 = 예/아니오 한 번', 960, 410, { f: BH, size: 92, c: DIM }, t, 309.0, { stg: .05, out: [315.2, 315.8] });
      K('여러 층 = 예/아니오를 엮은 판단', 960, 580, { f: BH, size: 92, col: i => i < 4 ? CUR : FG }, t, 310.4, { stg: .05, out: [315.2, 315.8] });
      T('그래서 컴퓨터도, 인공지능도 판단을 층으로 쌓는다', 960, 740, { f: NOTO, w: 500, size: 38, c: DIM, a: eo(p(t, 312.2, 312.8)) * (1 - p(t, 315.2, 315.8)) });
    }
    ctx.restore();
  }

  // ───── 장면 11: 정리 (316–334s)
  function sEnd(t) {
    const sa = eo(p(t, 316, 316.5)); if (sa <= 0) return;
    ctx.save(); ctx.globalAlpha = sa;
    chap('SUMMARY', '정리', t, 316, 400);
    const rows = [['AND', '직렬 연결', '둘 다 1이어야 1'], ['OR', '병렬 연결', '하나라도 1이면 1'], ['XOR', '계단 스위치', '서로 다를 때만 1'], ['층', '층 쌓기', '중간 신호를 엮어 복잡한 판단']];
    rows.forEach(([g, a, b], i) => {
      const y = 290 + i * 128, k = eo(p(t, 316.6 + i * .7, 317.2 + i * .7)), c = GC[g] || CUR;
      box(140, y - 54, 1640, 108, 18, { fill: rgba(c, .06), stroke: rgba(c, .5), lw: 2, a: k });
      if (GC[g]) gate(g, 270, y, 70, { a: k, on: .4, label: false });
      else { [[-36, -24], [-36, 24], [0, -30], [0, 0], [0, 30], [36, 0]].forEach(([dx, dy]) => circ(270 + dx, y + dy, 9, { fill: CUR, a: k })); line([[234, y - 24], [270, y - 30], [306, y]], CUR, 2, k * .6); line([[234, y + 24], [270, y + 30], [306, y]], CUR, 2, k * .6); }
      T(g === '층' ? 'LAYER' : g, 380, y + 2, { f: MONO, w: 600, size: 44, c, al: 'left', a: k });
      T(a, 640, y + 2, { f: NOTO, w: 700, size: 40, al: 'left', a: k });
      T(b, 1000, y + 2, { f: NOTO, w: 500, size: 40, c: DIM, al: 'left', a: k });
    });
    const qa = eo(p(t, 320.4, 321.0));
    box(140, 830, 1640, 120, 20, { fill: rgba(OK, .08), stroke: OK, lw: 3, a: qa });
    T('생각해 보기', 190, 890, { f: BH, size: 42, c: OK, al: 'left', a: qa });
    T('우리 주변에서 AND · OR · XOR로 움직이는 장치를 하나 찾아 회로로 그려 보자', 450, 890, { f: NOTO, w: 700, size: 32, al: 'left', a: qa });
    ctx.restore();
  }

  function render(t) {
    const sc = cv.width / W;
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(dots, 0, 0);
    if (t < 13.4) sBoard(t);
    if (t >= 12 && t < 18.2) sDie(t);
    if (t >= 17.2 && t < 34.3) sOne(t);
    if (t >= 34 && t < 66.4) sAND(t);
    if (t >= 66 && t < 94.4) sOR(t);
    if (t >= 94 && t < 130.4) sXOR(t);
    if (t >= 130 && t < 152.4) sTr(t);
    if (t >= 152 && t < 212.3) sSites(t);
    if (t >= 212 && t < 246.4) sL1(t);
    if (t >= 246 && t < 276.4) sL2(t);
    if (t >= 276 && t < 316.4) sWhy(t);
    if (t >= 316) sEnd(t);
  }
  // 배경 점 격자 (한 번만 그림)
  const dots = document.createElement('canvas'); dots.width = W; dots.height = H;
  { const d = dots.getContext('2d'); d.fillStyle = rgba(FG, .05); for (let y = 24; y < H; y += 48) for (let x = 24; x < W; x += 48) { d.beginPath(); d.arc(x, y, 1.6, 0, Math.PI * 2); d.fill(); } }

  // ───── 플레이어
  const $ = id => document.getElementById(id);
  const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  let t = 0, playing = false, seeking = false, last = null, rate = 1;
  function setRate(v) {
    rate = Math.round(Math.min(3, Math.max(.1, v)) * 10) / 10;
    $('rate').textContent = rate.toFixed(1) + '×';
    $('rate').setAttribute('aria-label', `재생 속도 ${rate.toFixed(1)}배, 누르면 1배로`);
  }
  $('slower').onclick = () => setRate(rate - .1);
  $('faster').onclick = () => setRate(rate + .1);
  $('rate').onclick = () => setRate(1);
  $('dur').textContent = `모션그래픽 · ${mmss(END)}`;
  $('seek').max = END;
  const chapEl = $('chapters');
  chapEl.innerHTML = CHAPTERS.map(([s, n], i) => `<button type="button" data-t="${s}"><i>${String(i + 1).padStart(2, '0')}</i>${n}</button>`).join('');
  chapEl.onclick = e => { const b = e.target.closest('[data-t]'); if (b) { t = +b.dataset.t; setPlaying(true); } };
  function setPlaying(v) {
    if (v && t >= END) t = 0;
    playing = v;
    $('pp').textContent = v ? '❚❚' : '▶';
    $('pp').setAttribute('aria-label', v ? '일시정지' : '재생');
    $('bigPlay').hidden = v || t > .05;
  }
  function sizeCanvas() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(320, Math.round(r.width * dpr));
    if (cv.width !== w) { cv.width = w; cv.height = Math.round(w * 9 / 16); }
  }
  new ResizeObserver(sizeCanvas).observe(cv);
  sizeCanvas();
  function tick(now) {
    const dt = last == null ? 0 : Math.min(.1, (now - last) / 1000); last = now;
    if (playing && !seeking) { t += dt * rate; if (t >= END) { t = END; setPlaying(false); } }
    render(t);
    if (!seeking) $('seek').value = t;
    $('time').textContent = `${mmss(t)} / ${mmss(END)}`;
    let ci = 0; CHAPTERS.forEach(([s], i) => { if (t >= s) ci = i; });
    chapEl.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === ci));
    requestAnimationFrame(tick);
  }
  $('pp').onclick = () => setPlaying(!playing);
  $('bigPlay').onclick = () => setPlaying(true);
  cv.onclick = () => setPlaying(!playing);
  $('seek').addEventListener('input', e => { seeking = true; t = +e.target.value; });
  $('seek').addEventListener('change', () => { seeking = false; });
  $('fs').onclick = () => {
    try {
      const pl = $('player');
      const r = document.fullscreenElement ? document.exitFullscreen() : pl.requestFullscreen();
      if (r && r.catch) r.catch(() => {});
    } catch (e) {}
  };
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,button')) { if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return; }
    if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
    if (e.key === 'ArrowRight') { e.preventDefault(); t = Math.min(END, t + 5); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); t = Math.max(0, t - 5); }
    if (e.key === '[') setRate(rate - .1);
    if (e.key === ']') setRate(rate + .1);
  });

  // 글꼴이 준비되면 재생 (캔버스는 글꼴을 미리 불러와야 함)
  const loads = [`400 100px "Black Han Sans"`, `500 40px "Noto Sans KR"`, `700 40px "Noto Sans KR"`, `500 40px "IBM Plex Mono"`, `600 40px "IBM Plex Mono"`]
    .map(f => document.fonts.load(f, '가A1').catch(() => {}));
  Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 3000))]).then(() => {
    const params = new URLSearchParams(location.search);
    if (params.has('t')) { t = +params.get('t'); setPlaying(false); } else setPlaying(true);
  });
  requestAnimationFrame(tick);
})();
</script>
