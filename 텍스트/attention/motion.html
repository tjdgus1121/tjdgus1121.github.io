<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ChatGPT 같은 텍스트 LLM의 핵심인 어텐션을 글자의 숫자 변환, Word2Vec, Query·Key·Value까지 단계별로 보여 주는 모션그래픽입니다.">
<link rel="canonical" href="https://tjdgus1121.github.io/%ED%85%8D%EC%8A%A4%ED%8A%B8/attention/motion.html">
<meta property="og:title" content="LLM 어텐션 — 모션그래픽">
<meta property="og:image" content="https://tjdgus1121.github.io/%ED%85%8D%EC%8A%A4%ED%8A%B8/attention/thumb_motion.jpg">
<link rel="icon" href="../favicon.ico">
<title>LLM 어텐션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: one fixed 1280×720 screen scaled to the window (video player); captions + timeline below at real size. Q/K/V each own a hue; attention weight is a single "heat" hue. */
:root {
  --bg: #E9ECF1;
  --surface: #F9FAFC;
  --ink: #171C28;
  --muted: #5B6375;
  --line: #CDD3DE;
  --off: #DEE2EA;
  --q: #E8590C;
  --q-soft: #FDE4D3;
  --k: #1C6FD1;
  --k-soft: #D7E6FA;
  --v: #2B8A3E;
  --v-soft: #D6EEDB;
  --heat: #C2255C;
  --heat-soft: #F8D9E4;
  --pos: #E8590C;
  --neg: #1C6FD1;
  --ok: #2B8A3E;

  --f-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F16; --surface: #151A24; --ink: #E7EAF1; --muted: #98A0B3; --line: #2A3242; --off: #232A38;
    --q: #FF8A3D; --q-soft: #3D2414; --k: #5AA2F5; --k-soft: #142A45; --v: #5CC774; --v-soft: #15331D;
    --heat: #F06595; --heat-soft: #3E1828; --pos: #FF8A3D; --neg: #5AA2F5; --ok: #5CC774;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F16; --surface: #151A24; --ink: #E7EAF1; --muted: #98A0B3; --line: #2A3242; --off: #232A38;
  --q: #FF8A3D; --q-soft: #3D2414; --k: #5AA2F5; --k-soft: #142A45; --v: #5CC774; --v-soft: #15331D;
  --heat: #F06595; --heat-soft: #3E1828; --pos: #FF8A3D; --neg: #5AA2F5; --ok: #5CC774;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--k); outline-offset: 2px; }
sub, sup { font-size: .6em; }

/* ---------- player shell ---------- */
.app { height: 100%; max-width: 1760px; margin: 0 auto; display: grid; grid-template-columns: 240px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; gap: 10px 20px; padding-inline: 16px; padding-block: 12px; }
.vp { min-height: 0; position: relative; grid-column: 2; grid-row: 1; }
.cap, .bar { grid-column: 2; }

/* left navigation */
.side { grid-column: 1; grid-row: 1 / -1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
.side-h { font: 400 1.35rem var(--f-display); padding: 4px 6px 10px; display: flex; justify-content: space-between; align-items: baseline; }
.side-h small { font: 500 .75rem var(--f-mono); color: var(--muted); }
.chg { display: grid; gap: 2px; }
.chb { appearance: none; position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 11px 12px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.chb:hover { border-color: var(--ink); }
.chn { font: 700 .74rem var(--f-mono); color: var(--muted); }
.cht { font-weight: 700; font-size: .92rem; line-height: 1.3; }
.chd { font: 500 .72rem var(--f-mono); color: var(--muted); }
.chp { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: transparent; }
.chp b { display: block; height: 100%; width: 0; background: var(--heat); }
.chg.cur .chb { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chg.cur .chn, .chg.cur .chd { color: var(--bg); opacity: .7; }
.subs { display: none; gap: 1px; padding: 4px 0 6px 18px; border-left: 2px solid var(--line); margin-left: 16px; }
.chg.cur .subs { display: grid; }
.scb { appearance: none; text-align: left; border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: .84rem; color: var(--muted); line-height: 1.35; }
.scb:hover { background: var(--off); color: var(--ink); }
.scb.cur { background: var(--heat-soft); color: var(--heat); font-weight: 700; }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; }
  .side { grid-column: 1; grid-row: 1; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
  .side-h, .subs, .chg.cur .subs, .chd { display: none; }
  .chb { white-space: nowrap; padding: 8px 12px 10px; }
  .vp, .cap, .bar { grid-column: 1; }
  .vp { grid-row: 2; }
}

/* math */
.mth { font: 400 44px/1.3 "STIX Two Text", "Times New Roman", serif; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
.mth i { font-style: italic; }
.mth .mv { color: var(--q); } .mth .mu { color: var(--k); } .mth .hl { color: var(--heat); }
.mth sub, .mth sup { font-size: .55em; }
.fr { display: inline-grid; text-align: center; vertical-align: middle; }
.fr > span:first-child { border-bottom: 3px solid currentColor; padding: 0 10px 4px; }
.fr > span:last-child { padding: 4px 10px 0; }
.bigop { display: inline-grid; justify-items: center; line-height: .95; vertical-align: middle; }
.bigop > span { font-size: 1.35em; }
.bigop small { font-size: .38em; font-style: italic; }
.mth.sm2 { font-size: 34px; }
.mth.nw { flex-wrap: nowrap; white-space: nowrap; }
.mbox { padding: 14px 24px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); display: grid; gap: 8px; justify-items: center; }
.mbox .ml { font: 700 18px var(--f-mono); color: var(--muted); letter-spacing: .08em; }
.tok.khl { border-color: var(--k); background: var(--k-soft); color: var(--k); }
.quote { font: 500 30px/1.4 "STIX Two Text", serif; font-style: italic; text-align: center; max-width: 900px; }
.quote span { display: block; font: 500 18px var(--f-mono); font-style: normal; color: var(--muted); margin-top: 6px; }
.pairs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 1000px; min-height: 60px; }
.pair { font: 600 24px var(--f-body); padding: 6px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.pair .a { color: var(--q); } .pair .b { color: var(--k); }
.pair.pop { animation: pairin .4s ease; }
@keyframes pairin { from { opacity: 0; transform: translateY(-14px); } }
.lk { display: flex; align-items: center; gap: 26px; }
.lkcol { display: grid; gap: 10px; justify-items: center; }
.lkl { font: 700 20px var(--f-mono); color: var(--muted); }
.oh, .mat { display: grid; gap: 4px; }
.ohc { display: grid; grid-template-columns: 90px 40px; gap: 8px; align-items: center; }
.ohc span { font: 600 17px var(--f-body); text-align: right; color: var(--muted); }
.ohc b { height: 34px; border-radius: 6px; background: var(--off); display: grid; place-items: center; font: 700 18px var(--f-mono); color: var(--muted); transition: background .4s, color .4s; }
.ohc.one b { background: var(--q); color: #fff; }
.mrow { display: flex; gap: 4px; padding: 0 4px; border-radius: 8px; outline: 3px solid transparent; transition: outline-color .4s; }
.mrow.hl { outline-color: var(--q); }
.mrow .vc { --w: 50px; --h: 34px; }
.lksym { font: 400 54px "STIX Two Text", serif; color: var(--muted); }
.plane { width: 460px; height: 460px; }
.plane .ax { stroke: var(--line); stroke-width: 2; }
.plane .grid { stroke: var(--line); stroke-width: 1; opacity: .5; }
.plane text { font: 700 22px var(--f-body); }
.arw { transition: transform 1.4s cubic-bezier(.3,.8,.2,1), opacity .5s; transform-box: view-box; transform-origin: 0 0; }
.plane .lbl { transition: transform 1.4s cubic-bezier(.3,.8,.2,1), opacity .5s; transform-box: view-box; transform-origin: 0 0; }
.gr { display: flex; gap: 46px; align-items: center; }
.gcol { display: grid; gap: 12px; justify-items: start; }
.numtbl { font: 600 24px var(--f-mono); display: grid; grid-template-columns: auto auto auto; gap: 6px 22px; }
.numtbl .h { color: var(--muted); font-size: 18px; }
.numtbl .up { color: var(--ok); }
.sig2 { width: 560px; height: 330px; }
.sig2 .curve { fill: none; stroke: var(--ink); stroke-width: 3.5; }
.sig2 .ax { stroke: var(--line); stroke-width: 2; }
.sig2 text { font: 500 17px var(--f-mono); fill: var(--muted); }
.sig2 .pt2 { transition: transform 1.6s cubic-bezier(.3,.8,.2,1); transform-box: view-box; transform-origin: 0 0; }
.sig2 .pt2 text { font: 700 19px var(--f-body); }
.chip2 { font: 600 22px var(--f-body); padding: 10px 18px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); text-align: center; }
.chip2 b { color: var(--heat); font-family: var(--f-mono); }
.lim { display: flex; gap: 20px; align-items: center; font: 600 24px var(--f-body); padding: 16px 26px; border-radius: 16px; border: 2px dashed var(--heat); }
.lim b { color: var(--heat); }
.sm.cmp { gap: 6px; }
.sm.cmp .track { height: 26px; }
.sm.cmp .smr { grid-template-columns: 110px 70px 40px 520px 80px; }
.sm.cmp .smr .vlbl, .sm.cmp .smr .s, .sm.cmp .smr .pc { font-size: 22px; }
.smr { border-radius: 10px; transition: background .4s; }
.smr.okrow { background: var(--k-soft); }
.smr.okrow .vlbl { color: var(--k); }
.par line { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1s ease; transition-delay: var(--d, 0s); }
.par.draw line { stroke-dashoffset: 0; }
.par text { font: 700 24px var(--f-body); }
.stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform: translate(-50%, -50%) scale(var(--k, .5)); background: var(--surface); border: 1px solid var(--line); border-radius: 28px; overflow: hidden; box-shadow: 0 30px 80px -40px rgba(0,0,0,.35); }
.cap { width: 100%; max-width: 980px; margin: 0 auto; display: grid; gap: 3px; min-height: 5.4em; }
.cap-ch { font: 700 .74rem var(--f-mono); letter-spacing: .08em; color: var(--heat); }
.cap-tx { font-size: clamp(.95rem, 1.7vw, 1.14rem); line-height: 1.6; margin: 0; text-wrap: pretty; }
.cap-tx b { color: var(--heat); }
.cap-tx .q { color: var(--q); font-weight: 700; } .cap-tx .k { color: var(--k); font-weight: 700; } .cap-tx .v { color: var(--v); font-weight: 700; }
.cap-tx.fade { animation: capin .45s ease; }
@keyframes capin { from { opacity: 0; transform: translateY(5px); } }
.bar { width: 100%; max-width: 980px; margin: 0 auto; display: grid; gap: 8px; }
.tl { height: 22px; position: relative; cursor: pointer; display: flex; align-items: center; }
.tl-track { position: absolute; left: 0; right: 0; height: 8px; border-radius: 4px; background: var(--off); overflow: hidden; }
.tl-fill { height: 100%; width: 0; background: var(--heat); }
.tl-mark { position: absolute; top: 3px; width: 2px; height: 16px; background: var(--muted); opacity: .55; pointer-events: none; }
.ctrls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cb { appearance: none; height: 38px; min-width: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: .86rem; font-weight: 500; }
.cb svg { width: 15px; height: 15px; fill: currentColor; }
.cb.main { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; padding: 0 16px; min-width: 96px; }
.cb:hover { border-color: var(--ink); }
.time { margin-left: auto; font: 500 .8rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.toc { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; padding: 16px; z-index: 5; }
.toc-in { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; width: min(560px, 100%); max-height: 86%; overflow: auto; padding: 18px; display: grid; gap: 14px; }
.toc-h { display: flex; justify-content: space-between; align-items: center; }
.toc-h strong { font: 400 1.4rem var(--f-display); }
.toc-g { display: grid; gap: 4px; }
.toc-g > span { font: 700 .72rem var(--f-mono); color: var(--heat); letter-spacing: .08em; }
.toc-i { appearance: none; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.toc-i:hover, .toc-i.cur { background: var(--heat-soft); }
.toc-i em { font-style: normal; font: 500 .78rem var(--f-mono); color: var(--muted); }

/* ---------- canvas (design px) ---------- */
.scn { position: absolute; inset: 0; padding: 44px 64px 40px; display: flex; flex-direction: column; gap: 22px; }
.sh { display: grid; gap: 6px; }
.sh .tag { font: 700 17px var(--f-mono); letter-spacing: .12em; color: var(--heat); }
.sh h2 { margin: 0; font: 400 48px/1.15 var(--f-display); }
.sb { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
.wm { position: absolute; right: 30px; bottom: 18px; font: 600 14px var(--f-mono); color: var(--muted); opacity: .6; letter-spacing: .08em; }
.fx { opacity: 0; transform: translateY(26px); transition: opacity .6s ease, transform .7s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
.fx.in { opacity: 1; transform: none; }
.fade-only { opacity: 0; transition: opacity .6s ease; transition-delay: var(--d, 0s); }
.fade-only.in { opacity: 1; }
.instant *, .instant *::before, .instant *::after { transition: none !important; animation: none !important; }
.note { font: 500 20px var(--f-body); color: var(--muted); text-align: center; }

/* tokens */
.toks { display: flex; gap: 10px; justify-content: center; align-items: flex-end; position: relative; }
.tok { font: 700 30px var(--f-body); padding: 10px 18px; border-radius: 14px; background: var(--bg); border: 2px solid var(--line); white-space: nowrap; transition: background .4s, border-color .4s, color .4s, opacity .4s, transform .4s; display: grid; justify-items: center; gap: 4px; }
.tok small { font: 600 16px var(--f-mono); color: var(--muted); }
.tok.hl { border-color: var(--heat); background: var(--heat-soft); color: var(--heat); }
.tok.qhl { border-color: var(--q); background: var(--q-soft); color: var(--q); }
.tok.dim { opacity: .35; }
.tok.slot { border-style: dashed; color: var(--muted); min-width: 120px; }
.tok.new { border-color: var(--v); background: var(--v-soft); color: var(--v); }
.tid { font: 600 18px var(--f-mono); color: var(--k); }
.arcs { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.arcs path { fill: none; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.1s ease, opacity .5s; transition-delay: var(--d, 0s); }
.arcs.on path { stroke-dashoffset: 0; }
.arcs.faded { opacity: .18; transition: opacity .5s; }
.arcs circle { transition: opacity .5s; transition-delay: var(--d, 0s); opacity: 0; }
.arcs.on circle { opacity: 1; }

/* intro */
.intro { display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; }
.intro .eyb { font: 700 20px var(--f-mono); letter-spacing: .2em; color: var(--heat); }
.intro h1 { margin: 0; font: 400 84px/1.1 var(--f-display); }
.intro p { margin: 0; font: 500 26px var(--f-body); color: var(--muted); }

/* sentence / tokenize */
.raw { font: 700 52px var(--f-body); letter-spacing: .02em; }

/* vectors */
.vec { display: flex; gap: 4px; }
.vc { width: var(--w, 40px); height: var(--h, 40px); border-radius: 7px; background: var(--off); position: relative; overflow: hidden; display: grid; place-items: center; font: 600 13px var(--f-mono); color: var(--ink); }
.vc i { position: absolute; inset: 0; background: var(--c, var(--pos)); opacity: var(--a, 0); transition: opacity .7s, background .7s; }
.vc span { position: relative; }
.vec.q .vc { background: var(--q-soft); color: var(--q); }
.vec.k .vc { background: var(--k-soft); color: var(--k); }
.vec.q .vc, .vec.k .vc { font-size: 24px; font-weight: 700; }
.vlbl { font: 700 26px var(--f-body); min-width: 110px; text-align: right; }
.vrow { display: flex; align-items: center; gap: 22px; }
.emb { display: flex; gap: 60px; align-items: center; }
.vlist { display: grid; gap: 22px; }
.map { width: 520px; height: 380px; border-radius: 22px; border: 1px solid var(--line); background: var(--bg); position: relative; }
.map .ax { position: absolute; font: 500 15px var(--f-mono); color: var(--muted); }
.pt { position: absolute; transform: translate(-50%, -50%) scale(.4); opacity: 0; transition: opacity .5s, transform .6s cubic-bezier(.2,.9,.3,1.4); transition-delay: var(--d, 0s); display: flex; align-items: center; gap: 8px; font: 700 22px var(--f-body); white-space: nowrap; }
.pt i { width: 16px; height: 16px; border-radius: 50%; background: var(--c); flex: none; }
.map.in .pt { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.blob { position: absolute; border-radius: 50%; border: 2px dashed var(--c); opacity: 0; transition: opacity .6s 1.6s; }
.map.in .blob { opacity: .55; }

/* context rows (배) */
.ctx { display: grid; gap: 26px; }
.crow { display: grid; grid-template-columns: 360px auto 120px; gap: 30px; align-items: center; }
.csent { font: 600 30px var(--f-body); }
.csent b { color: var(--heat); }
.cmean { font: 700 24px var(--f-body); color: var(--heat); padding: 6px 14px; border-radius: 10px; background: var(--heat-soft); justify-self: start; }

/* qkv cards */
.qkv { display: flex; gap: 26px; }
.qc { width: 350px; padding: 28px 30px; border-radius: 24px; background: var(--bg); border: 2px solid var(--line); display: grid; gap: 12px; align-content: start; }
.qc .L { font: 400 76px/1 var(--f-display); }
.qc .n { font: 700 24px var(--f-mono); }
.qc p { margin: 0; font: 500 23px/1.45 var(--f-body); }
.qc .an { font: 500 19px var(--f-body); color: var(--muted); border-top: 1px dashed var(--line); padding-top: 12px; }
.qc.Q { border-color: var(--q); } .qc.Q .L, .qc.Q .n { color: var(--q); }
.qc.K { border-color: var(--k); } .qc.K .L, .qc.K .n { color: var(--k); }
.qc.V { border-color: var(--v); } .qc.V .L, .qc.V .n { color: var(--v); }
.matnote { font: 600 24px var(--f-mono); display: flex; gap: 22px; align-items: center; padding: 14px 26px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); }
.matnote .q { color: var(--q); } .matnote .k { color: var(--k); } .matnote .v { color: var(--v); }

/* dot product */
.dp { display: flex; gap: 50px; align-items: center; }
.qside { display: grid; gap: 12px; justify-items: center; }
.qside .lb { font: 700 22px var(--f-mono); color: var(--q); }
.krows { display: grid; gap: 10px; }
.kr { display: grid; grid-template-columns: 120px auto 120px; gap: 20px; align-items: center; padding: 4px 12px; border-radius: 12px; transition: background .4s; }
.kr.cur { background: var(--heat-soft); }
.kr .vlbl { min-width: 0; font-size: 24px; }
.kr .vec .vc { --w: 50px; --h: 38px; font-size: 18px; }
.sc { font: 700 30px var(--f-mono); color: var(--heat); opacity: 0; transition: opacity .5s; transition-delay: var(--d, 0s); text-align: right; }
.kr.scored .sc { opacity: 1; }
.calc { font: 600 26px var(--f-mono); padding: 14px 24px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
.calc .q { color: var(--q); } .calc .k { color: var(--k); } .calc b { color: var(--heat); }

/* softmax */
.sm { display: grid; gap: 10px; }
.smr { display: grid; grid-template-columns: 120px 90px 50px 560px 90px; gap: 16px; align-items: center; }
.smr .vlbl { min-width: 0; font-size: 26px; }
.smr .s { font: 600 26px var(--f-mono); color: var(--muted); text-align: right; }
.smr .ar { font: 600 24px var(--f-mono); color: var(--muted); text-align: center; }
.track { height: 34px; border-radius: 8px; background: var(--off); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: var(--heat); border-radius: 8px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
.sm.go .track i { width: var(--p); }
.smr .pc { font: 700 28px var(--f-mono); color: var(--heat); opacity: 0; transition: opacity .5s; transition-delay: calc(var(--d, 0s) + .6s); }
.sm.go .pc { opacity: 1; }
.total { font: 700 26px var(--f-mono); color: var(--ok); justify-self: end; }
.formula-mini { font: 600 26px var(--f-mono); color: var(--muted); }

/* weighted sum */
.ws { display: grid; gap: 28px; justify-items: center; }
.vals { display: flex; gap: 14px; }
.vb { display: grid; justify-items: center; gap: 8px; }
.vb .blk { width: 110px; height: 70px; border-radius: 12px; background: var(--c); opacity: .9; }
.vb .nm { font: 700 22px var(--f-body); }
.vb .wt { font: 700 22px var(--f-mono); color: var(--heat); }
.stack { width: 900px; height: 74px; border-radius: 14px; overflow: hidden; display: flex; background: var(--off); }
.stack i { height: 100%; width: 0; background: var(--c); transition: width .9s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
.stack.go i { width: var(--p); }
.stlbl { font: 700 24px var(--f-body); display: flex; gap: 14px; align-items: center; }
.ba { display: flex; gap: 28px; align-items: center; font: 600 26px var(--f-mono); }
.ba .tok { font-size: 30px; }
.ba .after { border-color: #F59F00; background: color-mix(in srgb, #F59F00 18%, var(--surface)); }

/* matrix */
.mx { display: grid; grid-template-columns: 120px repeat(10, 46px); gap: 4px; align-items: center; }
.mx .rl { font: 700 20px var(--f-body); text-align: right; padding-right: 10px; transition: color .3s; }
.mx .cl { font: 700 17px var(--f-body); text-align: center; writing-mode: vertical-rl; height: 92px; display: flex; align-items: flex-end; justify-content: center; }
.mx .cell { width: 46px; height: 40px; border-radius: 6px; background: var(--off); position: relative; overflow: hidden; }
.mx .cell i { position: absolute; inset: 0; background: var(--heat); opacity: 0; transition: opacity .5s; transition-delay: var(--d, 0s); }
.mx .cell.mask { background: repeating-linear-gradient(45deg, var(--off) 0 6px, transparent 6px 12px); opacity: .7; }
.mx .cell.focus { outline: 3px solid var(--ink); outline-offset: 2px; z-index: 1; }
.mx .rl.focus { color: var(--heat); }
.mxwrap { display: flex; gap: 46px; align-items: center; }
.legend { display: grid; gap: 16px; width: 300px; }
.legend div { display: flex; gap: 12px; align-items: center; font: 500 21px var(--f-body); }
.legend .sw { width: 34px; height: 26px; border-radius: 6px; flex: none; }
.axl { font: 700 18px var(--f-mono); color: var(--muted); }

/* heads */
.heads { display: flex; gap: 18px; }
.hd { display: flex; gap: 10px; align-items: center; padding: 10px 18px; border-radius: 12px; border: 2px solid var(--line); font: 600 21px var(--f-body); transition: border-color .4s, background .4s, opacity .4s; opacity: .45; }
.hd i { width: 18px; height: 18px; border-radius: 50%; background: var(--c); }
.hd.on { opacity: 1; border-color: var(--c); }

/* stack of blocks */
.tower { display: flex; gap: 60px; align-items: center; }
.blocks { display: grid; gap: 10px; position: relative; width: 520px; }
.blkrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.blkrow > div, .blkone { padding: 14px; border-radius: 12px; text-align: center; font: 700 22px var(--f-body); }
.ba1 { background: var(--heat-soft); color: var(--heat); }
.ff { background: var(--k-soft); color: var(--k); }
.blkone { background: var(--bg); border: 1px solid var(--line); }
.blkone.top { background: var(--v-soft); color: var(--v); border: 0; }
.dots { text-align: center; font: 700 30px var(--f-mono); color: var(--muted); line-height: .8; }
.pulse { position: absolute; left: -36px; width: 20px; height: 20px; border-radius: 50%; background: var(--q); box-shadow: 0 0 18px var(--q); bottom: 10px; opacity: 0; }
.blocks.go .pulse { opacity: 1; animation: rise 3s ease-in-out infinite; }
@keyframes rise { 0% { bottom: 10px; } 85% { bottom: calc(100% - 30px); opacity: 1; } 100% { bottom: calc(100% - 30px); opacity: 0; } }
.facts { display: grid; gap: 16px; width: 480px; }
.fact { padding: 18px 22px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); font: 500 22px/1.45 var(--f-body); }
.fact b { font-family: var(--f-mono); color: var(--heat); }

/* next token */
.nt { display: grid; gap: 34px; justify-items: center; }
.probs { display: grid; gap: 10px; }
.pr { display: grid; grid-template-columns: 120px 560px 80px; gap: 16px; align-items: center; }
.pr .w { font: 700 28px var(--f-body); text-align: right; }
.pr .track i { background: var(--v); }
.probs.go .track i { width: var(--p); }
.pr .pc { font: 700 26px var(--f-mono); color: var(--v); opacity: 0; transition: opacity .5s .8s; }
.probs.go .pc { opacity: 1; }
.pr.pick .w { color: var(--v); }

/* formula */
.fm { font: 600 54px var(--f-mono); display: flex; align-items: center; gap: 12px; }
.fm .q { color: var(--q); } .fm .k { color: var(--k); } .fm .v { color: var(--v); }
.frac { display: inline-grid; justify-items: center; font-size: 46px; }
.frac .num { padding: 0 10px 6px; border-bottom: 4px solid var(--ink); }
.frac .den { padding-top: 6px; }
.ann { display: grid; grid-template-columns: repeat(4, 250px); gap: 18px; }
.an { padding: 18px 20px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.an code { font: 700 24px var(--f-mono); color: var(--heat); }
.an span { font: 500 20px/1.45 var(--f-body); }

/* outro */
.steps4 { display: grid; grid-template-columns: repeat(4, 255px); gap: 18px; }
.s4 { padding: 22px 22px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); display: grid; gap: 10px; align-content: start; }
.s4 .no { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 700 22px var(--f-mono); }
.s4 strong { font: 400 30px var(--f-display); }
.s4 span { font: 500 20px/1.45 var(--f-body); color: var(--muted); }

<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage'), scn = document.getElementById('scn');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var INSTANT = false, pending = [], posInBeat = 0;

  var ctx = {
    $: function (s) { return scn.querySelector(s); },
    $$: function (s) { return Array.prototype.slice.call(scn.querySelectorAll(s)); },
    later: function (fn, ms) { if (INSTANT) fn(); else pending.push({ due: posInBeat + ms, fn: fn }); },
    every: function (fn, ms, n) { for (var k = 1; k <= n; k++) (function (k) { ctx.later(function () { fn(k); }, ms * k); })(k); },
    show: function (sel) { ctx.$$(sel).forEach(function (e) { e.classList.add('in'); }); },
    add: function (sel, cls) { ctx.$$(sel).forEach(function (e) { e.classList.add(cls); }); }
  };

  /* ---------- toy data (illustrative numbers) ---------- */
  var TOK = ['고양이', '가', '생선', '을', '먹었다', '.', '그것', '은', '배', '가'];
  var IDS = [48213, 117, 30552, 121, 9874, 13, 22710, 125, 6602, 117];
  var COL = ['#F59F00', '#A3ABB8', '#12B886', '#A3ABB8', '#7950F2', '#C5CBD5', '#E64980'];
  var QV = [2, 0, 1, 1];
  var KV = [[1.2, 0.2, 0.6, 0], [0, 1, 0.1, 0.1], [0.6, 0.1, 0.2, 0.2], [0, 0.9, 0, 0.1], [0.2, 0.3, 0.3, 0.2], [0, 0.5, 0, 0], [0.2, 0.2, 0.2, 0.2]];
  var dot = function (a, b) { return a.reduce(function (s, x, i) { return s + x * b[i]; }, 0); };
  var SC = KV.map(function (k) { return Math.round(dot(QV, k) * 10) / 10; });
  function softmax(xs) { var m = Math.max.apply(null, xs), e = xs.map(function (x) { return Math.exp(x - m); }), s = e.reduce(function (a, b) { return a + b; }, 0); return e.map(function (x) { return x / s; }); }
  var W = softmax(SC);
  var PCT = W.map(function (w) { return Math.round(w * 100); });
  var fmt1 = function (x) { return (Math.round(x * 10) / 10).toFixed(1); };

  // full causal attention matrix (illustrative rules; row 6 = the exact numbers above)
  var MX = TOK.map(function (t, i) {
    if (i === 6) return W.concat([0, 0, 0]);
    var s = [];
    for (var j = 0; j <= i; j++) {
      var v = 0;
      if (j === i) v += 1.0;
      if (j === i - 1) v += 1.6;
      if (i === 4 && (j === 0 || j === 2)) v += 2.1;
      if (i === 7 && j === 0) v += 1.1;
      if (i === 8 && j === 6) v += 2.0;
      if (i === 8 && j === 0) v += 1.3;
      if (i === 9 && j === 0) v += 0.8;
      s.push(v);
    }
    var w = softmax(s);
    while (w.length < 10) w.push(0);
    return w;
  });

  function toksHTML(list, opts) {
    opts = opts || {};
    return list.map(function (t, i) {
      return '<div class="tok' + (opts.cls && opts.cls[i] ? ' ' + opts.cls[i] : '') + (opts.fx ? ' fx' : '') + '" data-i="' + i + '"' + (opts.fx ? ' style="--d:' + (i * (opts.step || 0.08)) + 's"' : '') + '>' + t + (opts.ids ? '<small class="tid fade-only" style="--d:' + (i * 0.1) + 's">' + IDS[i] + '</small>' : '') + '</div>';
    }).join('');
  }
  function vecHTML(vals, cls, w, h, showNum) {
    return '<div class="vec ' + (cls || '') + '">' + vals.map(function (v) {
      var c = v >= 0 ? 'var(--pos)' : 'var(--neg)';
      return '<div class="vc" style="--w:' + (w || 40) + 'px;--h:' + (h || 40) + 'px"><i style="--c:' + c + ';--a:' + (cls ? 0 : Math.abs(v) * 0.9) + '"></i>' + (showNum ? '<span>' + v + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function setVec(el, vals) {
    Array.prototype.slice.call(el.querySelectorAll('.vc i')).forEach(function (i, n) {
      var v = vals[n]; i.style.setProperty('--c', v >= 0 ? 'var(--pos)' : 'var(--neg)'); i.style.setProperty('--a', Math.abs(v) * 0.9);
    });
  }
  // arcs over a token row: pairs [from, to, weight]
  function drawArcs(c, rowSel, pairs, color, id) {
    var row = c.$(rowSel), host = row.parentElement;
    if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
    var k = stage.getBoundingClientRect().width / 1280 || 1;
    var hb = host.getBoundingClientRect();
    var toks = Array.prototype.slice.call(row.querySelectorAll('.tok'));
    var pos = toks.map(function (t) { var r = t.getBoundingClientRect(); return { x: (r.left + r.width / 2 - hb.left) / k, y: (r.top - hb.top) / k }; });
    var paths = pairs.map(function (p, n) {
      var a = pos[p[0]], b = pos[p[1]], y = Math.min(a.y, b.y) - 6;
      var h = 40 + Math.abs(a.x - b.x) * 0.32;
      var sw = 2.5 + (p[2] || 0.5) * 12;
      return '<path pathLength="1" d="M' + a.x + ' ' + y + ' C' + a.x + ' ' + (y - h) + ' ' + b.x + ' ' + (y - h) + ' ' + b.x + ' ' + y + '" stroke="' + color + '" stroke-width="' + sw + '" style="--d:' + (n * 0.25) + 's"/>' +
        '<circle cx="' + b.x + '" cy="' + y + '" r="' + (5 + (p[2] || 0.5) * 5) + '" fill="' + color + '" style="--d:' + (n * 0.25 + 0.9) + 's"/>';
    }).join('');
    var old = host.querySelector('.arcs[data-id="' + id + '"]'); if (old) old.remove();
    host.insertAdjacentHTML('beforeend', '<svg class="arcs" data-id="' + id + '" width="' + hb.width / k + '" height="' + hb.height / k + '">' + paths + '</svg>');
    var svg = host.lastElementChild;
    if (INSTANT) svg.classList.add('on'); else ctx.later(function () { svg.classList.add('on'); }, 40);
    return svg;
  }

  /* ---------- scenes ---------- */
  var S = [];

  S.push({
    chap: '시작', tag: 'INTRO', title: 'LLM 어텐션', head: false,
    body: '<div class="intro"><div class="fx"><div class="eyb">TEXT LLM · ATTENTION</div></div><h1 class="fx" style="--d:.15s">단어들은 서로를<br>얼마나 쳐다볼까</h1>' +
      '<div class="toks fx" id="itok" style="margin-top:120px">' + toksHTML(TOK) + '</div></div>',
    beats: [
      { d: 5000, cap: 'ChatGPT나 Claude 같은 텍스트 LLM의 핵심 부품은 <b>어텐션(attention)</b>입니다. 이 영상에서 그 원리를 단계별로 살펴봅니다.', run: function (c) { c.show('.intro > .fx:not(.toks)'); } },
      { d: 6200, cap: '"고양이가 생선을 먹었다. 그것은 배가 …" 여기서 <b>그것</b>은 무엇을 가리킬까요? 사람은 바로 고양이라는 걸 압니다.', run: function (c) {
        c.$('#itok').classList.add('in'); c.later(function () { c.$('#itok .tok[data-i="6"]').classList.add('hl'); }, 1600);
      } },
      { d: 7000, cap: '모델도 "그것"을 처리할 때 앞 단어들을 둘러보고, <b>고양이</b>에 가장 많은 주의를 기울입니다. 선 굵기가 주의의 양입니다. 이 둘러보기가 어텐션입니다.', run: function (c) {
        c.$('#itok .tok[data-i="6"]').classList.add('hl');
        drawArcs(c, '#itok', [[6, 0, W[0]], [6, 2, W[2]], [6, 4, W[4]]], 'var(--heat)', 'a');
      } }
    ]
  });

  S.push({
    chap: '글자를 숫자로', tag: 'CH 1 · 토큰화', title: '먼저 문장을 토큰으로 자른다',
    body: '<div class="raw fx">고양이가 생선을 먹었다. 그것은 배가</div><div class="toks" id="ttok">' + toksHTML(TOK, { fx: true, ids: true }) + '</div>',
    beats: [
      { d: 5200, cap: '모델은 글자를 그대로 읽지 못합니다. 먼저 문장을 <b>토큰</b>이라는 조각으로 자릅니다.', run: function (c) { c.show('.raw'); } },
      { d: 6400, cap: '토큰은 단어일 수도, 단어의 일부일 수도 있습니다. "고양이가"는 "고양이" + "가"처럼 나뉠 수 있습니다. 실제로 어떻게 자르는지는 모델마다 다릅니다.', run: function (c) { c.show('#ttok .tok'); } },
      { d: 6400, cap: '각 토큰은 사전에 있는 <b>번호(ID)</b>로 바뀝니다. 지난 영상에서 본 것처럼 이 번호도 컴퓨터 안에서는 이진수입니다. (번호는 예시)', run: function (c) { c.show('.tid'); } }
    ]
  });

  var EMB = { '고양이': [.8, .3, -.5, .6, -.2, .7, .1, -.4], '생선': [.2, .9, -.3, -.6, .5, .1, -.7, .3], '배': [-.1, .4, .6, .2, -.5, -.3, .5, .1] };
  var PTS = [['고양이', .2, .26, '#F59F00'], ['강아지', .3, .17, '#F59F00'], ['호랑이', .13, .4, '#F59F00'], ['생선', .68, .3, '#12B886'], ['고기', .8, .2, '#12B886'], ['밥', .74, .45, '#12B886'], ['자동차', .38, .78, '#7950F2'], ['버스', .56, .84, '#7950F2'], ['기차', .3, .9, '#7950F2']];
  S.push({
    chap: '글자를 숫자로', tag: 'CH 1 · 임베딩', title: '토큰마다 숫자 목록(벡터)이 붙는다',
    body: '<div class="emb"><div class="vlist">' + Object.keys(EMB).map(function (t, i) {
      return '<div class="vrow fx" style="--d:' + (i * 0.4) + 's"><span class="vlbl">' + t + '</span>' + vecHTML(EMB[t], '', 44, 44) + '</div>';
    }).join('') + '<div class="note fx" style="--d:1.4s;text-align:left">주황 = 양수, 파랑 = 음수 · 진할수록 큰 값</div></div>' +
      '<div class="map" id="map"><span class="ax" style="left:16px;top:12px">의미 공간 (2차원으로 단순화)</span>' +
      '<div class="blob" style="--c:#F59F00;left:30px;top:30px;width:200px;height:150px"></div><div class="blob" style="--c:#12B886;left:310px;top:40px;width:190px;height:150px"></div><div class="blob" style="--c:#7950F2;left:110px;top:260px;width:250px;height:110px"></div>' +
      PTS.map(function (p, i) { return '<div class="pt" style="left:' + (p[1] * 520) + 'px;top:' + (p[2] * 380) + 'px;--c:' + p[3] + ';--d:' + (i * 0.15) + 's"><i></i>' + p[0] + '</div>'; }).join('') + '</div></div>',
    beats: [
      { d: 7000, cap: '번호 하나로는 뜻을 담을 수 없어서, 각 토큰을 수백~수천 개의 숫자 목록(<b>벡터</b>)으로 바꿉니다. 이것을 <b>임베딩</b>이라고 합니다. 여기서는 8칸만 그렸습니다.', run: function (c) { c.show('.vrow'); c.show('.vlist .note'); } },
      { d: 7400, cap: '학습이 끝나면 뜻이 비슷한 단어의 벡터끼리 가까이 모입니다. 동물은 동물끼리, 음식은 음식끼리, 탈것은 탈것끼리. (수천 차원을 2차원 그림으로 단순화했습니다)', run: function (c) { c.$('#map').classList.add('in'); } }
    ]
  });

  /* ---------- word2vec chapter (math) ---------- */
  var MV = function (s) { return '<i class="mv">v</i><sub><i>' + s + '</i></sub>'; };
  var MU = function (s) { return '<i class="mu">u</i><sub><i>' + s + '</i></sub>'; };
  var TT = '<sup>⊤</sup>';
  var frac = function (a, b) { return '<span class="fr"><span>' + a + '</span><span>' + b + '</span></span>'; };
  var SUM = function (sub, sup) { return '<span class="bigop">' + (sup ? '<small>' + sup + '</small>' : '') + '<span>Σ</span><small>' + sub + '</small></span>'; };
  var dLdv = frac('∂<i>L</i>', '∂' + MV('c'));
  var r2 = function (x) { return (Math.round(x * 100) / 100).toFixed(2); };

    side.querySelectorAll('.chg').forEach(function (g, i) {
      var ch = CHAPS[i];
      g.classList.toggle('cur', i === ci);
      g.querySelector('.chp b').style.width = Math.max(0, Math.min(1, (el - ch.start) / (ch.end - ch.start))) * 100 + '%';
    });
    side.querySelectorAll('.scb').forEach(function (b) { b.classList.toggle('cur', +b.dataset.s === si); });
  }
  var lastNavChap = -1;
  setInterval(function () {
    navSync();
    var ci = S[BEATS[cur].s].ci;
    if (ci !== lastNavChap) { lastNavChap = ci; var g = side.querySelector('.chg[data-c="' + ci + '"]'); if (g && g.scrollIntoView) g.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
  }, 250);

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); bPlay.click(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); document.getElementById('bNext').click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); document.getElementById('bPrev').click(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); var ci = S[BEATS[cur].s].ci + (e.key === 'ArrowDown' ? 1 : -1);
      if (ci >= 0 && ci < CHAPS.length) loadAt(S[CHAPS[ci].scenes[0]].first);
    }
  });

  var vp = document.getElementById('vp');
  function fit() { var r = vp.getBoundingClientRect(); stage.style.setProperty('--k', Math.max(0.1, Math.min(r.width / 1280, r.height / 720))); }
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(vp); else window.addEventListener('resize', fit);
  fit();

  function start() { loadAt(0); setPlaying(!reduce); requestAnimationFrame(function (t) { lastT = t; tick(t); }); }
  // wait for web fonts so token positions (used by the arcs) are measured with the final face
  if (document.fonts && document.fonts.ready) { var done = false; document.fonts.ready.then(function () { if (!done) { done = true; start(); } }); setTimeout(function () { if (!done) { done = true; start(); } }, 1500); }
  else start();
})();
</script>
