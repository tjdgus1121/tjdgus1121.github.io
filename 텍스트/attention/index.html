<style>
  :root{--ink:#1f1e24;--sub:#6a6873;--line:#e4e0d6}
  *{box-sizing:border-box}
  html,body{margin:0;background:#F6F5F2;color:var(--ink);font-family:'Noto Sans KR','Malgun Gothic',sans-serif}
  .hub{max-width:1080px;margin:0 auto;padding:64px 24px 72px}
  .crumb{font-size:14px;color:var(--sub);margin:0}
  .crumb a{color:var(--sub)}
  .hub h1{font-size:clamp(36px,5.4vw,56px);letter-spacing:-.03em;line-height:1.12;margin:12px 0 14px}
  .lead{font-size:clamp(18px,2.2vw,22px);color:#4a4852;margin:0 0 40px}
  .paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
  /* ── 카드 입체감: 두께 + 깊은 그림자, 마우스를 따라 3D로 기울고 빛이 비침 ── */
  .paths{perspective:1100px}
  .path{position:relative;display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid rgba(20,20,30,.07);border-radius:18px;overflow:hidden;
        transform-style:preserve-3d;will-change:transform;
        box-shadow:0 1px 2px rgba(20,20,30,.08),0 4px 10px rgba(20,20,30,.06),0 18px 36px -14px rgba(20,20,30,.24);
        transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s cubic-bezier(.2,.8,.2,1)}
  .path::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .25s;
        background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.55),rgba(255,255,255,0) 55%)}
  .path.tilt{transition:transform .08s linear,box-shadow .08s linear}
  .path.tilt::after{opacity:1}
  .path:active{transform:translateY(2px) !important;box-shadow:0 1px 2px rgba(20,20,30,.1),0 3px 8px rgba(20,20,30,.08) !important}
  .path:focus-visible{outline:3px solid #2F5FA8;outline-offset:6px}
  .thumb{aspect-ratio:16/9;overflow:hidden;background:#ece8de;box-shadow:inset 0 -1px 0 rgba(40,30,10,.08)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .path.tilt .thumb img,.path:hover .thumb img{transform:scale(1.04)}
  .cap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px 24px}
  .cap h2{margin:0;font-size:26px;letter-spacing:-.02em}
  .cap p{margin:6px 0 0;font-size:16px;color:var(--sub)}
  .go{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:700;background:var(--c);
       box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.18),0 4px 10px -3px rgba(0,0,0,.35);transition:transform .2s ease}
  .path:hover .go{transform:translateX(3px)}
  @media (max-width:760px){.paths{grid-template-columns:minmax(0,1fr)}.hub{padding:68px 16px 48px}.lead{margin-bottom:28px}}
  @media (prefers-reduced-motion:reduce){.path,.path:active,.go,.path:hover .go,.thumb img{transition:none;transform:none !important}}
</style>

<script>
/* 카드 3D 기울기: 마우스(정밀 포인터)에서만, '움직임 줄이기'면 끔 */
(function () {
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var MAX = 9;
  document.querySelectorAll('.path').forEach(function (c) {
    c.addEventListener('pointermove', function (e) {
      var r = c.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      var rx = (0.5 - py) * MAX * 2, ry = (px - 0.5) * MAX * 2, sx = (0.5 - px) * 26, sy = 18 + (0.5 - py) * 10;
      c.classList.add('tilt');
      c.style.transform = 'translateY(-8px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
      c.style.boxShadow = '0 2px 4px rgba(20,20,30,.08),' + (sx * .5).toFixed(1) + 'px 10px 18px rgba(20,20,30,.1),' + (sx * 1.4).toFixed(1) + 'px ' + (sy * 2).toFixed(1) + 'px 52px -14px rgba(20,20,30,.32)';
      c.style.setProperty('--gx', (px * 100).toFixed(1) + '%'); c.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
    });
    c.addEventListener('pointerleave', function () { c.classList.remove('tilt'); c.style.transform = ''; c.style.boxShadow = ''; });
  });
})();
</script>
