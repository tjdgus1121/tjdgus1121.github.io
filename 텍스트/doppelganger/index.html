<!doctype html>
<!--
  도플갱어를 찾아라 — 인간 좌표평면 아이스브레이킹 (단일 HTML)

  ■ 사용 방법
    · 이 파일 하나만 있으면 됩니다. 인터넷 주소가 있는 곳(학교 홈페이지, GitHub Pages, Netlify, Firebase Hosting 등)에 올리면
      진행자는 그 주소에서 "새 방 만들기", 학생은 QR/4자리 코드로 참가합니다.
    · PC에서 더블클릭해 열면 진행자 화면은 동작하지만, 학생 휴대폰은 인터넷 주소가 있어야 들어올 수 있습니다.
    · Firebase 설정값은 아래 script 의 FIREBASE_CONFIG 에 들어 있습니다(비우면 같은 PC 탭끼리만 되는 데모 모드).

  ■ Firebase Realtime Database 규칙 (콘솔 → Realtime Database → 규칙 탭)
    아래 내용을 규칙 편집기에 통째로 붙여넣고 게시하세요. (이미 다른 규칙이 있다면 기존 "rules": { ... } 안에 "doppel" 묶음만 추가)
    게임 데이터는 doppel/rooms/ 아래에만 저장됩니다.

{
  "rules": {
    "doppel": {
      "rooms": {
        "$room": {
          ".read": true,
          ".write": "$room.matches(/^[0-9]{4}$/)",
          "createdAt": {
            ".validate": "newData.isNumber()"
          },
          "cur": {
            ".validate": "newData.isNumber() && newData.val() >= 0 && newData.val() <= 4"
          },
          "phase": {
            ".validate": "newData.isString() && newData.val().matches(/^(lobby|question|map|nearest|laser|insight)$/)"
          },
          "final": {
            ".validate": "newData.isBoolean()"
          },
          "rounds": {
            "$i": {
              "t": {
                ".validate": "newData.isString() && newData.val().length <= 12"
              },
              "e": {
                ".validate": "newData.isString() && newData.val().length <= 8"
              },
              "q": {
                "$k": {
                  ".validate": "newData.isString() && newData.val().length <= 20"
                }
              },
              "$other": {
                ".validate": false
              }
            }
          },
          "players": {
            "$pid": {
              ".validate": "newData.hasChild('name')",
              "name": {
                ".validate": "newData.isString() && newData.val().length >= 1 && newData.val().length <= 12"
              },
              "emoji": {
                ".validate": "newData.isString() && newData.val().length <= 8"
              },
              "ans": {
                "$r": {
                  "x": {
                    ".validate": "newData.isNumber() && newData.val() >= -4 && newData.val() <= 4"
                  },
                  "y": {
                    ".validate": "newData.isNumber() && newData.val() >= -4 && newData.val() <= 4"
                  },
                  "z": {
                    ".validate": "newData.isNumber() && newData.val() >= -4 && newData.val() <= 4"
                  },
                  "$other": {
                    ".validate": false
                  }
                }
              },
              "bot": {
                ".validate": "newData.isBoolean()"
              },
              "joinedAt": {
                ".validate": "newData.isNumber()"
              },
              "$other": {
                ".validate": false
              }
            }
          },
          "$other": {
            ".validate": false
          },
          "qi": {
            ".validate": "newData.isNumber() && newData.val() >= 0 && newData.val() <= 2"
          }
        }
      }
    }
  }
}
-->

    --bg:#1C1530;--dot:#271E42;--surface:#2A2145;--surface-2:#33295A;--ink:#FFF4E0;--ink-2:#E5DAF7;--muted:#AFA2CE;--faint:#5F5485;
    --line:#0D0918;--grid:#3A2F60;--axis:#E5DAF7;
    --accent:#A48CFF;--accent-ink:#1C1530;--accent-soft:#3B2F6B;
    --hot:#FF7AA2;--hot-soft:#4D2240;--ok:#38D9A9;--ok-soft:#173D35;--danger:#FF6B6B;
    --pink:#E8638F;--yellow:#F2C230;--mint:#3CC9A0;--sky:#4D9DE0;--orange:#F08C3C;--purple:#8F75E8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1530;--dot:#271E42;--surface:#2A2145;--surface-2:#33295A;--ink:#FFF4E0;--ink-2:#E5DAF7;--muted:#AFA2CE;--faint:#5F5485;
  --line:#0D0918;--grid:#3A2F60;--axis:#E5DAF7;
  --accent:#A48CFF;--accent-ink:#1C1530;--accent-soft:#3B2F6B;
  --hot:#FF7AA2;--hot-soft:#4D2240;--ok:#38D9A9;--ok-soft:#173D35;--danger:#FF6B6B;
  --pink:#E8638F;--yellow:#F2C230;--mint:#3CC9A0;--sky:#4D9DE0;--orange:#F08C3C;--purple:#8F75E8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{word-break:keep-all;overflow-wrap:break-word;background:radial-gradient(var(--dot) 2px,transparent 2.2px) 0 0/26px 26px,var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.fun{font-family:var(--font-fun);font-weight:400}
h1,h2,h3,h4{font-family:var(--font-fun);font-weight:400;margin:0}

/* 버튼 · 카드: 굵은 테두리 + 입체 그림자 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-fun);font-size:17px;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:8px 16px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap;position:relative;top:0}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:#fff}
.btn.pink{background:var(--pink);color:#2B2140}
.btn.yellow{background:var(--yellow);color:#2B2140}
.btn.mint{background:var(--mint);color:#2B2140}
.btn.big{font-size:22px;padding:13px 18px;border-radius:20px;width:100%;box-shadow:0 6px 0 var(--line)}
.btn.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.btn.sm{font-size:14px;padding:4px 11px;border-radius:12px;border-width:2.5px;box-shadow:0 3px 0 var(--line)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:active{transform:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{width:100%;border:3px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-size:18px;font-family:var(--font-fun)}
.inp:focus{outline:4px solid var(--yellow);outline-offset:0}
select.inp{font-size:16px}
.card{background:var(--surface);border:3px solid var(--line);border-radius:var(--r);box-shadow:0 6px 0 var(--line)}
.muted{color:var(--muted)}
.mode-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-fun);font-size:14px;padding:2px 10px;border-radius:999px;border:2.5px solid var(--line);background:var(--yellow);color:#2B2140}
.mode-badge.live{background:var(--mint)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px) scale(.9);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:16px;font-family:var(--font-fun);font-size:17px;opacity:0;pointer-events:none;transition:.25s cubic-bezier(.3,1.5,.5,1);z-index:50;max-width:calc(100vw - 32px);border:3px solid var(--line)}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.avatar{display:inline-grid;place-items:center;border-radius:50%;border:3px solid var(--line);background:var(--c,var(--surface-2));flex:none;line-height:1}

/* 애니메이션 */
@keyframes pop{0%{transform:scale(0)}65%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes bounceIn{0%{transform:translateY(24px) scale(.85);opacity:0}60%{transform:translateY(-6px) scale(1.03);opacity:1}100%{transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-12px) rotate(var(--rot,0deg))}}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:1}100%{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.pt.pop{animation:pop .55s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d,0ms);transform-box:fill-box;transform-origin:center}
.beam{stroke-dasharray:100;animation:draw .9s cubic-bezier(.5,0,.3,1) both;animation-delay:var(--d,0ms)}
.bounce{animation:bounceIn .6s cubic-bezier(.3,1.4,.5,1) both}
.wiggle{animation:wiggle .9s ease-in-out infinite}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;border:2px solid var(--line);animation:fall 2.2s cubic-bezier(.3,.6,.6,1) forwards}
@media (prefers-reduced-motion:reduce){
  .pt.pop,.beam,.bounce,.wiggle,.float,.hop{animation:none!important}
  .confetti{display:none}
}

/* 시작 화면 */
.home{max-width:920px;margin:0 auto;padding:34px 16px 60px;position:relative}
.hero{text-align:center;padding:30px 18px 26px;position:relative;margin-bottom:22px}
.hero .float{position:absolute;font-size:40px;animation:float 3.2s ease-in-out infinite}
.hero h1{font-size:52px;line-height:1.1;letter-spacing:-.01em;margin:12px 0 8px;color:var(--ink);text-shadow:3px 3px 0 var(--yellow)}
.hero h1 em{font-style:normal;color:var(--hot)}
.hero .lead{color:var(--ink-2);font-size:18px;margin:0 auto;max-width:560px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.home .card{padding:22px}
.home h2{font-size:26px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.home h2 .avatar{width:48px;height:48px;font-size:26px}
.home p{margin:0 0 14px;color:var(--muted);font-size:16px}
.code-inp{font-size:34px;letter-spacing:.35em;text-align:center;font-variant-numeric:tabular-nums;padding:8px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;row-gap:44px;margin-top:40px}
.level{padding:0 16px 18px;text-align:center;display:flex;flex-direction:column;align-items:center}
.level .avatar{display:grid;width:58px;height:58px;font-size:30px;margin:-30px auto 10px;box-shadow:0 4px 0 var(--line)}
.level b{display:block;font-family:var(--font-fun);font-weight:400;font-size:19px}
.level .lv{display:inline-block;font-family:var(--font-fun);font-size:12.5px;line-height:1.5;padding:0 10px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink-2);margin-bottom:6px}
.level p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.level .lt{display:flex;flex-direction:column;align-items:center}
.level.bounce{animation-delay:var(--d,0ms)}
/* 게임 방법 팝업 */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(43,33,64,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:min(1000px,100%);padding:22px 26px 24px;max-height:calc(100vh - 32px);overflow:auto}
.modal-h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.modal-h h2{font-size:32px;flex:1}
.modal-h .avatar{width:52px;height:52px;font-size:28px;box-shadow:0 4px 0 var(--line)}
.modal .x{border:3px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;font-size:24px;line-height:1;box-shadow:0 3px 0 var(--line);padding:0;flex:none}
.modal .intro{color:var(--ink-2);font-size:17px;margin:2px 0 34px}
.modal .intro b{color:var(--hot)}
.levels.in-modal{margin-top:0;row-gap:40px}
.modal-f{display:flex;align-items:center;gap:14px;margin-top:24px;flex-wrap:wrap}
.modal-f .body{flex:1;min-width:240px;font-size:15px;color:var(--ink-2);background:var(--surface-2);border:2.5px solid var(--line);border-radius:14px;padding:8px 12px}
.modal-f .btn.big{width:auto;min-width:220px}
.modal.small{width:min(620px,100%);text-align:center}
.trow{border:2.5px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px;background:var(--surface)}
.trow.now{background:var(--surface-2);box-shadow:0 0 0 3px var(--orange)}
.trow .th{display:flex;align-items:center;gap:8px}
.trow .tn{font-family:var(--font-fun);font-size:13px;color:var(--muted);white-space:nowrap}
.trow b{font-family:var(--font-fun);font-weight:400;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tq{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:13px;color:var(--ink-2)}
.qchip{display:flex;gap:6px;align-items:center}
.qchip i{font-style:normal;font-family:var(--font-fun);font-size:15px;width:12px}
.modal.wiz{width:min(900px,100%)}
.wiz-dots{display:flex;gap:8px;margin:8px 0 14px}
.wiz-dots span{flex:1;height:26px;border-radius:999px;border:2.5px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-fun);font-size:15px;color:var(--muted)}
.wiz-dots span.on{background:var(--c);color:#fff}
.wiz-dots span.now{background:var(--c);color:#fff;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.qopt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:12px 10px;border:3px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--line);font-family:var(--font-fun);font-size:17px;transition:transform .08s}
.qopt:hover{background:var(--surface-2);transform:translateY(-2px)}
.qopt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.qopt.cur{background:var(--yellow);color:#2B2140}
.qopt:disabled{opacity:.3;box-shadow:none;cursor:not-allowed;transform:none}
.qopt .n{text-align:right}.qopt .p{text-align:left}
.qopt i{font-style:normal;color:var(--muted);font-size:14px}
.wiz-sum{display:flex;flex-direction:column;gap:8px}
.srow2{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border:3px solid var(--line);border-left:10px solid var(--c);border-radius:16px;font-family:var(--font-fun);font-size:20px}
.srow2 .ax{color:var(--c);font-size:24px}
.srow2 i{font-style:normal;color:var(--muted);font-size:15px}
.srow2 span:nth-child(2){text-align:right}
.modal.small .modal-h h2{text-align:left}
.modal.small .modal-f{justify-content:center}
.how-msg{font-family:var(--font-fun);font-size:clamp(20px,3vw,28px);line-height:1.45;margin:18px 0 18px;color:var(--ink)}
.how-msg b{font-weight:400;color:var(--hot)}
.how-ex{background:var(--surface-2);border:2.5px solid var(--line);border-radius:16px;padding:12px 14px}
.how-ex .poles2{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-fun);font-size:18px}
.how-ex .scale{margin-top:8px;gap:4px}
.how-ex .scale span{height:30px;font-size:14px}
@media (max-width:640px){
  .modal{padding:16px 14px 16px}
  .modal-h h2{font-size:24px}
  .modal .intro{font-size:15px;margin-bottom:14px}
  .levels.in-modal{grid-template-columns:1fr;row-gap:8px}
  .in-modal .level{flex-direction:row;align-items:center;text-align:left;padding:10px 12px;gap:12px}
  .in-modal .level .avatar{margin:0;width:46px;height:46px;font-size:24px;flex:none}
  .in-modal .level .lt{align-items:flex-start}
  .in-modal .level .lv{margin-bottom:2px}
  .modal-f .btn.big{width:100%}
}

/* 진행자 화면 */
.host{display:grid;grid-template-rows:auto auto 1fr;height:100vh;min-height:640px}
.host-top{display:flex;align-items:center;gap:12px;padding:10px 18px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-fun);font-size:24px}
.logo .avatar{width:40px;height:40px;font-size:22px;background:var(--purple)}
.host-top .spacer{flex:1}
.stage-tabs{display:flex;gap:8px}
.stage-tabs button{display:flex;align-items:center;gap:6px;font-family:var(--font-fun);font-size:17px;border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:6px 14px 6px 8px;box-shadow:0 4px 0 var(--line);color:var(--muted);transition:transform .08s}
.stage-tabs button .e{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface-2);font-size:17px}
.stage-tabs button.on{background:var(--sc);color:#2B2140;transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.stage-tabs button.on .e{background:#fff}
.stage-tabs button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.banner{margin:4px 18px 0;display:flex;align-items:center;gap:16px;padding:12px 18px;background:var(--sc,var(--sky));border:3px solid var(--line);border-radius:var(--r);box-shadow:0 6px 0 var(--line);color:#2B2140}
.banner .em{width:68px;height:68px;font-size:38px;background:#fff;box-shadow:0 4px 0 var(--line)}
.banner .step{font-family:var(--font-fun);font-size:16px;opacity:.75}
.banner .msg{font-family:var(--font-fun);font-size:30px;line-height:1.2}
.banner .msg small{display:block;font-family:var(--font-body);font-size:16px;font-weight:700;opacity:.8;margin-top:3px}
.host-main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;padding:18px;min-height:0}
.plane-area{min-height:0;display:flex;align-items:center;justify-content:center;gap:18px;position:relative}
.plane-card{height:100%;max-height:calc(100vh - 190px);aspect-ratio:1;max-width:100%;padding:8px;flex:0 1 auto;min-width:0;display:flex}
.plane-card svg{width:100%;height:100%}
.side{overflow-y:auto;overflow-x:hidden;padding:2px 4px 10px;display:flex;flex-direction:column;gap:16px;min-height:0}
.side .card{padding:14px 16px}
.side h3{font-size:18px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.join{display:flex;gap:14px;align-items:center}
.join .qr{width:128px;height:128px;flex:none;background:#fff;border-radius:16px;padding:8px;display:grid;place-items:center;border:3px solid var(--line)}
.join .qr svg,.join .qr img{width:100%;height:100%}
.digits{display:flex;gap:5px}
.digits span{display:grid;place-items:center;width:44px;height:56px;font-family:var(--font-fun);font-size:38px;background:var(--yellow);color:#2B2140;border:3px solid var(--line);border-radius:12px;box-shadow:0 4px 0 var(--line)}
.url{font-size:12px;color:var(--muted);word-break:break-all;overflow-wrap:anywhere;margin-top:10px}
.count{font-family:var(--font-fun);font-size:18px}
.count b{font-weight:400;font-size:34px;color:var(--accent)}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:14px;padding:2px 3px 2px 3px;border-radius:999px;background:var(--surface);border:2.5px solid var(--line)}
.pchip .avatar{width:26px;height:26px;font-size:15px;border-width:2px}
.pchip.wait{opacity:.45}
.pchip .c{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.pchip button{border:0;background:transparent;color:var(--faint);padding:0 5px;font-size:16px;line-height:1}
.pchip button:hover{color:var(--danger)}
.axes-now{font-family:var(--font-fun);font-size:18px;padding:8px 12px;border-radius:14px;background:var(--surface-2);border:2.5px solid var(--line);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.axes-now span{font-size:13px;color:var(--muted)}
.axes-now .rd{margin-left:auto;font-size:14px;background:var(--accent);color:#fff;padding:0 9px;border-radius:999px}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.me-row{display:flex;align-items:center;gap:8px;font-family:var(--font-fun);font-size:17px}
.me-row .avatar{width:34px;height:34px;font-size:19px;border-width:2.5px}
.me-row .spacer{flex:1}
.me-msg{margin:8px 0 0;font-size:14.5px}
.me-q{font-family:var(--font-fun);font-size:15px;margin:10px 0 6px}
.me-q i{font-style:normal;font-weight:700}
.me-pick{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.me-pick button{border:2.5px solid var(--line);border-radius:9px;background:var(--c);color:#2B2140;font-family:var(--font-fun);font-size:14px;padding:6px 0;box-shadow:0 2px 0 var(--line)}
.me-pick button:active{transform:translateY(2px);box-shadow:none}
.me-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}
.insight{flex:none;width:360px;padding:18px 18px 20px}
.insight h4{font-size:19px;margin-bottom:12px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center;margin-bottom:14px}
.vs .avatar{width:64px;height:64px;font-size:34px;margin:0 auto 4px;box-shadow:0 4px 0 var(--line)}
.vs b{display:block;font-family:var(--font-fun);font-weight:400;font-size:19px;line-height:1.2}
.vs .xy{font-size:14px;color:var(--muted)}
.vs .v{font-family:var(--font-fun);font-size:26px;color:var(--hot);transform:rotate(-8deg)}
.metric{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:3px solid var(--line);border-radius:16px;margin-top:10px;color:#2B2140}
.metric .k{font-family:var(--font-fun);font-size:18px}
.metric .k small{display:block;font-family:var(--font-body);font-size:12.5px;font-weight:700;opacity:.75}
.metric .v{font-family:var(--font-fun);font-size:34px;font-variant-numeric:tabular-nums}
.metric.far{background:var(--pink)}
.metric.same{background:var(--mint)}
.insight p{margin:12px 0 0;font-size:14.5px;color:var(--ink-2)}

/* 좌표평면 글자 */
.pl-tick{fill:var(--muted);font:18px var(--font-fun)}
.pl-label{fill:var(--ink);font:22px var(--font-fun)}
.pl-name{fill:var(--ink);font:17px var(--font-fun);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.pl-emo{font-size:21px;text-anchor:middle;dominant-baseline:central}
.pl-cnt{fill:#2B2140;font:13px var(--font-fun);text-anchor:middle;dominant-baseline:central}

/* 참가자 화면 */
.player{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.p-top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.p-top .room{font-family:var(--font-fun);font-size:16px;background:var(--surface);border:2.5px solid var(--line);border-radius:999px;padding:2px 12px 2px 8px;display:flex;align-items:center;gap:6px}
.p-top .me{display:flex;align-items:center;gap:6px;font-family:var(--font-fun);font-size:17px}
.p-top .me .avatar{width:32px;height:32px;font-size:18px;border-width:2.5px}
.p-top .spacer{flex:1}
.p-card{padding:20px;margin-bottom:16px}
.p-card h2{font-size:28px;margin:0 0 2px}
#jf > h2{text-align:center}
.p-card .sub{color:var(--muted);font-size:15px;margin:0 0 14px}
.avatars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:4px 0 16px}
.avatars button{aspect-ratio:1;border-radius:16px;border:3px solid var(--line);background:var(--surface-2);font-size:28px;display:grid;place-items:center;box-shadow:0 3px 0 var(--line);padding:0}
.avatars button.on{background:var(--yellow);transform:translateY(-3px) scale(1.06);box-shadow:0 6px 0 var(--line)}
.slider{margin:18px 0 6px}
.slider .lab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.slider .lab b{font-family:var(--font-fun);font-weight:400;font-size:21px}
.slider .lab b span{font-size:14px;color:var(--muted);margin-right:4px}
.slider .val{display:grid;place-items:center;width:58px;height:58px;font-family:var(--font-fun);font-size:34px;background:var(--yellow);color:#2B2140;border:3px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);flex:none}
.slider .ctl{display:flex;align-items:center;gap:10px;margin-top:10px}
.slider .ctl button{width:46px;height:46px;border-radius:14px;border:3px solid var(--line);background:var(--surface);font-family:var(--font-fun);font-size:26px;box-shadow:0 3px 0 var(--line);flex:none;padding:0;line-height:1}
.slider .ctl button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.slider .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:2px 56px 0}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:20px;border-radius:99px;border:3px solid var(--line);background:linear-gradient(90deg,var(--sc,var(--accent)) var(--p,50%),var(--surface-2) var(--p,50%));margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--line);box-shadow:0 3px 0 var(--line);cursor:grab}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--line);box-shadow:0 3px 0 var(--line);cursor:grab}
input[type=range]:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.mini{width:100%;max-width:320px;display:block;margin:6px auto 0}
.coord{font-family:var(--font-fun);font-size:58px;text-align:center;line-height:1.1;margin:4px 0 6px;color:var(--accent)}
.res{padding:22px 20px;text-align:center;position:relative}
.kicker{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-fun);font-size:16px;padding:3px 12px;border-radius:999px;border:2.5px solid var(--line);background:var(--sc,var(--sky));color:#2B2140;margin-bottom:12px}
.res .big{font-family:var(--font-fun);font-size:32px;line-height:1.2;margin:6px 0 4px;word-break:keep-all}
.res .crowd{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:6px 0 4px}
.res .crowd .avatar{width:74px;height:74px;font-size:40px;box-shadow:0 5px 0 var(--line)}
.res .crowd .hop{animation:hop 1.4s ease-in-out infinite}
.res .crowd .hop:nth-child(2){animation-delay:.15s}.res .crowd .hop:nth-child(3){animation-delay:.3s}.res .crowd .hop:nth-child(4){animation-delay:.45s}
.res .act{display:inline-block;margin-top:14px;font-family:var(--font-fun);font-size:22px;padding:8px 18px;border-radius:16px;border:3px solid var(--line);background:var(--hot);color:#fff;box-shadow:0 4px 0 var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px;margin:14px auto 0;max-width:300px;text-align:left;background:var(--surface-2);border:2.5px solid var(--line);border-radius:16px;padding:10px 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--font-fun);font-size:18px;font-variant-numeric:tabular-nums}
.cmp{width:100%;border-collapse:separate;border-spacing:0;margin-top:12px;font-size:15px;border:3px solid var(--line);border-radius:16px;overflow:hidden;text-align:left}
.cmp th,.cmp td{padding:9px 8px;border-top:2px solid var(--grid);vertical-align:middle}
.cmp tr:first-child th{border-top:0;background:var(--surface-2);font-family:var(--font-fun);font-weight:400;font-size:15px;color:var(--ink)}
.cmp th{color:var(--muted);font-weight:700;font-size:13px}
.cmp td b{font-family:var(--font-fun);font-weight:400;font-size:18px}
.cmp .hl{background:var(--hot-soft)}
.cmp .hl2{background:var(--ok-soft)}
.pill{display:inline-block;font-family:var(--font-fun);font-size:14px;padding:0 9px;border-radius:999px;background:#fff;border:2px solid var(--line);color:#2B2140}
.dot-live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--line)}
.dot-live.off{background:var(--danger)}

/* 5단계 답하기 */
.qlist{display:flex;flex-direction:column;gap:12px;margin:6px 0 4px}
.qc{border:3px solid var(--line);border-radius:18px;padding:10px 12px 10px;background:var(--surface-2)}
.qc.done{background:var(--surface)}
.qc .qn{font-family:var(--font-fun);font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.axb{font-family:var(--font-fun);font-size:12px;padding:0 8px;border-radius:999px;border:2px solid var(--line);background:var(--yellow);color:#2B2140;line-height:1.5}
.qc .poles{display:flex;justify-content:space-between;gap:8px;font-family:var(--font-fun);font-size:18px;margin:2px 0 8px}
.qc .steps{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 2px}
.qc .steps button{border:3px solid var(--line);border-radius:50%;background:var(--surface);padding:0;display:grid;place-items:center;font-size:16px;box-shadow:0 3px 0 var(--line);transition:transform .12s cubic-bezier(.3,1.5,.5,1)}
.qc .steps button[data-v="-2"],.qc .steps button[data-v="2"]{width:54px;height:54px}
.qc .steps button[data-v="-1"],.qc .steps button[data-v="1"]{width:44px;height:44px}
.qc .steps button[data-v="0"]{width:36px;height:36px}
.qc .steps .neg{--on:var(--sky)}.qc .steps .pos{--on:var(--pink)}.qc .steps .zero{--on:var(--faint)}
.qc .steps button.on{background:var(--on);transform:scale(1.12)}
.qc .sel{text-align:center;font-family:var(--font-fun);font-size:15px;color:var(--accent);margin-top:6px;min-height:22px}
.prog{font-family:var(--font-fun);font-size:15px;color:var(--muted);text-align:center;margin-top:10px}
.myans{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.myans span{font-size:13px;padding:2px 9px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--font-fun)}
/* 진행자: 축 고르기 · 5차원 */
.axsel{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.axsel label{font-family:var(--font-fun);font-size:15px}
details.qedit{margin-top:10px}
details.qedit summary{cursor:pointer;font-family:var(--font-fun);font-size:15px;color:var(--accent)}
.qrow{display:grid;grid-template-columns:44px 1fr auto 1fr 44px;gap:4px;align-items:center;margin-top:6px}
.qrow .inp{padding:6px 6px;font-size:14px;border-width:2.5px;border-radius:10px;text-align:center}
.side-panel{flex:none;width:360px;padding:18px 18px 20px}
.side-panel h4{font-size:19px;margin-bottom:12px}
.pairs{display:flex;flex-direction:column;gap:8px}
.pairrow{display:flex;align-items:center;gap:6px;padding:6px 10px;border:2.5px solid var(--line);border-radius:14px;background:var(--surface-2)}
.pairrow .avatar{width:34px;height:34px;font-size:19px;border-width:2.5px}
.pairrow .nm{font-family:var(--font-fun);font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pairrow .cv{font-family:var(--font-fun);font-size:21px;color:var(--accent);font-variant-numeric:tabular-nums}
.pairrow.anti .cv{color:var(--hot)}
.subh{font-family:var(--font-fun);font-size:15px;color:var(--muted);margin:14px 0 6px}
/* 도플갱어 보드 (진행자 '도플갱어' 단계 오른쪽) */
.nb-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.nb-top h4{margin:0!important;flex:1}
.nb-tour{flex:none}
.nb-tour.on{background:var(--pink);color:#fff}
.nb-sum{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 4px}
.nb-sum span{font-family:var(--font-fun);font-size:13px;padding:2px 9px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2)}
.nb-card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:10px 12px;border:2.5px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 3px 0 var(--line);margin-bottom:8px;transition:transform .08s,box-shadow .08s,background .15s}
.nb-card:hover{transform:translateY(-1px)}
.nb-card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.nb-card.on{background:color-mix(in srgb,var(--pink) 16%,var(--surface));border-color:var(--hot);box-shadow:0 3px 0 var(--hot)}
.nb-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.nb-p{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.nb-p .avatar{width:44px;height:44px;font-size:25px}
.nb-p b{font-family:var(--font-fun);font-weight:400;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-p small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nb-d{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px}
.nb-d .num{font-family:var(--font-fun);font-size:24px;line-height:1;color:var(--hot);font-variant-numeric:tabular-nums}
.nb-d .lab{font-size:11px;color:var(--muted)}
.nb-bar{width:74px;height:8px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2);overflow:hidden}
.nb-bar i{display:block;height:100%;background:var(--hot)}
.nb-calc{margin-top:8px;padding:7px 10px;border-radius:12px;background:var(--surface-2);font-size:13.5px;font-variant-numeric:tabular-nums;text-align:center;line-height:1.5}
.nb-calc b{color:var(--hot)}
.nb-twin{display:flex;align-items:center;gap:8px}
.nb-twin .avs{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.nb-twin .avs .avatar{width:34px;height:34px;font-size:19px;border-width:2.5px}
.nb-twin .zero{font-family:var(--font-fun);font-size:14px;color:var(--hot);white-space:nowrap}
.nb-one{display:flex;align-items:center;gap:6px;padding:6px 10px;margin-bottom:6px;border-radius:12px;border:2px dashed var(--faint);background:transparent;width:100%;font:inherit;color:inherit;cursor:pointer;text-align:left}
.nb-one.on{border:2px solid var(--hot);background:color-mix(in srgb,var(--pink) 12%,var(--surface))}
.nb-one .avatar{width:30px;height:30px;font-size:17px;border-width:2px}
.nb-one .nm{flex:1;min-width:0;font-family:var(--font-fun);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-one .cv{font-family:var(--font-fun);font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.nb-hint{font-size:13px;color:var(--muted);margin:2px 0 10px}
.vs.sm{background:var(--sky);border:3px solid var(--line);border-radius:16px;padding:8px 6px;margin:0;color:#2B2140}
.vs.sm .avatar{width:42px;height:42px;font-size:22px;box-shadow:0 3px 0 var(--line)}
.vs.sm b{font-size:16px}
.vs.sm .xy{color:#2B2140;opacity:.7;font-size:13px}
.vs.sm .v{font-size:17px;color:#2B2140;transform:none;line-height:1.1}
.mini-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;margin-top:6px;padding:8px 10px;border:2.5px solid var(--line);border-radius:14px;background:var(--hot-soft)}
.mini-row .avatar{width:30px;height:30px;font-size:17px;border-width:2px}
/* 참가자: 5개 답 비교 막대 */
.bars{margin-top:14px;text-align:left;display:flex;flex-direction:column;gap:10px}
.bar .t{display:flex;justify-content:space-between;font-family:var(--font-fun);font-size:14px;color:var(--ink-2)}
.bar .track{position:relative;height:34px;border:2.5px solid var(--line);border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--surface-2) 50%,var(--pink))}
.bar .mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;font-size:16px;background:#fff}
.bar .mk.them{top:50%;margin-top:0;box-shadow:0 0 0 3px var(--accent)}
.legend{display:flex;gap:12px;justify-content:center;font-size:13px;color:var(--muted);margin-top:8px}

/* 라운드 · 단계 · 큰 질문 */
.rounds{display:flex;gap:6px;align-items:center}
.rounds button{width:40px;height:40px;border-radius:12px;border:3px solid var(--line);background:var(--surface);font-family:var(--font-fun);font-size:19px;box-shadow:0 3px 0 var(--line);padding:0;color:var(--muted)}
.rounds button.done{background:var(--surface-2);color:var(--ink-2)}
.rounds button.on{background:var(--orange);color:#2B2140;transform:translateY(-2px);box-shadow:0 5px 0 var(--line)}
.rounds button.fin{width:auto;padding:0 10px;font-size:16px}
.rounds button.fin.on{background:var(--purple)}
.next-btn{font-size:19px;padding:8px 18px}
.qstage{display:flex;flex-direction:column;justify-content:safe center;gap:20px;width:100%;max-width:980px;height:100%;max-height:100%;overflow-y:auto;padding:4px 4px 10px}
.qbig{padding:20px 26px 22px}
.qbig .axis{display:inline-block;font-family:var(--font-fun);font-size:18px;padding:1px 12px;border-radius:999px;border:2.5px solid var(--line);background:var(--yellow);color:#2B2140;margin-bottom:6px}
.qbig .poles{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;font-family:var(--font-fun);font-size:clamp(30px,4.2vw,58px);line-height:1.1}
.qbig .poles .neg{text-align:right}
.qbig .poles .vs2{font-size:.55em;color:var(--muted)}
.qbig .poles small{display:block;font-size:.34em;color:var(--muted);margin-top:4px}
.scale{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:16px}
.scale span{height:34px;border-radius:10px;border:2.5px solid var(--line);display:grid;place-items:center;font-family:var(--font-fun);font-size:16px;color:#2B2140}
.answered{padding:16px 20px}
.answered .bar2{height:22px;border:3px solid var(--line);border-radius:999px;background:var(--surface-2);overflow:hidden;margin:8px 0 12px}
.answered .bar2 i{display:block;height:100%;background:var(--mint);transition:width .4s}
.answered .who{display:flex;flex-wrap:wrap;gap:6px}
.answered .who .avatar{width:40px;height:40px;font-size:22px}
.final{width:100%;max-width:1000px;display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
.final .card{padding:20px}
.final h4{font-size:24px;margin-bottom:12px}
.podium .pairrow{padding:10px 14px}
.podium .pairrow .avatar{width:46px;height:46px;font-size:26px}
.podium .pairrow .nm{font-size:20px}
.podium .pairrow .cv{font-size:28px}
.podium .rank{font-family:var(--font-fun);font-size:22px;width:30px;text-align:center}
.bipolar{background:linear-gradient(90deg,var(--sky),var(--surface-2) 50%,var(--pink))!important}
.slider .poles2{display:flex;justify-content:space-between;font-family:var(--font-fun);font-size:17px;margin-top:6px}
.slider .now{text-align:center;font-family:var(--font-fun);font-size:16px;color:var(--accent);min-height:22px;margin-top:2px}
.qhead{font-family:var(--font-fun);font-size:24px;line-height:1.25;text-align:center;margin:4px 0 0}

/* 3D 지도 */
.plane-card{position:relative}
.plane-card canvas,.mini3d{display:block;width:100%;height:100%;touch-action:none;cursor:grab;border-radius:16px}
.plane-card canvas:active,.mini3d:active{cursor:grabbing}
.mini3d{max-width:420px;aspect-ratio:1;height:auto;margin:6px auto 0;background:var(--surface-2)}
.view-btns{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.view-btns button{font-family:var(--font-fun);font-size:13px;border:2.5px solid var(--line);background:var(--surface);border-radius:10px;padding:2px 9px;box-shadow:0 2px 0 var(--line)}
.view-btns button{pointer-events:auto}
.view-btns button.on{background:var(--yellow);color:#2B2140}
.zoom-btns{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.zoom-btns button{font-family:var(--font-fun);font-size:14px;border:2.5px solid var(--line);background:var(--surface);border-radius:10px;padding:2px 10px;box-shadow:0 2px 0 var(--line);min-width:34px}
.zoom-btns button[data-z="in"],.zoom-btns button[data-z="out"]{font-size:18px;padding:0 6px}
.zoom-btns button.on{background:var(--yellow);color:#2B2140}
.zoom-btns .zv{font-family:var(--font-fun);font-size:14px;min-width:4ch;text-align:center;font-variant-numeric:tabular-nums}
.host.wide .host-main{grid-template-columns:minmax(0,1fr)}
.host.wide .side{display:none}
.host.wide .plane-card{aspect-ratio:auto;width:100%;flex:1 1 auto}
.side-panel{max-height:100%;overflow-y:auto}
.pairs.all .pairrow{padding:4px 8px}
.pairs.all .avatar{width:28px;height:28px;font-size:16px;border-width:2px}
.pairs.all .nm{font-size:15px}
.pairs.all .cv{font-size:16px}
.pairrow .to{color:var(--muted);font-family:var(--font-fun);flex:none}
.pairrow .mutual{flex:none;font-size:15px}
.pairrow.lone{opacity:.6}
.final{max-height:100%;overflow-y:auto;padding:2px 4px 6px}
.final{grid-template-columns:1fr 1fr}
.final .how{grid-column:1/-1}
.final .everyone .pairs{max-height:calc(100vh - 400px);min-height:240px;overflow-y:auto;padding-right:4px}
.avatars button.taken{opacity:.22;filter:grayscale(1);cursor:not-allowed;box-shadow:none}
.map-guide{font-size:14px;line-height:1.5;color:var(--ink-2);word-break:keep-all}
.map-guide span{display:block}
.map-guide .guide-touch{display:none}
.map-guide kbd{font:inherit;font-weight:700}
.view-btns .map-guide{flex-basis:100%}
.view-btns .map-guide span{width:fit-content;max-width:100%;padding:4px 8px;border-radius:8px;background:var(--surface)}
.p-card .map-guide{text-align:center;margin:8px auto 0;max-width:420px}
/* PC(넓은 화면 + 마우스): 참가자 화면을 왼쪽 결과 카드 · 오른쪽 큰 3D 지도로 */
@media (min-width:900px) and (hover:hover) and (pointer:fine){
  .player{max-width:1240px;padding:16px 24px 32px}
  #pv>*{max-width:560px;margin-left:auto;margin-right:auto}
  #pv:has(#miniCard:not([hidden])){display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr);gap:22px;align-items:start}
  #pv:has(#miniCard:not([hidden]))>*{max-width:none;margin:0}
  #pv:has(#miniCard:not([hidden])) #res{position:sticky;top:12px}
  #miniCard .mini3d{max-width:none;aspect-ratio:auto;height:calc(100vh - 150px);min-height:480px;max-height:860px;margin-top:0}
  #miniCard .map-guide{max-width:none}
}
@media (hover:none) and (pointer:coarse){
  .map-guide .guide-mouse{display:none}
  .map-guide .guide-touch{display:block}
}
.theme-title{font-family:var(--font-fun);font-size:clamp(28px,3.2vw,44px);text-align:center;line-height:1.1}
.theme-title small{display:block;font-size:.42em;color:var(--muted);margin-top:4px}
.qstage.three{gap:12px}
.qstage.one{gap:14px}
.qstage.one .theme-title{flex:none}
.qdots{display:flex;gap:8px;justify-content:center;flex:none}
.qdots span{width:46px;height:28px;border-radius:999px;border:2.5px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-family:var(--font-fun);font-size:16px;color:var(--muted)}
.qdots span.done{background:var(--c);color:#fff;opacity:.55}
.qdots span.now{background:var(--c);color:#fff;transform:scale(1.15);box-shadow:0 3px 0 var(--line)}
.qbig.huge{padding:22px 30px 26px;flex:none}
.qbig.huge .poles{font-size:clamp(40px,6vw,96px);line-height:1.1}
.qbig.huge .poles .neg,.qbig.huge .poles .pos{text-align:center}
.qbig.huge .poles .e{display:block;font-size:.9em;margin-bottom:6px}
.qbig.huge .poles .vs2{font-size:.4em}
.qbig.huge .scale{margin-top:22px}
.qbig.huge .scale span{height:40px;font-size:18px}
.qbig .scale [data-hv]{cursor:pointer;transition:transform .08s,box-shadow .08s}

function botAnswers() { const o = {}; for (let r = 0; r < NR; r++) o['r' + r] = { x: rnd(), y: rnd(), z: rnd() }; return o; }
function addBots(code, room) {

      const b = M.bestV(mine, vs);
      if (b.c == null) h = `<div class="card res ${fresh ? 'bounce' : ''}">${kicker()}<div style="font-size:56px">⚖️</div><div class="big">비교할 답이 부족해요</div></div>`;
      else {
        const t = b.list[0];
        const rows = room.rounds.map((rd, r) => {
          const a = mine.vec.slice(r * DIM, r * DIM + DIM), c2 = t.vec.slice(r * DIM, r * DIM + DIM);
          if (a.some(x => x == null) || c2.some(x => x == null)) return '';
          const c = M.cos(a, c2);
          return `<div class="tbar"><span class="nm">${esc(rd.e)} ${esc(rd.t)}</span><span class="tr">${c == null ? '' : `<i style="left:calc(8px + (100% - 16px) * ${(c + 1) / 2})"></i>`}</span><span class="cv">${c == null ? '—' : fmt(c)}</span></div>`;
        }).join('');
        const used = mine.vec.filter((v, i) => v != null && t.vec[i] != null).length;
        h = `<div class="card res ${fresh ? 'bounce' : ''}">${kicker()}<div class="crowd">${b.list.slice(0, 4).map(p => av(p, 'hop')).join('')}</div>
          <div class="big">${b.list.map(p => esc(p.name)).join(', ')}</div>
          <dl class="kv"><dt>합친 숫자</dt><dd>${used}개 (${used}차원)</dd><dt>방향 닮음</dt><dd>${fmt(b.c)}</dd></dl>
          <span class="act wiggle">나의 진짜 도플갱어! 🧬</span>
          <div class="subh" style="text-align:left">테마별 궁합 (−1 정반대 ↔ +1 똑같은 방향)</div>
          <div class="tbars">${rows}</div></div>`;
        if (fresh) setTimeout(confetti, 50);
      }
    }
    $('#res').innerHTML = h;
  }
  Store.watchConn(c => { conn = c; const el = $('#live'); if (el) el.classList.toggle('off', !c); });
  unsub = Store.watch(code, r => { room = normRoom(r); render(); });
}

// ───────── 라우팅
async function route() {
  if (unsub) { unsub(); unsub = null; }
  document.onkeydown = null;
  const q = new URLSearchParams(location.search);
  document.body.classList.toggle('in-game', !!(q.get('host') || q.get('room')));
  if (q.get('host')) renderHost(q.get('host'));
  else if (q.get('room')) renderPlayer(q.get('room'));
  else renderHome();
}
window.addEventListener('popstate', route);
try { await Store.init(); route(); }
catch (e) {
  console.error(e);
  $('#app').innerHTML = `<div class="home"><div class="hero"><h1>연결하지 못했어요 😵</h1><p class="lead">Firebase에 연결하지 못했습니다: ${esc(e.message)}</p><p class="muted">인터넷 연결과 FIREBASE_CONFIG 값을 확인해 주세요.</p></div></div>`;
}
window.__doppel = { M, Store };
</script>
</body>
