<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="1536" height="1024" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="0.68" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#173452" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0b1426" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67e8d6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#67e8d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14243d"/>
      <stop offset="1" stop-color="#0f1b30"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#0b1426"/>
  <rect width="600" height="400" fill="url(#bgGlow)"/>
  <g transform="translate(0,-14)">

  <!-- 오른쪽: 단어가 놓이는 3차원 벡터 공간 -->
  <g stroke="#3b5f86" stroke-width="0.8" fill="none" opacity="0.6">
    <path d="M330.0 300.0 L530.0 330.0 L480.0 360.0 L280.0 330.0 Z" fill="#1a3350" fill-opacity="0.25"/>
    <path d="M380.0 307.5 L330.0 337.5 M430.0 315.0 L380.0 345.0 M480.0 322.5 L430.0 352.5 M305.0 315.0 L505.0 345.0 M280.0 330.0 L480.0 360.0 L530.0 330.0" opacity="0.7"/>
  </g>
  <g stroke="#7fa6c9" stroke-width="1.3" fill="#7fa6c9" opacity="0.8">
    <path d="M330 300 V78"/><path d="M330 72 l-4 9 h8 z" stroke="none"/>
    <path d="M330 300 L556.0 334.0"/><path d="M562.9 335.0 L555.4 338.0 L556.6 330.0 z" stroke="none"/>
    <path d="M330 300 L272.0 335.0"/><path d="M266.0 338.6 L269.9 331.6 L274.1 338.4 z" stroke="none"/>
  </g>

  <!-- 다른 단어들(흐린 점) -->
  <g fill="#8fb4d9" opacity="0.45">
    <circle cx="395" cy="190" r="2"/><circle cx="420" cy="232" r="1.6"/><circle cx="548" cy="214" r="1.8"/>
    <circle cx="372" cy="128" r="1.5"/><circle cx="560" cy="140" r="1.6"/><circle cx="452" cy="210" r="1.5"/>
    <circle cx="510" cy="118" r="1.5"/><circle cx="355" cy="240" r="1.6"/><circle cx="586" cy="182" r="1.4"/>
  </g>

  <!-- 과일 군집 -->
  <ellipse cx="500" cy="160" rx="74" ry="48" fill="url(#halo)"/>
  <g fill="#67e8d6" opacity="0.6">
    <circle cx="492" cy="176" r="2"/><circle cx="514" cy="140" r="1.8"/><circle cx="545" cy="160" r="1.6"/>
  </g>

  <!-- 두 벡터와 사이각 -->
  <g stroke-width="2.2" stroke-linecap="round">
    <path d="M330 300 L470 135" stroke="#67e8d6"/>
    <path d="M330 300 L530 185" stroke="#7cc4ff"/>
  </g>
  <path d="M375.3 246.6 A70 70 0 0 1 390.7 265.1" fill="none" stroke="#f3d68a" stroke-width="2"/>
  <text x="399" y="248" fill="#f3d68a" font-size="17" font-style="italic" font-family="Georgia,serif">θ</text>

  <!-- 단어 점 -->
  <g filter="url(#glow)">
    <circle cx="470" cy="135" r="6.5" fill="#67e8d6"/>
    <circle cx="530" cy="185" r="6.5" fill="#7cc4ff"/>
    <circle cx="372" cy="94" r="6.5" fill="#b9a4ff"/>
  </g>
  <g font-size="17" font-weight="700" fill="#eaf6ff">
    <text x="440" y="118">사과</text>
    <text x="541" y="208">과일</text>
    <text x="346" y="76">맛있다</text>
  </g>
  <text x="296" y="386" fill="#f3d68a" font-size="16" font-weight="700">cos θ ≈ 0.9</text>

  <!-- 왼쪽: 문장 → 토큰 → 숫자 벡터 -->
  <rect x="26" y="58" width="196" height="284" rx="18" fill="url(#panel)" stroke="#2c4a6e" stroke-width="1.2"/>
  <g fill="#5f7fa3">
    <circle cx="46" cy="78" r="3"/><circle cx="57" cy="78" r="3"/><circle cx="68" cy="78" r="3"/>
  </g>

  <!-- 토큰에서 공간의 점으로 이어지는 선 -->
  <g fill="none" stroke-width="1.3" stroke-dasharray="3 4" opacity="0.55">
    <path d="M196 114 C 270 114, 300 94, 364 94" stroke="#b9a4ff"/>
    <path d="M172 194 C 300 194, 360 135, 462 135" stroke="#67e8d6"/>
    <path d="M172 274 C 320 274, 420 185, 522 185" stroke="#7cc4ff"/>
  </g>

  <g font-size="21" font-weight="700" fill="#eaf6ff">
    <rect x="44" y="96" width="152" height="38" rx="10" fill="#b9a4ff" fill-opacity="0.16" stroke="#b9a4ff" stroke-width="1.4"/>
    <text x="62" y="122">맛있다</text>
    <rect x="44" y="176" width="128" height="38" rx="10" fill="#67e8d6" fill-opacity="0.16" stroke="#67e8d6" stroke-width="1.4"/>
    <text x="62" y="202">사과</text>
    <rect x="44" y="256" width="128" height="38" rx="10" fill="#7cc4ff" fill-opacity="0.16" stroke="#7cc4ff" stroke-width="1.4"/>
    <text x="62" y="282">과일</text>
  </g>

  <!-- 각 단어의 숫자 벡터(막대 높이 = 값). 사과와 과일은 모양이 비슷하다 -->
  <g fill="#67e8d6">
    <rect x="46" y="230" width="11" height="8" rx="2"/><rect x="61" y="223" width="11" height="15" rx="2"/><rect x="76" y="227" width="11" height="11" rx="2"/><rect x="91" y="220" width="11" height="18" rx="2"/><rect x="106" y="232" width="11" height="6" rx="2"/><rect x="121" y="225" width="11" height="13" rx="2"/><rect x="136" y="229" width="11" height="9" rx="2"/><rect x="151" y="222" width="11" height="16" rx="2"/>
  </g>
  <g fill="#7cc4ff">
    <rect x="46" y="311" width="11" height="7" rx="2"/><rect x="61" y="302" width="11" height="16" rx="2"/><rect x="76" y="308" width="11" height="10" rx="2"/><rect x="91" y="301" width="11" height="17" rx="2"/><rect x="106" y="311" width="11" height="7" rx="2"/><rect x="121" y="306" width="11" height="12" rx="2"/><rect x="136" y="308" width="11" height="10" rx="2"/><rect x="151" y="303" width="11" height="15" rx="2"/>
  </g>
  <g fill="#b9a4ff">
    <rect x="46" y="143" width="11" height="15" rx="2"/><rect x="61" y="153" width="11" height="5" rx="2"/><rect x="76" y="142" width="11" height="16" rx="2"/><rect x="91" y="152" width="11" height="6" rx="2"/><rect x="106" y="144" width="11" height="14" rx="2"/><rect x="121" y="154" width="11" height="4" rx="2"/><rect x="136" y="146" width="11" height="12" rx="2"/><rect x="151" y="151" width="11" height="7" rx="2"/>
  </g>
  </g>
</svg>
